  body_text: '| Next | Section menu | Main menu | Previous | Steven Levy The Big Story
    Mar 4, 2026 6:00 AM How Is Kalshi Not Gambling? On Kalshi, people have placed
    bets on everything from football games to foreign affairs. The prediction market’s
    CEO, Tarek Mansour, says this doesn’t count as gambling—and is actually good for
    society. Photograph: Amy Lombard If you picked Seattle to win Super Bowl LX ,
    there were multiple means to turn your hunch into cash. You could place a wager
    on a betting site like FanDuel or DraftKings. Or you might risk the same amount
    of money by taking a position in the prediction market known as Kalshi . In both
    cases you would have been rewarded. But according to Tarek Mansour , Kalshi’s
    cofounder and CEO, those two acts are completely different. Kalshi is not a gambling
    site, Mansour says. It’s a marketplace, one regulated by the Commodity Futures
    Trading Commission. It’s also a startup, and securing that regulatory approval
    might be its most impressive innovation. Kalshi is allowed to operate in all 50
    states, 20 more than allow online sports betting, and it offers markets not only
    on sports and election results (its most popular categories) but also on a dog’s
    breakfast of events including tomorrow’s temperature in Philadelphia, Taylor Swift
    ’s wedding date, and whether Elon Musk will start a Bluesky account before 2027.
    One might note that some of those categories are, well, prone to manipulation
    by inside players. This hasn’t stopped Kalshi’s growth, which has skyrocketed
    since it officially opened election markets in October 2024. The company has opened
    thousands of markets, handles over $1 billion in trades every week, and was most
    recently valued at $11 billion. (No surprise that Kalshi is the Arabic word for
    “everything.”) Nineteen states, meanwhile, have filed suit against Kalshi, challenging
    the claim that its operations aren’t gambling and don’t fall under their betting
    laws. All of this is quite a jump for Mansour, a self-described math kid with
    mild OCD who was born in California, grew up in Lebanon, and met his cofounder,
    Brazilian-born Luana Lopes Lara, at MIT. Though the decision to labor through
    regulatory hoops before launch was risky, it paid off better than any bet made
    on Kalshi. Mansour also insists Kalshi provides a social good, one that unearths
    better information more than it builds a financial juggernaut. The Big Interview
    Read more deep, weird, smart conversations with the most important people in our
    world. One need not risk money in its “ event contracts ” to observe how quickly
    the wisdom of the Kalshi-verse can assess the likelihood of a given outcome. Kalshi’s
    marketplace beat the polls in predicting both Donald Trump’s reelection and Zohran
    Mamdani ’s primary win in the New York City mayoral race. A recent study indicated
    that forecasts made on Kalshi regarding interest rates performed as well as those
    from Wall Street experts. On the other hand, Mansour admits that the Kashi market
    on the next pope gave Leo XIV a meager chance of generating white smoke. When
    I met Mansour at Kalshi’s headquarters in Lower Manhattan, I found him engagingly
    combative. Four years of dealing with regulators and filing lawsuits honed his
    skills as a verbal warrior who enjoys debate about the social value of his company.
    Facing down critics who claim he’s turning reality into a betting parlor only
    sharpened those skills. Mansour enthusiastically took on the challenge of convincing
    me that a Kalshi Super Bowl position is not the same thing at all, no sir, as
    a straight bet on FanDuel. Putting down money on what song Bad Bunny would sing
    first at halftime , he argues, is no different than buying Tesla stock or life
    insurance. Kalshi will have to set the market on whether or not he persuaded me.
    I can’t predict the future. This interview has been edited for length and clarity.
    Photograph: Amy Lombard STEVEN LEVY: What led you, a kid from Lebanon, to start
    an app based on prediction markets? TAREK MANSOUR: One of the most defining characteristics
    of Lebanon is that there’s a lot of uncertainty. There was much more certainty
    in math than in the outside world. My obsession was to get into MIT. When I got
    there, the people were super smart and motivated. It was a very big widening of
    the aperture. A lot of people were going into finance, which is a very good application
    of math, so in 2016 I went to work at Goldman. That was my first time coming in
    touch with the idea of prediction markets. The vast majority of the demand that
    summer was, will Brexit happen or not? Then it was like, will Trump win the election
    or not? When Brexit came, it was a massive shock, it completely destabilized markets.
    The Trump one was even more striking. So I asked, “What if people could price
    these simple questions about the future?” Markets are an effective, efficient
    way to average out opinions about something. I’m old enough to remember a time
    when it was a shocking revelation to compare Wall Street to a betting parlor—there
    was a famous BusinessWeek article in 1985 called “The Casino Society” decrying
    that the markets were decoupled from actual business results. Now it’s taken for
    granted that valuations are drastically different from profits and losses, and
    are more like speculations on price itself. Kalshi seems like an uncut version
    of that—it’s based on pure speculation. There’s no longer a concept of investing.
    Do you think pricing Brexit and knowing whether Brexit is going to happen or not
    is useful? Why put a price on whether Brexit happens? If it affects the stock
    market, why not actually invest or go short on the actual stocks? I completely
    disagree with that premise. People that had to immigrate from Britain or into
    Britain because Brexit happened would have really benefited from having that forecast.
    Those people probably didn’t have a position in the stock market. The idea that
    what’s going to happen in the world only matters because of how it impacts stock
    prices is a bit bizarre to me. But you’re the one who’s saying you get clarity
    through a market. It’s actually the only way to get clarity. We’ve proven it.
    Yes, you can research a company and figure out where the stock of Apple is going
    to go. You can research where commodity prices are going to go, and you can research
    what the weather is going to be tomorrow, whether Covid is going to come back,
    whether a sports team is going to perform well, and so forth. All the financial
    markets that have ever existed have speculation. There are a subset of people
    that may not do as much research as others but do it because they find it interesting,
    or they find it fun, or they have a little bit of money on the side and want to
    participate. “Markets don’t lie like people do. When people put money on the line,
    they stop lying. It’s amazing.” Kalshi CEO Tarek Mansour But you’re extending
    this beyond financial results to everything, from the words Trump will utter in
    the State of the Union to which band will play the Las Vegas Sphere. People felt
    critical about option markets when they first appeared, too. When CME created
    water futures [in 2020]—it’s a great product that helps predict water scarcity—the
    first headline was “ Now you can bet on water .” That was the moment I realized
    we’re in a business where we’re always going to be criticized. Yes, you are risking
    money to make money on something you don’t control. That is the definition of
    a bet. Could you use the word bet to bet on the stock market? Probably. When people
    came out with life insurance, the initial social response was like, “You are betting
    on people’s death?” Obviously we would agree that life insurance is a good thing
    in society. Any type of trading activity that involves speculation will have some
    similarity to markets. But we regulate gambling bets differently. What’s the difference
    between speculation and gambling? You insist Kalshi is not the latter. Gambling
    is tied to something that is artificial, artificially created for the purpose
    of entertainment, like rolling dice. We’re not talking about speculating on dice
    rolls. We’re talking about speculating on who’s going to win the Super Bowl. That’s
    gambling. Sports is an event that exists whether or not there’s going to be trading
    on it. Whether I am using FanDuel or Kalshi I’m risking $1 to make more if Seattle
    wins and if they lose, I’m out a buck. I don’t see the difference. There’s a fundamental
    difference in mechanism between those two. With gambling, the company is the house.
    Its revenues are equal to the customers’ losses. So the casinos historically have
    developed all these mechanisms to make sure that once you show up, you lose more
    money than you make. But in a financial market, there is no house. [Kalshi takes
    a fee, and the outcomes of events don’t affect its revenues.] No matter what mechanism,
    there’s still a bet made. Maybe you are offering a better deal. As far as the
    customer is concerned, it’s as if your particular casino is offering better odds.
    Better prices is a good thing for society. But there is a fundamental difference.
    When you go to a traditional sportsbook, the odds are stacked against you. Our
    customers are more sharp. They’re a bit like Moneyball . They’re more quantitative.
    They love doing analysis on the economy, and they like the idea that on Kalshi
    you have to be smarter than your neighbor—not smarter than some sort of system
    that’s stacked against you. People do feel that, even in the stock market, the
    system is rigged against them. How are you going to beat the large hedge funds
    today on trading stocks? And the answer is, you probably won’t. It’s impossible
    for an individual to do that. On Kalshi, there’s a level playing field. If you
    have studied a lot about things like inflation, or Covid, or culture, or Taylor
    Swift, or sports, you have an advantage. Gamblers also think research gives them
    an edge, whether it’s playing the horses or studying sports statistics. Obviously
    if you’re betting on events, if you know more you’re more likely to win. Gambling
    is adverse to the end consumer, whereas financial markets are more open and transparent.
    You can enter when you want and you can exit when you want. If you make a lot
    of money at traditional gambling places, you will get shut down. Still, people
    on Kalshi are risking real money, and that can have serious financial consequences.
    Gambling sites have to have long disclaimers and give the phone numbers of Gamblers
    Anonymous and other programs. You don’t have to do that. I can’t see why not.
    The CFTC has an extremely comprehensive customer protection regime, and it has
    existed for decades. You see fewer issues with those markets, even though they’re
    inherently riskier than what you see in sports betting. It’s easy to just criticize
    Kalshi because we’re growing so fast. But we started in 2018 and didn’t launch
    until four years later, because we wanted to get regulated up front. What were
    we doing in those four years? We weren’t just waiting at the beach. What were
    you doing? It’s a bit like getting regulated as a bank. There’s a whole set of
    things that you have to do around market integrity, customer protection, where
    the funds are stored, audits and reporting visibility, and transferring to the
    federal government. You need to show how your entire operation is structured to
    make sure that it’s actually safe, legitimate, and regulated. It’s like you hacked
    the system to get regulated. Hacked? That seems like we did something wrong! Are
    we getting punished now for going regulated? I don’t use the word in a pejorative
    sense.'
