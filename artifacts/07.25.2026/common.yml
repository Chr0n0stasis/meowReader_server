  body_text: 'Summer Culture Preview Goings On Summer Culture Preview What’s coming
    this season in TV, theatre, music, movies, dance, and art. By Inkoo Kang,Jillian
    Steinhauer,Richard Brody,Rhoda Feng,Marina Harss,Sheldon Pearce,Jane Bua May 22,
    2026 In the summer, New York City likes to play outside—quite literally—as with
    the genre-skipping, star-packed music festival Governors Ball; Lincoln Center’s
    congenial “Summer for the City” dance programming on the plaza; the Public Theatre’s
    always electrifying, free Shakespeare in the Park; and the New York Philharmonic’s
    blissfully cultivated borough-hopping parks tour (complete with post-show fireworks),
    among many, many other outdoor performances. If you prefer a dark room with air-conditioning,
    there are revamps of classics from various eras on the small and big screens—including,
    streaming, “Little House on the Prairie,” “Cape Fear,” and “Legally Blonde,” and,
    at the cinema, tales of Odysseus (Christopher Nolan’s “The Odyssey”) and Robin
    Hood (Hugh Jackman carries the quiver). Blockbusters abound, among a murderers’
    row of musical icons, at the Guggenheim’s Pop-art show, and in a movie that sees
    Steven Spielberg dabbling, once again, in aliens. But there’s also plenty that
    is new and unusual: John Early in drag as an addled chef-influencer, in the indie
    flick “Maddie’s Secret”; Clubbed Thumb’s edifying Summerworks series; the Morgan
    Library’s meditation on the history and mysteries of tarot. Have a spritz, catch
    some rays, and, most definitely, see a show. Enjoy our summer culture preview,
    and start making plans. —Shauna Lyon Jump to: Television | Art | Movies | The
    Theatre | Dance | Contemporary Music | Classical Music Television Elle Woods,
    Barack and Larry Hollywood’s current book-adaptation mania is turning the proverbial
    beach read into the beach watch this summer. Many boast fresh premises, foremost
    among them the Peacock drama “The Five-Star Weekend” (premièring on July 9). Based
    on Elin Hilderbrand’s Nantucket-set novel, the series follows a food influencer,
    played by Jennifer Garner, who copes with the sudden death of her husband by bringing
    together friends from different stages of her life—played by the likes of Chloë
    Sevigny and Regina Hall. Across the Atlantic, a schoolteacher in the London suburbs
    (Rebecca Hall) is tormented by a debilitating hum in Starz’s “The Listeners” (June
    12). The show, which Jordan Tannahill adapts from his own best-seller, finds its
    protagonist searching for others unable to escape the mysterious and unrelenting
    noise. A more visceral danger arrives in the form of a vengeance-obsessed Javier
    Bardem in Apple TV’s “Cape Fear” miniseries (June 5), which is inspired by John
    D. MacDonald’s novel “The Executioners” and its two big-screen adaptations. Bardem
    will play the role made famous by Robert De Niro in Martin Scorsese’s 1991 film—that
    of a violent parolee determined to get revenge on the married lawyers who represented
    him at his trial, now played by Amy Adams and Patrick Wilson. The streaming site
    will also see the début of “Lucky” (July 15), starring Anya Taylor-Joy as a con
    woman wanted by both the F.B.I. and an organized-crime boss, in an action thriller
    based on Marissa Stapley’s novel. Next month brings us America’s two-hundred-and-fiftieth
    birthday—an occasion that Barack Obama apparently intends to celebrate through
    a collaboration with Larry David. The unlikely pair are the faces of “Life, Larry,
    and the Pursuit of Unhappiness” (June 26), an HBO sketch show that revisits moments
    in American history through David’s jaundiced, hapless lens. (In one skit, an
    attempt to kiss a nurse in the midst of V-J Day celebrations quickly gets David’s
    character labelled a “pervo.”) A more earnest look at the country’s past will
    be on offer in a new “Little House on the Prairie” series on Netflix (July 9),
    based on Laura Ingalls Wilder’s semi-autobiographical books . Its community-mindedness
    is sure to rival that of Apple TV’s “Ted Lasso” (Aug. 5), whose fourth season
    features good-guy Ted coaching a women’s soccer team, and introducing his London
    friends to the delights of Kansas City barbecue. While much of the country will
    celebrate in red, white, and blue, “Legally Blonde” ’s Elle Woods will spend this
    summer in her signature pink. The character, played by Reese Witherspoon in the
    2001 movie, gets a prequel with Prime Video’s “Elle” (July 1), which takes its
    protagonist (Lexi Minetree) from sun-kissed Bel Air to rain-soaked Seattle. If
    she’s anything like her future self, teen-age Elle is sure to be guided by an
    unerring sense of truth and justice while maintaining her irrepressible girliness.
    What, like it’s hard?— Inkoo Kang Art Pop Art, Tarot History, Pope.L For the most
    part, the art world doesn’t do summer blockbusters. This season, though, a few
    of New York’s museums are mounting decidedly fun shows that could be big hits.
    Chief among them is the Morgan Library & Museum’s “ Tarot! Renaissance Symbols,
    Modern Visions ” (opening June 26), an exhibition that perfectly bridges the institution’s
    scholarly approach with mass appeal. The first section of the show looks at the
    cards’ origins in Renaissance Italy, focussing on an original, hand-painted deck
    from the fifteenth century, when tarot was still a court game. The second part
    centers on tarot as a tool of divination and creative inspiration, beginning with
    the iconic 1909 Rider-Waite-Smith deck and moving on to art works from the twentieth
    century into the present day. The Guggenheim Museum’s summer crowd-pleaser is
    less subtle. “ Guggenheim Pop: 1960 to Now ” (June 5) surveys Pop art through
    the lens of the institution, from landmark early exhibitions to recent acquisitions
    (including questionable ones, such as Maurizio Cattelan’s infamous banana duct-taped
    to the wall). It’s hard to tell what will provide the most photogenic moment:
    posing with Claes Oldenburg and Coosje van Bruggen’s massive soft sculpture of
    a shuttlecock or snapping selfies in a Yayoi Kusama infinity room. Either way,
    expect to wait. Meanwhile, the International Center of Photography continues the
    recent fashion-forward streak among the city’s museums. “ Yves Saint Laurent and
    Photography ” (June 11) traces the trajectory of the designer, and of his brand
    more broadly, through some three hundred fashion photographs, ad campaigns, personal
    snapshots, and more. The exhibition, a collaboration with Paris’s Musée Yves Saint
    Laurent and Fondation Pierre Bergé–Yves Saint Laurent, makes the case that part
    of the French pioneer’s expertise included understanding the value of a good picture.
    This summer also brings deep dives into more niche, yet still fascinating, subjects.
    At the Museum of Modern Art, “ Architects of Liberation: Modernism in Western
    Africa ” (July 5) examines how political independence helped shape the built environment
    in seven countries, from Nigeria to Senegal, between the nineteen-fifties and
    eighties. The show, the result of four years of research, includes roughly four
    hundred and fifty objects, spotlighting architects and projects that have received
    little international attention. It should be eye-opening. The Jewish Museum also
    revisits a chapter of history with “ Modernity and Opulence: Women of the Wiener
    Werkstätte ” (July 17). The Viennese collective and workshop, which merged high
    aesthetics with functional design, was founded, in 1903, by three men; however,
    women made up a substantial proportion of its artisans and clients—particularly,
    it seems, Jewish women. This exhibition aims to tell their story through paintings,
    ceramics, textiles, films, and more. Among the other shows of the season, it’s
    worth noting two: “ Akinsanya Kambon: Soul Sessions ” (May 28), a doubleheader
    at SculptureCenter and the Center for Art, Research and Alliances, which introduces
    New Yorkers to the spiritual ceramics of a former marine and Black Panther; and
    the Drawing Center’s “ Certainly an Act: Works on Paper by Pope.L ” (June 26),
    a focussed look at lesser-known work by the unclassifiable contemporary artist,
    who died three years ago. But perhaps the most art-world thing you can do in New
    York in the summertime is to flee the city for greener pastures. If you’re plotting
    a getaway, why not time it for Upstate Art Weekend , June 25-29? The bonanza of
    exhibitions and events happening everywhere from museums to barns in the Hudson
    Valley and the Catskills seems to grow larger and more delightfully unwieldy every
    year.— Jillian Steinhauer Movies Odysseus, Aliens, Spider-Man Studios and independent
    producers alike are planning hot fun in the summertime. Olivia Wilde directed
    “The Invite” (June 26), an erotic comedy, in which she and Seth Rogen play a San
    Francisco couple whose swinger neighbors (Penélope Cruz and Edward Norton) proposition
    them. “Gail Daughtry and the Celebrity Sex Pass” (July 10), directed by David
    Wain, stars Zoey Deutch as a Midwestern hairdresser who, enraged when her fiancé
    (Michael Cassidy) hooks up with Jennifer Aniston, heads to Los Angeles to pair
    off with Jon Hamm. In Gregg Araki’s “I Want Your Sex” (July 31), Cooper Hoffman
    plays an art-studio assistant, Elliot, in a B.D.S.M. relationship with his boss
    (Olivia Wilde); Charli XCX plays Elliot’s girlfriend. Monica Barbaro and Callum
    Turner star in Will Gluck’s dystopian comedy “One Night Only” (Aug. 7), set in
    a time in which premarital sex is legal for a single night a year. Action films,
    whether fantasies or plausible realities, are seasonal mainstays, as in “Disclosure
    Day” (June 12), Steven Spielberg’s science-fiction drama about contact with extraterrestrials,
    with Emily Blunt as a TV newscaster and Josh O’Connor as a cybersecurity expert.
    The disaster-film comedy “Stop! That! Train!” (June 12) features performers from
    the “Drag Race” series, including Ginger Minj and Jujubee, as stewardesses on
    a high-speed rail line, and RuPaul, as the President; Adam Shankman directed.
    In “Unidentified” (June 19), directed by Haifaa Al Mansour, a Saudi woman (Mila
    Al Zahrani) who’s obsessed with a true-crime podcast gets a clerical job at a
    police station and winds up investigating a murder. “Her Private Hell” (July 24),
    directed by Nicolas Winding Refn, blends science fiction and melodrama, as a mysterious
    substance penetrates the atmosphere amid an American soldier’s search for his
    daughter; Charles Melton and Sophie Thatcher star. Andrew Patterson’s crime drama
    “The Rivals of Amziah King” (Aug. 14) stars Matthew McConaughey as an Oklahoma
    beekeeper who reconnects with his former foster daughter (Angelina LookingGlass)
    and gets ensnared in a criminal scheme involving the honey trade. Classic and
    modern mythology come in for big-screen workouts, starting with Michael Sarnoski’s
    “The Death of Robin Hood” (June 19), in which the bow-and-arrow-wielding wealth
    redistributor (played by Hugh Jackman), wounded and vulnerable, looks back with
    regret at his violent past. In “Supergirl” (June 26), directed by Craig Gillespie,
    Milly Alcock plays the titular heroine, who helps a friend (Eve Ridley) avenge
    the killing of her father; David Corenswet returns as Superman. Christopher Nolan’s
