  body_text: 'The World Cup According to Gianni Infantino The Sporting Scene The World
    Cup According to Gianni Infantino FIFA ’s powerful president is remaking global
    soccer in his own image. Can the sport survive him? By Sam Knight June 01, 2026
    In English, it’s called the World Cup, but I prefer the stirring names by which
    it’s known in other European languages—Mundial, Mondiali, Weltmeisterschaft—and
    which better convey the idea that this is not a sports tournament but something
    closer to a cosmological event, heavy with meaning. For soccer people, it requires
    no effort to measure out your life in World Cups. Just a few seconds of footage,
    or even a photograph, is usually enough—the color of the turf, the haircuts, the
    uniforms, the exact shade of summer blue—to ascertain not only which year it was
    and who won but where you were and who you were with and why you were with them
    and what the preoccupations of that time were from which it was possible, however
    briefly, to escape. My earliest World Cup memory—a six-year-old’s spiral of indignation
    and despair—is of Diego Maradona’s dastardly Hand of God, which eliminated England
    in the quarterfinals of the 1986 edition, in Mexico. Twenty years later, I watched
    the final, an operatic affair between France and Italy, at a pub in East London.
    Zinedine Zidane, the great French playmaker, headbutted Marco Materazzi, a wily
    Italian defender who had made a passing remark about Zidane’s sister. Zidane was
    ejected and France lost. It was a London summer night, when the smell of dried-out
    parks and exhaust fumes never entirely clears from the air. I stood at the bar
    with my girlfriend, whom I was desperately in love with but who didn’t care about
    soccer at all, and I can still feel the conflicting parts of me—one part absorbed
    by the magnitude, the improbable aesthetic beauty, of Zidane’s gesture, the other
    by her—reaching in two unbridgeable directions at once. (We broke up soon afterward;
    she is now my wife.) So these are complicated, major occasions. And this summer’s
    World Cup, which runs from June 11th to July 19th, will be the same, or even more
    so. For the first time, the tournament will be played across three nations—the
    United States, Mexico, and Canada—with forty-eight teams (up from thirty-two,
    as in previous editions) and a total of a hundred and four matches. It will be
    longer, more climatically varied, and more revenue-generating than ever before.
    It will probably be fantastic. Perhaps something will go wrong. Either way, the
    World Cup will be wasted on most Americans. Although millions will marvel at the
    sheer scale and global character of the enterprise (the Democratic Republic of
    the Congo will play Uzbekistan on the evening of June 27th, in Atlanta), it is
    unlikely to graft onto their sense of time and shared memory the way that Italy’s
    victory did in 1982, for example. That summer, Gianni Infantino—now the president
    of the Fédération Internationale de Football Association, which governs global
    soccer and owns the World Cup—was twelve years old and living in Brig, a small
    town in the Swiss Alps. Infantino’s parents were Italian migrants: his father
    worked on the night trains that ran under the mountains and across Europe, and
    his mother managed a kiosk at the railway station. Working-class Italians suffered
    discrimination in Switzerland during Infantino’s childhood. But the triumph of
    the Azzurri, the Italian men’s national team, in the World Cup helped to change
    that. It “allowed us to grow,” Infantino said in a speech, in 2021. “For me personally,
    I think that the 1982 World Cup was definitely the moment when the football virus
    . . . became part of my life and my body.” Swiss Italians of Infantino’s generation
    have described the mounting euphoria of that summer as a feeling of riscatto —redemption
    and release. Brig is only a few miles from the Italian border. (Infantino calls
    his personality a combination of Italian creativity and Swiss precision.) After
    one match, he and his family crossed the border to the town of Domodossola to
    celebrate. There were no Italian flags on sale anywhere, so Infantino’s mother
    bought strips of red, white, and green fabric and sewed them together herself.
    Brig is in the Upper Valais, a gaunt and conservative place where the inhabitants
    speak Walliser German, an Alpine dialect that many Swiss people find unintelligible.
    Six miles along the valley is Visp, the birthplace of Sepp Blatter, Infantino’s
    predecessor at FIFA , who, until Infantino entered the picture, was the most infamous
    soccer administrator of all time. Blatter was a former P.R. man and wedding m.c.
    who became a pioneer of global sponsorship and broadcasting deals. He joined FIFA
    in 1975 and worked there for forty years. Under Blatter, FIFA became powerful
    and rich but also morbidly corrupt. The organization is made up of two hundred
    and eleven national soccer associations and their representatives. For decades,
    FIFA officials accepted bribes from sports-marketing companies in exchange for
    selling them the broadcast rights to valuable tournaments they controlled at preferential
    rates. At a news conference toward the end of Blatter’s reign, a prankster showered
    him with banknotes. Blatter ran the show but never quite took center stage. In
    “World Cup Fever,” a new history of the tournament, the writer Simon Kuper likens
    him to der portier , the manager of an expensive Swiss hotel who understands all
    his customers’ predilections and who has the cash to cover their bills. “Blatter’s
    genius lay in knowing who was bribing whom,” Patrick Oberli, a Swiss journalist
    and documentary filmmaker who has covered FIFA for years, told me. Since taking
    over, in 2016, Infantino has made Blatter seem small-time by comparison. He has
    sublimated FIFA into his own personhood, with astonishing success. His Instagram
    account, which has 4.2 million followers and a comments section that is strictly
    curtailed, is now the organization’s principal mouthpiece. He has transformed
    the role of the FIFA president into that of a prominent international politician
    (President Donald Trump calls Infantino “the king of soccer”) while dramatically
    increasing FIFA ’s revenues and reach. Infantino will be unavoidable this summer.
    During the previous World Cup, in Qatar, directors of the official tournament
    feed were reportedly instructed to show him in the crowd once per match and not
    while he was looking at his phone. The geography of this year’s World Cup means
    that he won’t be physically omnipresent, but his imprint will be everywhere. “It’s
    safe to say that there’s no major decision that’s being made at this tournament
    without the direct involvement of Gianni,” a former high-ranking FIFA official
    told me. FIFA has staged two men’s World Cups under Infantino, but the 2026 edition
    is the first to be awarded and delivered during his tenure, and thus fully shaped
    in his image. He has already declared it to be the greatest of all time. Infantino’s
    messaging is as relentless as a 3-D printer’s. He is fond of the number eleven,
    which is the number of players on a soccer team. Most things are iconic. He likes
    to describe FIFA as “the official happiness provider to humanity.” Infantino is
    both absolutely in control and strangely ill at ease. “He doesn’t trust many people,”
    the former official said. “His circle is very small.” Oberli, the Swiss journalist,
    has interviewed him four times. (Infantino declined to speak with me.) “In every
    case, I was faced with someone who was fearful,” Oberli said. “It was a peculiar
    feeling. It was as if he were sitting an exam.” In 2023, when Infantino was reëlected,
    unopposed, for a second full term as president, he opened a rare news conference
    with a rebuke for the waiting reporters. “I don’t understand why some of you are
    so mean,” he said. “Why? Why? I don’t get it.” The modern history of FIFA begins
    at dawn eleven years ago, when Swiss police officers entered the Baur au Lac,
    a luxurious nineteenth-century hotel in Zurich, and started arresting the organization’s
    delegates, who had gathered for an annual congress. The raid, on May 27, 2015,
    followed years of investigation by the U.S. Department of Justice and the F.B.I.
    (More than forty FIFA officials and associates were ultimately indicted on various
    fraud charges; twenty-seven pleaded guilty.) As the delegates were marched out
    of their hotel rooms, investigators also arrived at the Home of FIFA , the organization’s
    global headquarters, which has six underground levels dug into a hillside on the
    edge of Zurich. According to a Swiss search warrant, the police spent from 7:50
    A.M . to 9:30 P.M . in the building, removing hundreds of boxes of bidding documents,
    World Cup contracts, and USB drives. Six days later, Blatter announced that he
    would step down. For years, his presumptive heir had been Michel Platini, a former
    captain of the French national team and the president of UEFA , Europe’s soccer
    governing body. ( FIFA ’s national associations are organized into six powerful
    continental blocs.) Where Blatter was a political operator, Platini was bluff
    and down-to-earth—an actual soccer guy. In the eighties, Platini had won the Ballon
    d’Or, the prize for the world’s best player, three years in a row. “Everything
    is set up for Michel Platini to be president,” the former official recalled. But
    a single invoice changed that. On the afternoon of September 25th, some four months
    after the raids, Olivier Thormann, the head of the Swiss economic-crime division,
    returned to the Home of FIFA to question Blatter and Platini about a payment of
    two million Swiss francs (roughly two million dollars) that his officers had discovered.
    Although the alleged purpose of the payment (for consulting work that Platini
    had done for Blatter in the late nineties) and its timing (just before Blatter’s
    reëlection in 2011) were definitely questionable, they weren’t obviously illegal—unlike
    the bribery and money laundering that the F.B.I. had uncovered. But Swiss prosecutors
    didn’t see it that way. The two most important administrators in global soccer
    were taken to separate rooms. According to a former employee at the organization,
    as the FIFA president was led away, Thormann asked a receptionist, “Do you have
    a defibrillator for Mr. Blatter?” The criminal investigation ended Blatter’s and
    Platini’s careers in soccer. (Both men were charged with forgery and fraud, but
    later acquitted of any wrongdoing.) It also threw open the succession question
    at FIFA : Who would run instead of Platini? For years, he had been assisted at
    UEFA by Infantino, its forty-five-year-old general secretary and the former head
    of its legal department. Platini had star quality, but Infantino was an energetic
    administrator with a noticeable gift for languages. “It was a bit like ‘Pinky
    and the Brain,’ ” a former FIFA executive told me, referring to a nineties cartoon
    about two genetically engineered mice. (In each episode, the Brain would come
    up with a plot to take over the world.) “Infantino was the brains. Platini was
    the fun.” Among fans, Infantino was best known for overseeing the draws for UEFA
    ’s competitions, like the Champions League, where a former player would take balls
    out of a glass bowl and then open them to disclose which teams were playing each
    other. Infantino presided over the events with jocular asides and instant recall
    of previous matches and scores. “He was extremely competent and hardworking,”
    a former colleague at UEFA said. “He knew all the rules, read all the regulations.”
    When UEFA adopted Infantino as its presidential candidate, some observers wondered
    whether he was merely a placeholder until Platini could clear his name. But “Gianni’s
    campaign was very slick,” Philippe Auclair, a veteran French journalist and soccer
    writer, recalled. “He travelled everywhere. He met absolutely everybody.” With
    UEFA ’s funding, Infantino toured the world, courting soccer bureaucrats from
    Montserrat to Papua New Guinea. (Each FIFA member has equal voting power.) “He
    was like a juggernaut, basically, which surprised a lot of us,” Auclair said.
    Infantino’s chief rival was Sheikh Salman bin Ebrahim al-Khalifa, of Bahrain,
    the president of the Asian Football Confederation'
