      virus' became part of his life, linking it to the euphoria of redemption and
      release (riscatto) experienced by the Italian immigrant community, suggesting
      a deep, transformative passion.
    options:
      A: A dangerous obsession that hindered his academic performance.
      B: A traumatic experience associated with discrimination in Switzerland.
      C: A profound, life-altering passion for the sport fostered during his youth.
      D: A negative influence inherited from his migrant parents' working-class struggles.
