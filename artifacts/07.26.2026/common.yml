    front and the health front. On health, Pulse tells me every morning if there’s
    new studies published about anything related to my condition. Previously I had
    to research all of that. And instead of going to a medical journal, it’s all summarized
    in line and very clearly laid out. For work, it’s similar. As you know, staying
    on top of AI news is a challenge. Having Pulse deliver a quick summary of what
