  body_text: '| Next | Section menu | Main menu | Previous | Zoë Schiffer The Big
    Story Nov 17, 2025 6:00 AM OpenAI''s Fidji Simo Plans to Make ChatGPT Way More
    Useful—and Have You Pay For It As OpenAI expands in every direction, the new CEO
    of Applications is on a mission to make ChatGPT indispensable and lucrative. Photograph:
    G L Askew II In case OpenAI’s structure couldn’t get any weirder—a nonprofit in
    charge of a for-profit that’s become a public benefit corporation—it now has two
    CEOs. There’s Sam Altman, chief executive of the whole company, who manages research
    and compute. And as of this summer, there’s Fidji Simo, the former CEO of Instacart,
    who manages everything else. Simo hasn’t been seen much at OpenAI’s San Francisco
    office since she began as CEO of Applications in August. But her presence is felt
    at every level of the company—not least because she’s heading up ChatGPT and basically
    every function that might make OpenAI money. Simo is dealing with a relapse of
    postural orthostatic tachycardia syndrome (POTS) that makes her prone to fainting
    if she stands for long periods of time. So for now, she’s working from home in
    Los Angeles, and she’s on Slack. A lot. “Being present from 8 am to midnight every
    day, responding within five minutes, people feel like I’m there and that they
    can reach me immediately, that I jump on the phone within five minutes,” she tells
    me. Employees confirm that this is true. OpenAI’s famously Slack-driven culture
    can be overwhelming for new hires. But not, apparently, for Simo. Employees say
    she is often seen popping into channels and threads, sharing thoughts and asking
    questions. Simo joined during a chaotic period for OpenAI, which is expanding
    in nearly every direction. There are sovereign AI partnerships, new model releases,
    retail partnerships, multibillion-dollar compute deals , a proprietary chip, a
    mysterious hardware product—and of course, ChatGPT. “We do not battle for scope,”
    Simo says. “We battle for less scope.” The Big Interview Read more deep, weird,
    smart conversations with the most important people in our world. Outside Silicon
    Valley, Simo’s hiring came as a surprise. For those in the know, it was less of
    a shock. A native of Sète, a small fishing town in the south of France, Simo made
    a name for herself running the Facebook app at Meta before taking the top job
    at Instacart in 2021. She took the grocery startup public two years later. In
    the Valley, she’s known as a product visionary with a reputation for scaling consumer
    apps across the globe. Simo’s role at OpenAI is, in large part, to do the same—turn
    the company’s research breakthroughs into moneymaking, must-have consumer products.
    She faces staggering competition from tech giants like Google and Meta, as well
    as AI startups founded by OpenAI alums, including Thinking Machines Lab, Anthropic,
    and Periodic Labs. “The thing that keeps me up at night is that the intelligence
    of our models is well ahead of how much people are using them,” Simo says. “I
    see my job as closing this gap.” Since she arrived, Simo has overseen the launch
    of Pulse, a product that connects to users’ calendars and gives them personalized
    information based on their schedule, chat history, and feedback; created a jobs
    platform to allow people to get AI-certified and look for roles that make use
    of their skills; and doubled down on improving ChatGPT’s responses to people having
    acute mental health crises . Eventually, sources say, she’ll be the person deciding
    how to roll out ads in ChatGPT’s free tier. We’re sitting in the light-filled
    modern farmhouse where Simo lives with her husband, Rémy, and their 10-year-old
    daughter. On the table in front of us sit a pile of pastries and a box of Rémy’s
    chocolates. A former engineer, he now makes desserts full-time. It’s an idyllic
    backdrop for the person helming what might be the most ambitious startup on earth.
    If OpenAI’s mission is to ensure that artificial general intelligence benefits
    all of humanity, Simo’s goal is to build and scale the tools that make that possible.
    The question for her—and for OpenAI—is whether the mission can survive the business
    model. This interview has been edited and condensed for clarity. Zoë Schiffer:
    You’re the CEO of Applications—and you report to Sam Altman. What has that working
    relationship been like? Fidji Simo: What Sam wanted was the ability to focus on
    research and compute, so I am trying to make sure that he can free up his time.
    Meanwhile, he realized that this is a company that evolved primarily from a research
    lab but became a really important product company, and that requires a different
    muscle. I see my role as making that product company incredibly successful while
    respecting the culture of the research lab. When you’re coming into a job like
    that, is someone checking your references? [ Laughs. ] I think Sam had gotten
    references on me for like three years. Sam and I worked in the same circle, so
    he knew about my reputation. I don’t think he literally picked up the phone and
    was like, “Is she legit?” I was going to ask if Mark Zuckerberg was one of yours
    … Mark has been an incredible supporter throughout my career and has provided
    references many times. In this particular situation, I don’t think Sam called
    him. You’ve talked about how at Meta you took risks and at times put your role
    and reputation on the line. I’m curious if you’ve identified any risks that you
    want to push OpenAI to take. Well, taking the job felt pretty risky to me [ Laughs
    ]. I would say the thing that I don’t think we did well at Meta is actually anticipating
    the risks that our products would create in society. At OpenAI, these risks are
    very real. Mental health and jobs were my first two initiatives when I came into
    the company. I was looking at the landscape and being like, “Yep, immediately,
    mental health is something that we need to address. Jobs are clearly going to
    face some disruption , and we have a role to play to help minimize that disruption.”
    That’s not going to be easy, because the path is uncharted. So it is a very big
    responsibility, but it’s one that I feel like we have both the culture and the
    prioritization to really address up-front. How do you feel the company is doing
    on mental health right now? Just in the span of the last few months, we have massively
    reduced the prevalence of negative mental health responses. We have launched parental
    controls with leading protections. And we are working on age prediction to protect
    teens. At the same time, when you have 800 million people [per week], when we
    know the prevalence of mental health illnesses in our society, of course you are
    going to have people turn to ChatGPT during acute distress moments. And doing
    the right thing every single time is exceptionally hard. So what we’re trying
    to do is catch as much as we can of the behaviors that are not ideal and then
    constantly refine our models. But if you were to grade where the company is now
    and where you want it to be, what would you say? It’s not as if we’re ever going
    to reach that point where we’re done. Every week new behaviors emerge with features
    that we launch where we’re like, “Oh, that’s another safety challenge to address.”
    A good example is mania. You look at the transcripts, and sometimes people say,
    “I feel super great. I haven’t slept in two days, and I feel on top of the world.”
    A clinical psychologist would understand that that’s not normal—that’s mania.
    But if you look at the words, it seems fine. So we work with psychologists to
    detect the signal that this isn’t someone being super excited, this is a sign
    of mania, and have a strategy to intervene. Getting it wrong is also really annoying.
    If you’re a normal adult being excited and ChatGPT tells you, “Hey, you might
    be having a manic episode,” that’s not great. It is a very subtle area, and we’re
    trying to do it with as much care and as much external input as possible. Photograph:
    G L Askew II OpenAI is obviously one of the world’s most valuable startups, if
    not the most valuable, but it’s also losing billions of dollars every year. I’ve
    noticed. What opportunities do you see to get it on a path to profitability? It
    all comes back to the size of the markets and the value we’re providing in each
    market. In the past, only the wealthy had access to a team of helpers. With ChatGPT
    we could give everyone that team—a personal shopper , a travel agent, a financial
    adviser, a health coach. That is incredibly valuable, and we have barely scratched
    the surface. If we build that, I assume that people are going to want to pay a
    lot of money for that, and that revenue is going to come. Meanwhile, on the enterprise
    side, we sell an API and ChatGPT Enterprise, which is a great product but a very
    thin layer compared to all the things that we could be building for enterprise.
    If you think about building agents for every industry and function, there is so
    much to build, either by us or by enabling third parties to build on top of our
    platform. So I’m like, OK, the markets are huge. The depth of value is huge. That’s
    the basic formula for monetizing. Then the real question becomes, will we have
    the compute to deliver that? OpenAI has been doing hundreds of billions of dollars’
    worth of deals to build data centers . When people talk about fears around the
    compute deals, they’re talking not only about the scale but about the deals feeling
    a little circular. Or the fact that a lot of the US economy seems to hinge on
    OpenAI and Nvidia at this point. So first off, a lot of people say, “Whoa, these
    compute deals are massive,” but when you look at how constrained we are internally
    and how much more we could do if we had more GPUs, it’s very clearly the right
    decision. We have a pipeline of products that are going to make massive use of
    compute. I know these deals look risky on the outside, but on the inside, what’s
    much riskier would be to not lean into compute. The companies that we’re making
    these deals with are extremely sophisticated. They are providing these kinds of
    deals and this kind of financing because they are very close partners who know
    our business very well. You take a product like Pulse, which we launched through
    the Pro tier. I want that to be available to everyone, but because of the compute
    constraints, we’re not able to do that. I’m giving you one example, but there’s
