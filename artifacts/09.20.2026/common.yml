  body_text: News extortion is rife in China China | Cash for copy News extortion
    is rife in China The country’s censors may be making it worse June 18th 2026 Last
    month China’s authorities revealed that three men in Zhejiang, an eastern province,
    had been sentenced for a curious crime known as “news extortion”. They had dug
    up (or in many cases made up) dirt on over 180 companies that were preparing to
    go public and then demanded hush money to not publish it on social media. What
    was most concerning, said prosecutors, was that some companies did not report
    the extortion to the police, even though the information that the men threatened
    to publish was not true. Instead they just paid up to avoid disruptions to the
    listing process. One firm sent 50,000 yuan ($7,000) to make the problem go away;
    another, 30,000 yuan. Companies in many places might hope that paying money could
    spike a negative news report or perhaps generate a positive one. But in China
    the practice is rife, and is not just limited to online scammers. In a notorious
    case in 2002 four journalists at Xinhua, the powerful state broadcaster, took
    cash and gold from a mining company in return for hushing up a deadly explosion.
    In 2015 an executive at the 21st Century Business Herald, a state-owned broadsheet,
    was sentenced to four years in prison for extortion. Last year an influential
    financial blogger was found to have made 700,000 yuan from the companies he wrote
    about. In one case, he falsely claimed a Shanghai firm’s employee had been stabbed
    by an unhappy customer, and only removed the article after receiving a hefty fee
    for “information services”. The government blames bad apples for the problem.
    But it is often China’s own strict controls over its media that lead to corrupt
    behaviour, writes David Bandurski of China Media Project, a research group, in
    a recent blog post. The job of state-media journalists is often to create “positive
    energy” with their stories so as to flatter the government. That encourages unethical
    practices. And making unwelcome news reports vanish attracts little scrutiny in
    China because, thanks to an army of censors, stories disappear all the time without
    explanation. Another problem is that it is especially tough in China for media
    companies to survive just by selling news. Few have persuaded readers to pay for
    subscriptions. That is because “the media here aren’t allowed to write about real
    things,” laments one dispirited former journalist. She spent a year at an online
    outlet that wrote negative stories about companies until they signed advertising
    contracts. Extortion, she says, is simply “the most direct and effective method
    to make money through reporting”. ■ Subscribers can sign up to Drum Tower , our
    new weekly newsletter, to understand what the world makes of China—and what China
    makes of the world. This article was downloaded by zlibrary from https://www.economist.com//china/2026/06/18/news-extortion-is-rife-in-china
