  body_text: '| Next | Section menu | Main menu | Previous | The Forgotten Female
    Pilots of World War II The WASPs risked their lives flying for the Army. But for
    decades, the U.S. government refused to recognize their military service. by Ellen
    Cushing The author''s grandmother Patricia Perry joined the Women Airforce Service
    Pilots in 1943. (Courtesy of the Robinson/Cushing Family) R ecently, I stood in
    an airfield in Sweetwater, Texas, and looked up. I was wondering what it would
    have been like to take off from there in a small plane, flying into the dust of
    West Texas and the chaos of World War II, as my grandmother had. The land around
    me had the palette of a well-used watercolor set and the topography of a paper
    towel: gray and brown, flat forever. It is dry all year round, except when it
    suddenly pours. The wide, featureless landscape makes for big, blustery winds
    and difficult orientation. Also, it is famous for its rattlesnakes . During World
    War II, Sweetwater’s Avenger Field was the primary home of a program that trained
    women to fly military planes. They were called Women Airforce Service Pilots —WASPs—and
    they were the solution to a high-stakes problem: The war needed pilots, and men
    were dying quickly. From 1942 to 1944, these women volunteers engaged in just
    about every aspect of military flight operations except combat—ferrying aircraft,
    testing planes, transporting cargo, training new pilots—so that the men would
    be free to fight in Europe and the Pacific. More than 25,000 women applied to
    the program, fewer than 2,000 were accepted, and 1,074 completed training. By
    the time the program ended, the WASPs had risked—and in some cases given—their
    lives to save male pilots a cumulative 60 million miles of flying. But during
    the war, they were classified as civil servants, no different in the eyes of the
    government from the female federal employees who typed memos or cooked on bases.
    After the war, they were ineligible for veterans’ benefits, and kept out of both
    the military and commercial cockpits. For decades, the WASPs lobbied to be recognized
    as service members. Today, they are still largely unknown. Soon, they will all
    be gone. P atricia Perry , my Grandma Pat, was born in 1921, an only child. She
    grew up in Auburn, a small town in Northern California’s Sierra foothills. This
    was farm country—stone fruit and grapes—and when she was in high school, Pat learned
    to fly a friend’s parents’ crop duster. She was high-achieving, sheltered, patriotic,
    and eager to please—always, according to my mom, “trying to be the son her father
    never had as well as the daughter her mother insisted on.” In 1941, she moved
    two hours southwest to study political science at UC Berkeley. Instead of joining
    a sorority, she lived in the International House, where she was surrounded by
    students from all over the world, including many who had fled the war in Europe.
    After graduation, she’d planned to attend law school at Berkeley, where she would
    have been one of just a few women, but deferred her admission to join the WASPs.
    She met the criteria: 5 foot 4 or taller, at least 21 years of age, high-school
    diploma, extensive flying experience. On July 5, 1943, when Pat was 21 , she began
    her training in Sweetwater. She had never left California before. With a few exceptions,
    the women at Avenger Field were white, but they came from a variety of backgrounds
    and professions—one was a Broadway actor—and from all over the country. Some were
    still essentially children; others were in their 30s, married with a family, or
    widowed by a husband who had already been killed in the war. The wealthier among
    them had learned to fly for fun when aviation became an expensive diversion in
    the years between the world wars. Hundreds had gone through the Civilian Pilot
    Training Program, which had been founded a few years earlier to train men to fly
    and occasionally accepted women. Pat, like many of her fellow WASPs, had felt
    called to service. A large number just really loved to fly, and looked for any
    opportunity to do it. Members of the Women Airforce Service Pilots program, wearing
    flight gear and parachutes (WASP Archive / Texas Woman’s University) Before she
    joined the program, Marion Schorr Brown was making $90 a month as a schoolteacher
    and spending $6 an hour for flight time. Nell Stevenson Bright took her first
    recreational flight at the age of 8, when her father paid a dollar for her to
    ride in a World War I biplane, and never stopped thinking about being in the air
    after that. Cornelia Fort was an airplane fanatic and a flight instructor who
    happened to have been flying with a student over Pearl Harbor on December 7, 1941,
    when she was 22. She saw the bombs exploding in the sky, and then she emergency-landed
    her plane as Japanese military aircraft rained bullets down on the tarmac. Ten
    months later, she became the second woman to sign up for what would become the
    WASP program. The women paid their own way to Texas. They were told to pack light,
    and to buy life insurance. Once they got there, they were given men’s flight suits;
    in photographs , they look like children playing dress-up, heavy fabric pooled
    at their feet. They covered lodging costs themselves, $1.65 a day. The windows
    on their barracks were painted black, for modesty. They trained for four to seven
    months, learning physics, Morse code, and military law, and accumulating hundreds
    of flight hours: everything male pilots learned, except gunnery and formation
    flying. (They also learned how to examine their cockpits for rattlesnakes.) Every
    morning, they did calisthenics in bobby socks as military planes flew loud and
    low overhead. In the evenings, they wrote letters home, played Ping-Pong in the
    rec hall, and produced a newspaper, The Avenger . In Sweetwater, locals received
    them with some suspicion, at least until program leaders encouraged them all to
    go to church, even the Jewish ones. In the country at large, to the extent that
    the public was aware of the WASPs, the general attitude seems to have been one
    of amused gratitude. A cover story about the program in Life magazine —headline:
    “ Girl Pilots ”—called the women “very serious about their chance to fly for the
    Army at Avenger Field, even when it means giving up nail polish, beauty parlors,
    and dates for a regimented 22 ½ weeks.” WASPs doing calisthenics at Avenger Field,
    in Sweetwater, Texas. Locals received the trainees with some suspicion, at least
    until program leaders encouraged them to go to church. (WASP Archive / Texas Woman’s
    University) After training, the women received a pair of silver wings and a few
    days off. Then they scattered to their next assignment: Schorr Brown to Detroit,
    Stevenson Bright to El Paso, Fort and Pat to different parts of Southern California,
    the rest to airfields and Army bases around the country. There, they taught male
    cadets how to fly; moved supplies between factories and bases; flew paperwork,
    planes, and pilots wherever they needed to go; and generally engaged in what the
    pilot Jacqueline Cochran, one of the program’s founders, was fond of calling “aerial
    dishwashing”—the tedious stuff, work no one else wanted. Read: Night Witches,
    the Soviet female fighter pilots of World War II Each WASP was typically one of
    only a handful of women among hundreds or thousands of men on base, and the historical
    record suggests that they were treated, at best, like zoo animals. An unspoken
    but widely understood part of the job description, Pat recalled, was to entertain
    their male counterparts: She packed a ball gown in her luggage along with her
    flight suit. The women were skipped over for certain flying assignments, evaluated
    more harshly than the men, and reportedly told by one base commander that both
    they and the planes could easily be replaced. For a while, many were grounded
    during their period. Rumors of sabotage by male pilots spread. Cochran was said—but
    never confirmed—to have found traces of sugar in the engine of a plane that had
    crashed and killed a WASP. Even under the best conditions, the flying itself was
    difficult and dangerous. The planes were tiny, many of the cockpits completely
    open to the air. (In Sweetwater, I saw four of them, dinky little tin-can-looking
    things, and I thought about how I require a glass of wine and a Xanax to get on
    a 737.) They had rudimentary instruments and no radar or GPS—often, the women
    would navigate by sticking their head out the window. Schorr Brown once accidentally
    got so close to the Statue of Liberty while flying from Montreal to Newark that
    it “scared the living daylights out of her.” Not at all infrequently, a WASP’s
    assignment was to test a plane for airworthiness, or to transport a damaged one
    to be repaired, or to tow a target over a practice area while not-fully-trained
    men on the ground did their best to shoot at it with machine guns. Women were
    allowed to opt out of this last duty, but no one did. WASPs at the Romulus Army
    Air Base, in Michigan. The women were typically outnumbered on base by hundreds
    or thousands of men. (WASP Archive / Texas Woman’s University) On March 21, 1943,
    Cornelia Fort was ferrying a BT-13 from Long Beach to Dallas when one of the recently
    trained male pilots she was flying with accidentally clipped her wing. She nose-dived
    so hard that her plane’s engine was later found buried two feet underground. Fort
    was the first woman pilot in American history to be killed while on active duty
    for her country. The military did not pay for her funeral. Thirty-seven other
    WASPs died in service, either during training or on assignment. Each time, their
    remains were sent home at the expense of their families—the women at Avenger got
    used to passing around a hat, collecting donations. Their caskets were not permitted
    to be draped with the American flag, but sometimes their families did it anyway.
    Almost the entire time the WASP program existed, its leaders fought for it to
    be made an official part of the military, with all the attendant benefits. Almost
    the entire time, they were met with resistance from male pilots. In 1944, as an
    end to the war appeared to be in sight and the pilot shortage eased, the government
    ordered the cancellation of a flight-instruction program for men. A group of male
    teachers began petitioning elected officials and writing to the press: Why should
    women have these jobs when they couldn’t? Read: Why women weren’t allowed to be
    astronauts Soon enough, public sentiment toward the WASPs started to shift. “Women:
    Unnecessary and Undesirable?” a headline in Time magazine asked . A government
    report found the program to be expensive and wasteful, especially when so many
    male pilots were available. A bill that would have provided the WASPs with full
    military status was narrowly defeated in the House of Representatives. By October,
    it was all over: The program was to be disbanded by the end of the year. On December
    7, 1944, it graduated its final class. “The WASP have completed their mission,”
    General Henry Arnold said at the ceremony . “If ever there was a doubt in anyone’s
    mind that women can become skillful pilots, the WASP have dispelled that doubt.”
    The pilots he was addressing would never get to put their skills to use. The ones
    currently on base were sent home. And so the WASPs scattered back to their lives.
    They finished school, bred Pekingese dogs, won bowling competitions, sold encyclopedias,
    had babies, devoted themselves to their families. A number of them applied to
    be commercial pilots and were rejected, though occasionally an airline would suggest
    that they were perfectly qualified to become stewardesses. Even under the best
    conditions, flying was difficult and dangerous. The planes were tiny, and many
