  body_text: 'What a beer with no label says about a small African country Middle
    East & Africa | Pint-sized problems What a beer with no label says about a small
    African country The ale that ails São Tomé and Príncipe Sep 24th 2026 For centuries
    São Tomé and Príncipe were known for chattel and chocolate. After the Portuguese
    landed on the islands in 1470 they brought enslaved Africans to toil on sugar
    roças (plantations). Portugal ostensibly ended slavery in the 1870s. But indentured
    labour on São Tomé and Príncipe continued, making it the world’s largest cacao
    producer for a time. These days, to understand Africa’s least populous country
    after the Seychelles—and one that holds a general election on September 27th—grab
    a beer. Specifically, an unlabelled brown bottle made by Rosema, the archipelago’s
    sole brewer. After independence from Portugal in 1975 the country became a Soviet
    satellite. East Germans helped set up the pilsner-making state entity. Rosema
    is known as cerveja nacional, a fitting name for a beer that quenches a thirst
    for post-colonial patriotism—and offers a window into the political economy. There
    are few big firms in São Tomé and Príncipe. Dreams of an oil industry and a deep-water
    port are unfulfilled. But Rosema is always on tap. Since privatisation in 1995,
    ownership has rocked back and forth like a drunk, between an Angolan businessman
    and two influential local brothers. Much like a Congolese mine or a Nigerian oil
    firm, control can oscillate depending on who is in power. In the latest twist,
    in May the Constitutional Court returned the brewer to the Angolan, Mello Xavier,
    the fifth shift since 2018. It was seen as proof that Carlos Vila Nova, the president,
    is consolidating power after dismissing his rival in a palace coup in 2025. The
    chicanery in the pint-sized country reflects its weak rule of law, shallow economy
    and patronage politics. “Beer is part of the lubrication of elections,” says Alex
    Vines of the European Council on Foreign Relations, a think-tank. As polls loom,
    candidates are handing out gifts, including beer. Locals call it tomando banho,
    “taking a shower” (a sticky one). At Cantinho da tia Cheila, a dusty-pink kiosk-cum-bar
    on the smaller island of Príncipe, Cheila, the eponymous owner, tips some beer
    on the floor before pouring one into a glass, a common ritual across Africa and
    in hip-hop videos from the 1990s. She says Rosema occasionally puts labels on
    the bottles but they slide off in the humidity. Still, it is cheaper than Portuguese
    imports and “it gives us pride in our land.” Her patrons agree. But like many
    barstool philosophers they dismiss politicians’ promises, shaking their heads
    as noisy campaign vehicles pass by on the street. They know from experience: it
    is the hops that kill you. ■ Sign up to the Analysing Africa , a weekly newsletter
    that keeps you in the loop about the world’s youngest—and least understood—continent.
    This article was downloaded by zlibrary from https://www.economist.com/middle-east-and-africa/2026/09/24/what-a-beer-with-no-label-says-about-a-small-african-country'
