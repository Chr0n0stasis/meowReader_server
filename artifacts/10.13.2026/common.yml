  body_text: India’s refounding fathers Asia | Ashoka India’s refounding fathers Nation-building
    is even harder the second time round Aug 20th 2026 EVERY COUNTRY has a national
    anthem. Some, like New Zealand, have two. But only India has an official song
    as well. This year, for the first time, “Vande Mataram”, a rousing tribute to
    “Mother India”, featured in Independence Day celebrations, greeting Narendra Modi
    as he arrived to give his annual speech on August 15th. An air-force helicopter
    flew past with a banner commemorating 150 years of the song’s composition. It
    marked the culmination of a years-long effort by Mr Modi’s Bharatiya Janata Party
    (BJP) to boost its status. A few days earlier it had become a criminal offence
    to disrupt its singing. Mr Modi spoke of India’s achievements as it enters its
    80th year of independence. He looked ahead to its glorious centenary. Such pronouncements
    acknowledge that India gained freedom from the British in 1947. Yet his BJP believes
    the country has been truly free for much less time. The clearest articulation
    of this sentiment came from Kangana Ranaut, a Bollywood actress and since 2024
    a BJP lawmaker, who declared in an interview some years ago that India only achieved
    independence with the election of Mr Modi in 2014. The statement is one of those
    to be taken seriously, not literally. In the eyes of the BJP’s leaders, the India
    they inherited was too effete, too anglophone and too accommodating of minorities.
    Their project was to build a “civilisational state defined by the country’s ancient
    Hindu heritage”, as Milan Vaishnav of the Carnegie Endowment, a think-tank in
    Washington, put it in a paper in 2024. He described the new political order as
    India’s “Second Republic”. A new republic needs a new identity. Around independence
    in 1947 the constituent assembly settled on what India’s national symbols should
    be. Over time, civic bodies picked up the statuary of British kings, queens and
    sundry dukes and deposited them in far-off parks (or, deliciously, in the zoo).
    State governments renamed cities and institutions. The BJP has been on a similar
    mission since 2014. The obvious purpose is to promote its Hindu-first vision.
    The national song was passed over for anthem status in part because its invocation
    of Hindu deities was seen as excluding Muslims. That is no longer a concern. In
    recent years the government has changed to saffron—a colour associated with Hinduism
    and the party itself—its flagship train service, the logo of the public broadcaster
    and, last month, the uniform of the men’s national hockey team. Last year it overhauled
    a jobs scheme named after Mahatma Gandhi and rebranded it as VB-G RAM G, a tortured
    acronym reverse-engineered to include the name of Lord Ram. For all that, it is
    the non-religious parts of the BJP’s project that more closely resemble the nation-building
    of a young country. Along with national symbols and a shared vision of the future,
    a new republic must have an origin story to give it meaning. Unfortunately for
    the BJP, the freedom movement and its pantheon of heroes already fulfilled that
    purpose. That left two strategies. The first was to repurpose long-dead figures.
    Jawaharlal Nehru, India’s first prime minister, was demoted from nation-builder
    to incompetent, entitled scion of the elite. In his place the BJP’s myth-makers
    built up Sardar Vallabhbhai Patel, Nehru’s home minister, who they insist was
    robbed of the top job. (Mr Modi’s home state of Gujarat has immortalised Patel
    with the world’s tallest statue.) In any case, they say, Subhas Chandra Bose,
    a revolutionary with no time for Gandhi’s non-violence humbug, was the real first
    prime minister. The other is to lean on the one towering figure they do have.
    In June the cabinet feted Mr Modi for becoming India’s “longest serving elected
    PM for consecutive terms”. The heavy caveating excludes Nehru’s first five years
    (elections had not yet been held) and Indira Gandhi (she lost power and then regained
    it). The animus against Nehru is understandable. There cannot be two first prime
    ministers of independent India. The BJP may have saffronised India. But its revisionism
    has failed to take. That much was clear during protests for education reform last
    month in Delhi. Students carried copies of the constitution. They displayed photos
    of B.R. Ambedkar, its architect; Bhagat Singh, an anti-colonial revolutionary;
    and Gandhi. They chanted slogans dating to the freedom struggle. Despite having
    spent most of their conscious lives in the second republic, their symbols were
    those of the first. Building a nation is no easy task. Retrofitting one is harder
    still. ■ This article was downloaded by zlibrary from https://www.economist.com/asia/2026/08/16/indias-refounding-fathers
