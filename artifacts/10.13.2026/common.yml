  body_text: 'Models of the brain — known as brain organoids — that are built from
    stem cells have transformed the study of human-specific developmental processes
    and disease-specific traits. But existing tools are restricted by several factors:
    organoids cannot mature beyond a certain point; they mostly lack interactions
    with other brain structures; and it is impossible to get any kind of behavioural
    output from them. Writing in Nature, Kaganovsky et al.1 address these limitations
    using an innovative experimental model: an engraftment of human brain organoids
    into a living mouse.'
