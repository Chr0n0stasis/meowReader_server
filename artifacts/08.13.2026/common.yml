  body_text: 'France offers some hope for defeating populists Europe | French mayors
    France offers some hope for defeating populists The mainstream parties get the
    biggest prizes March 26th 2026 The French love their mayors. So much so that they
    have 35,000 of them. Indeed, opinion polls suggest that trust in their mayor (66%)
    crushes that in the president (25%). This makes it hazardous to generalise from
    the mayoral elections that took place on March 15th and 22nd to the presidential
    election that is due next spring. The results nevertheless offer a few useful
    pointers. First, despite growing pressure from both populist extremes, the broad
    centre—locally—can hold. Of the ten biggest cities, the Socialists won six (Lille,
    Marseille, Montpellier, Nantes, Paris and Strasbourg); the Greens (Lyon), centre-right
    (Toulouse) and centrists (Bordeaux), one each. The only city that was won by Marine
    Le Pen’s populist-right National Rally (RN) was Nice; and even there, her party
    backed an ally, Eric Ciotti, who has strong local roots and had defected from
    the centre-right. Jean-Luc Mélenchon’s populist-left Unsubmissive France (LFI)
    took no big cities (although it secured Roubaix and Saint-Denis, two big towns).
    Second, clarity pays. Ahead of legislative elections in 2024, left-leaning moderates
    were dismayed when the Socialists hooked up with Mr Mélenchon. That alliance has
    since fallen apart—even if some Socialist candidates forged tactical local links
    with LFI. In the two biggest cities a refusal by the Socialists to make such a
    deal led to victory: in Paris, for Emmanuel Grégoire, over the centre-right’s
    Rachida Dati, and in Marseille for Benoît Payan, over the RN’s Franck Allisio.
    Third, a decade after upending French party politics, Emmanuel Macron’s centrists
    have failed to put down strong countrywide roots, yet they still secured a handful
    of key victories. The president’s party, now called Renaissance, fielded fewer
    candidates than the RN. François Bayrou, a former prime minister, lost in Pau,
    where he had been mayor for 12 years. But Renaissance captured Bordeaux as well
    as Annecy; its allies won Angers, Mulhouse and several smaller towns. Arguably
    the centre’s most notable victory was Edouard Philippe’s (pictured above) in Le
    Havre. He held on to the town hall in a tough three-way fight against both the
    left and the hard right. A former prime minister whose party is allied to Renaissance,
    Mr Philippe had plans to run for the presidency in 2027—unless he failed in Le
    Havre. His victory, against a pre-poll prediction, will boost his national campaign.
    An opinion poll found 46% of respondents thinking he would make a “good candidate”
    for the presidency, putting him in a near dead heat with Jordan Bardella, the
    RN’s leader, on 45%, but ahead of Ms Le Pen on 42%. That said, the RN—whether
    its candidate is Mr Bardella or Ms Le Pen—remains the polling favourite to win
    the presidential election. At the mayoral vote the party claims to have won 70
    town halls, up from 13. Local-election results are no firm guide to a later presidential
    poll. But these results offer some hope to the mainstream parties: they can still
    win tough campaigns, even against the extremes. ■ To stay on top of the biggest
    European stories, sign up to Café Europa , our weekly subscriber-only newsletter.
    This article was downloaded by zlibrary from https://www.economist.com//europe/2026/03/26/france-offers-some-hope-for-defeating-populists'
