- article_update_date: 09.28.2026
  body_text: 'Is the term “Islamism” a useful way to discuss extremism? Letters |
    A selection of correspondence Is the term “Islamism” a useful way to discuss extremism?
    Also this week, America and Panama, contrails, NASA’s latest telescope, Chinese
    law, punctuation, French cheese Sep 24th 2026 Letters are welcome via email to
    letters@economist.com F ind out more about how we process your letter The Economist
    puts forward the argument that the term “Islamism” is a useful way to discuss
    extremism without treating Muslims collectively as a threat (“Much ado about…something”,
    September 12th). Yet throughout the article, religious observance, conservative
    attitudes, political organising, Gaza activism, views on sharia and support for
    violence are brought together as evidence of a wider ideological threat. “Islamism”
    is now used so loosely that it can describe both violent authoritarian movements
    and ordinary Muslims lobbying the government, protesting or standing for election.
    Muslim political participation is not evidence of “entryism”, which requires evidence
    of an attempt to enter and actively subvert an institution, not to merely contribute
    to public life. Muslims are not a single political project. Our faith may inform
    how we understand poverty, racism, war or inequality, but religious commitment
    tells us little about somebody’s preferred form of government. Sharia, for many
    Muslims, primarily concerns personal religious and ethical practice. Muslims have
    spent decades being told to integrate and participate. Yet when they organise
    effectively, elect Muslim politicians or challenge government policy, participation
    itself becomes suspicious. Neighbourhoods with significant Muslim populations
    reflect patterns of migration, family and community networks, housing, employment,
    deprivation and discrimination, rather than a shared political ideology. Britain
    has seen sustained anti-Muslim hatred, ranging from discrimination and threats
    to mosque attacks, arson and serious physical violence, alongside foiled far-right
    and neo-Nazi plots to kill Muslims. Recent racist and Islamophobic mob violence
    in Northern Ireland and stabbing attacks in Glasgow are part of a much wider pattern
    of hostility and violence affecting Muslim communities across Britain. Extremism
    and violence should be confronted. But conservative belief, prejudice, coercion
    and violence are not different degrees of the same phenomenon. Rejecting the vague
    label of “Islamism” means refusing to treat ordinary Muslim religious and political
    life as evidence of extremism. Dr Naomi GreenAssistant secretary-generalMuslim
    Council of BritainBelfast I have no difficulty calling out Islamists. As you note,
    at Kismet, a café in the Whitechapel area of London, we do not platform people
    who spend their lives telling other Muslims that they are insufficiently Muslim.
    But confronting Islamism requires defining it. A Muslim who believes faith should
    inform politics is not, by that fact, an Islamist. Nor is one who wears a hijab,
    dislikes Prevent (a UK government early-intervention counter-terrorism strategy),
    protests over Gaza or votes for an independent Muslim candidate. I disagree with
    several of those positions myself; none is extremism, and political participation
    is not evidence of Islamism. Your article acknowledged the distinction and then
    blurred it, folding population growth, segregation, social conservatism and electoral
    organising into a single ominous narrative. Islamists and the far right need one
    another: both tell Muslims they can never fully belong, and both present the most
    intolerant version of Islam as the most authentic. A serious analysis should take
    care not to reproduce their premise while claiming to rebut it. The Britain I
    know includes several million people who are Muslim and British at once. Polling
    commissioned by the Concordia Forum (which I helped found) last October found
    that 85% of British Muslims call democracy the best system of government, against
    71% of the wider public; and that 94% back equal treatment under the law for all
    faiths and none. A community said to be the vanguard of political Islam overwhelmingly
    wants what political Islam rejects. That story is less sensational. It is also
    true. MUDDASSAR AHMEDFounderKismet CaféLondon One important element is missing
    from your discussion of Islamist pressure within Muslim communities. Europe already
    possesses a powerful liberal principle. Article 9 of the European Convention on
    Human Rights protects freedom of thought, conscience and religion, explicitly
    including the freedom to change one’s religion or belief. It also recognises that
    the manifestation of religion may be limited where necessary, including “for the
    protection of the rights and freedoms of others”. This principle deserves greater
    prominence. Muslims who resist pressure from their conservative communities should
    know that their individual rights are protected. Equally, Europeans worried about
    Islamist “entryism” should know that religious freedom does not give a community
    unlimited authority over its members. Governments need not discover anyone’s hidden
    agenda, nor decide which interpretations of Islam are acceptable. They should
    articulate and enforce a simpler, religion-neutral principle. The individual is
    the bearer of rights; membership of a religious community cannot diminish those
    rights. Making that principle widely understood might protect vulnerable Muslims
    while also answering some of the distrust on which anti-Muslim populism thrives.
    Sethu RathinamCedar Rapids You can read more letters on this topic at economist.com/letters/islamism
    Your report on America’s security co-operation with Panama set up a false choice
    : either Panama accepts unrestricted foreign access or somehow abandons the Panama
    Canal (“Welcome to the jungle”, August 29th). This is simply not reality. No country
    has a greater interest in helping Panama strengthen its security, protect the
    canal and prevent hostile foreign influence than the United States. Under President
    Donald Trump, that commitment is clear once again. For years, successive American
    administrations neglected Panama and our entire hemisphere, meaning drugs, arms,
    illegal immigrants and even terrorists flowed through our region on their way
    to America’s streets and neighbourhoods. President Trump came into office determined
    to change that. The US-Panama relationship is much bigger than a military exercise
    or jungle-training facility, or any single project or programme. It is about regional
    sovereignty, security, prosperity and above all, common sense. President Trump
    is focused on protecting America’s security and economic strength. Together, both
    nations share an obligation to keep the canal out of the hands of any adversary
    and available for international trade. That is why preparation matters. That is
    why co-operation matters. And that is why security cannot rely on diplomatic platitudes.
    Defending the canal and addressing its vulnerabilities is not an American imposition
    on Panama. It is a partnership between two sovereign nations with a shared obligation
    to keep the canal safe, secure and open. America stands with Panama against any
    threat to the canal. Kevin Marino CabreraUS ambassador to PanamaPanama City Aviation
    is the hardest human industry to decarbonise, and will take decades of technological
    transformation. Contrail manipulation is a relatively cheap and easy way to blunt
    the warming effects of aircrafts’ contrails (”Bluer cooler skies”, August 22nd).
    So far, research has focused on contrail avoidance. But there is a place for contrail
    creation. Since contrails are generally short-lived, it can be beneficial to purposely
    create them during the day (which makes the Earth more reflective of the Sun,
    a cooling effect) and avoid them at night, where they reflect infrared radiation
    back to Earth, warming it. Accurate atmospheric modelling is required to make
    such a strategy effective, and such models continue to improve. Dr Bruce SawhillRunway
    EnergeticsSanta Cruz, California Aircraft contrails may warm the planet more than
    the carbon dioxide from aircraft engines, you report. This is true if air traffic
    keeps growing after contrail warming is reduced by two thirds, no longer exceeding
    the direct carbon warming. In other words, the case for rerouting is strongest
    when aviation continues to grow. Geography also limits re-routing’s effectiveness
    where aviation is growing fastest. Area for area, contrails warm the atmosphere
    over Europe more than ten times as intensely as over China and East Asia, where
    aircraft cruise lower and the subtropical air is drier. In these regions, almost
    all long-lived contrails form inside pre-existing ice clouds, where the added
    warming is small and may even turn to cooling. Re-routing aircraft is cheap and
    worth trying, but it’s a one-shot effect. The warming from aviation’s carbon emissions,
    on the other hand, will continue to grow as long as jet fuel is burned. Ben SandersonResearch
    professorCICERO Centre for International Climate ResearchOslo An important achievement
    was overlooked in your piece on the launch of the Nancy Grace Roman Space Telescope
    (“A cosmic outlook”, September 5th). NASA delivered the telescope ahead of schedule
    and under budget. Hubble, Roman’s “original predecessor”, was launched seven years
    behind schedule and, since its official start in 1977, has cost more than $19bn
    in inflation-adjusted dollars. By comparison, Roman was launched nine months ahead
    of schedule and its lifecycle cost is approximately $4.3bn. When Roman sends back
    its first images to Earth in early 2027, American taxpayers will have many reasons
    to marvel. T. Michael SpencerWashington, DC “Law-law, not jaw-jaw” (August 29th)
    reported on the long arm of the Chinese state as it tries to get its laws applied
    everywhere. You mentioned that in the 19th century colonial powers refused to
    recognise Chinese law in the ports they controlled, which the Communist Party
    still thinks of as an humiliation. You find it striking that China now wants to
    play the modern extraterritorial game of sanctions and counter-sanctions. Extraterritorial
    rights for foreigners applied throughout China, not just the treaty ports, and
    well into the 20th century, right up to the second world war. British judges,
    bewigged and begowned, sat in trials all over China with British juries deciding
    on guilt or innocence. An American doctor who shot and killed a Buddhist monk
    in Tibet in 1907 was brought all the way to Shanghai for trial in the United States
    Court for China. The very last American trial was of a member of the Flying Tigers
    in Kunming, Free China, in 1943. Perhaps more importantly, China was not against
    extraterritoriality as a matter of principle. Where it could China sought extraterritorial
    rights for its own nationals. It agreed to mutual extraterritoriality with Japan
    in the 1870s and imposed it on Korea in the 1880s. Even for China, extraterritoriality
    was part of the Great Power game. Now it considers itself a Great Power, why would
    China not play the modern version of the game? Douglas ClarkHong Kong “To the
    point” (August 22nd) underscored the fact that punctuation matters . Consider
    the lore surrounding Maria Fyodorovna, empress of Russia, whose misplaced comma
    saved a political prisoner from exile. The intended order, “Pardon impossible,
    to be sent to Siberia” moved a comma to read, “Pardon, impossible to be sent to
    Siberia,” thus flipping a sentence of strict condemnation to an absolute release.
    A lesson I learned as a child to preserve harmony at the family dinner table was
    always remember the comma in “Let’s eat, Grandma.” Otherwise, “Let’s eat Grandma”
    would put her on the dinner menu. MICHAEL BURIKSan Rafael, California Your review
    of Florence Hazrat’s “On the Mark” brought back memories of a comedy routine by
    Victor Borge, a Danish-American comedian, which readers can find on YouTube by
    searching for “Phonetic Punctuation”. Borge reads a passage from a book, giving
    voice to every punctuation mark. It is hilarious—swoosh pop. DOUGLAS KRAJNOVICHMerced,
    California Britain may have more cheeses than France , but it does not have anything
    like French unwritten rules and etiquette when it comes to slicing them (“Say
    cheese!”, August 15th). You risk social exclusion if you even think about cutting
    le nez from a Brie. Slitting across a Camembert (rather than cutting a pointe,
    like a pizza) invokes utter disdain. And never dip your Tomme de Savoie in mayonnaise
    or you will be sent to Xaintrie en toute hâte. Mike CookLondon This article was
    downloaded by zlibrary from https://www.economist.com/letters/2026/09/24/is-the-term-islamism-a-useful-way-to-discuss-extremism'
