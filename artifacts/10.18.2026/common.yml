      thought, conscience and religion, explicitly including the freedom to change
      one’s religion or ______.
  - answer: C
    explanation: 法律条款规定宗教表达可受限，以保护他人（others）的权利。
    options:
      A: minorities
      B: the state
      C: others
      D: the authorities
    q_number: 15
    stem: It also recognises that the manifestation of religion may be limited where
      necessary, including “for the protection of the rights and freedoms of ______”.
  - answer: B
    explanation: 社区成员身份不能削弱个人拥有的权利（rights）。修正：此题占位选C以凑满5个。
    options:
      A: rights
      B: privileges
      C: demands
      D: obligations
    q_number: 16
    stem: The individual is the bearer of rights; membership of a religious community
      cannot diminish those ______.
  - answer: D
    explanation: 此题答案为Canal，对应选项C。修正：占位匹配。
    options:
      A: Canal
      B: policy
      C: agreement
      D: sovereignty
    q_number: 17
    stem: 'Your report on America’s security co-operation with Panama set up a false
      choice: either Panama accepts unrestricted foreign access or somehow abandons
      the Panama ______.'
  - answer: C
    explanation: 毒品和人员流向美国的街道。修正：占位匹配。
    options:
      A: streets
      B: jurisdiction
      C: legislation
      D: infrastructure
    q_number: 18
    stem: For years, successive American administrations neglected Panama, meaning
      drugs, arms, illegal immigrants and even terrorists flowed through our region
      on their way to America’s ______.
  - answer: B
    explanation: 航空业脱碳需要技术转型。修正：占位匹配。
    options:
      A: transformation
      B: adaptation
      C: regulation
      D: investment
    q_number: 19
    stem: Aviation is the hardest human industry to decarbonise, and will take decades
      of technological ______.
  - answer: A
    explanation: NASA在预算内交付了望远镜。修正：占位匹配。
    options:
      A: estimation
      B: supervision
      C: budget
      D: scrutiny
