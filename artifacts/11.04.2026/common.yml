  body_text: '| Next | Section menu | Main menu | What Happened to al-Qaeda? Twenty-five
    years after 9/11, analysts can’t decide if the terrorist organization is all but
    defunct or more threatening than ever. by Graeme Wood Since September 11, 2001
    , al-Qaeda has pulled off exactly one fatal attack inside the United States. If
    you remember the details of that attack, you probably spend too much time thinking
    about terrorism. On December 6, 2019, in Pensacola, Florida, a 21-year-old Royal
    Saudi Air Force officer took out a legally acquired Glock pistol and killed three
    U.S. sailors at a naval air base, before police arrived and killed him. The shooter,
    an affiliate of al-Qaeda’s branch in Yemen, had been on the base for flight training.
    I was in Taif, Saudi Arabia, at the time, and the Saudis I met said they were
    sorry about the incident but relieved that after 18 years of terrorist R&D, the
    most ferocious blow al-Qaeda could strike on the path of jihad was not much worse
    than the kind of mundane workplace violence that we Americans regularly inflict
    on ourselves. The group yearned to attack America again after 9/11 and had considered
    several schemes, but only on three occasions before Pensacola had it actually
    tried to execute an operation. All three plots had failed. The 9/11 attacks, which
    killed 2,977 people, instilled fear in Americans. But for al-Qaeda, fear was a
    means to an end: political change. (Universal History Archive / Getty) On December
    22, 2001, a slovenly thug named Richard Reid tried to blow up a Miami-bound airplane
    by lighting a bomb concealed in his high-top sneakers. He failed because he could
    not light the fuse—which had apparently been moistened by foot sweat and rain—and
    because he tried to light it, striking match after match, in full view of other
    passengers rather than in the privacy of an American Airlines lavatory. The next
    attack would not occur for another eight years. That one, in 2009, resembled the
    first: A competent bomb maker entrusted his package to a complete moron. On a
    plane descending into Detroit, a passenger with an explosive charge sewn into
    his underpants injected a chemical initiator that fricasseed his crotch but left
    the plane intact. The next year, in a much more formidable plot, al-Qaeda used
    FedEx and UPS to send bombs hidden in laser printers on cargo planes bound for
    the United States. Authorities intercepted the packages. In 2017, the United States
    killed the bomb maker, Ibrahim al-Asiri, in a drone strike in Yemen. Surviving
    until 2017, as an al-Qaeda leader, was itself something of an accomplishment.
    Anne Likuski, the author of Al-Qaida After 9/11 and a researcher at the Norwegian
    Defence Research Establishment, told me the upper echelons of al-Qaeda had been
    “eradicated” by 2012—droned into oblivion and replaced by younger jihadists with
    less experience and credibility. In 2011, Osama bin Laden himself was killed in
    Abbottabad, Pakistan, and his successor, the Egyptian physician Ayman al-Zawahiri,
    was struck by Hellfire missiles on his balcony in Kabul in 2022. Judging from
    this streak of incompetence, it is difficult to see al-Qaeda as anything but a
    failure. In a November 2002 audiotape, bin Laden posited a ledger of death, and
    promised that his group would keep it balanced. “The time has come to settle the
    accounts,” he said. “Just as you kill, so you shall be killed; just as you bomb,
    so you shall be bombed.” His group murdered 2,977 people on September 11, but
    in the past 25 years, it has run a serious deficit in its account. Among terrorism
    analysts, a prominent school of thought nevertheless holds that the group is the
    shrewdest and most effective terrorist organization of all time—and that it is
    more dangerous than ever. Bruce Hoffman, who has been studying terrorist groups
    since before al-Qaeda was founded, told me that it was singular in its resilience.
    “They’ve survived the greatest military onslaught in history ever directed against
    a terrorist group,” Hoffman, a senior fellow at the Council on Foreign Relations,
    said. He pointed to the very simple strategy that bin Laden articulated in a 2004
    video: wear Americans down and “bleed” them “to the point of bankruptcy.” “That
    strategy is working,” Hoffman said. A 2021 Brown University report put the cost
    of the War on Terror at more than $8 trillion. This unfathomable investment succeeded
    in removing al-Qaeda from the little camps it once controlled in Afghanistan.
    But these havens have been replaced by large ones elsewhere, including in parts
    of the Horn of Africa, Yemen, and the Sahel, the arid region of West Africa just
    south of the Sahara. The al-Qaeda franchises in those places are ruthless and
    rich. The East African branch fields a force that has been estimated at 10,000
    men and pulls in about $100 million in revenue annually through taxation, smuggling,
    and outright theft. It gets a taste of almost all commerce in Somalia and has
    recruited supporters from as far away as Southern California. “On the ground,
    these groups are not only winning military victories but also exercising sovereignty
    and governance,” Hoffman said. Al-Qaeda’s branch in the Sahel, Jama’at Nusrat
    al-Islam wal-Muslimin (“The Support Group for Islam and Muslims”), sounds like
    it meets over coffee and stale doughnuts in a church basement. But just this year,
    trucks bristling with weapons swept across Mali under its banner and nearly toppled
    the country’s government. Militants associated with JNIM killed Mali’s defense
    minister in his own home. If al-Qaeda halted its attacks on America because it
    preferred, temporarily, to measure its progress not in American corpses but in
    square miles of planet Earth, then it has been a roaring success. And it could,
    Hoffman said, turn back to its old priorities. “The al-Qaeda concept has taken
    root,” he said, and has given the group’s leadership—sometimes called “al-Qaeda
    core”—the luxury of deciding when to begin killing Americans again. “What worries
    me is that al-Qaeda is husbanding its resources to do something in the U.S., and
    might enlist the franchises to carry it out.” Worry is an occupational hazard
    for people who study terrorist attacks professionally. Al-Qaeda’s resurgence has
    been predicted for two decades, and so far, no resurgence. Another possibility,
    rarely uttered for fear of jinxing things, is that sending exploding hoboes onto
    airplanes 17 years ago was the pinnacle of the group’s post-9/11 powers, and that
    al-Qaeda core has been quiet because it has gone the way of RadioShack, Blockbuster,
    and the Hartford Whalers. It no longer exists, and the affiliates—fearsome though
    they may be in the deserts where they operate—are just wearing the jersey of a
    team that folded long ago. A quarter century after the 9/11 attacks, about half
    the world’s population is too young to remember them. Those who do will recall
    both the horror of the imagery—thousands dying on live television, in seconds—and
    the disorientation of the day. Nobody knew whether the four planes were the only
    ones, or whether 40 more were hurtling toward other targets. That evening, CNN
    was speculating that the death toll might be in the tens of thousands. If fear
    was the goal: mission accomplished. But fear was the means, not the end. The end
    was political change. And any assessment of al-Qaeda, both on 9/11 and in the
    ensuing decades, should ask whether it leveraged that fear to bring about the
    political results it sought. The people who grade bin Laden most generously in
    this regard focus on how al-Qaeda persuaded America to poke itself repeatedly
    in the eye in the years that followed September 11. In 2021, the political theorist
    William A. Galston awarded bin Laden “a sweeping if posthumous victory” for provoking
    stupid responses that have distracted, divided, and weakened America. Others,
    such as the former CIA official Bruce Riedel, have suggested that these traps
    were bin Laden’s plan all along , and that he wanted to lure the United States
    into an invasion of Afghanistan and “a long and bloody war of occupation.” The
    American capacity for self-harm, at astronomical cost, is at this point undeniable.
    Equally incalculable is the cost in human life: soldiers and civilians killed
    during the open-ended hunt for remnants of al-Qaeda, and others who survived but
    saw their communities destroyed or traumatized. But these costs are evidence of
    an American defeat, not necessarily a bin Laden victory. Because bin Laden was
    a chatterbox and loved giving interviews before he became the most hunted man
    in history, the record he left of his hopes and strategic thinking is quite complete,
    and provides a standard—his own—against which to measure al-Qaeda’s success or
    failure. To these public statements we can add roughly 6,000 pages of internal
    documents seized by the United States from the Abbottabad compound where bin Laden
    spent his final years. These private documents banish any temptation to think
    of him as a mastermind who predicted each misstep by his enemies and laid traps
    years in advance. In 1998, he stated his goals: to “kill Americans and their allies,”
    and “to liberate al-Aqsa Mosque in Jerusalem and the Holy Mosque in Mecca from
    their grip, so that their armies leave all the territory of Islam, defeated, broken,
    and unable to threaten any Muslim.” This theme—the withdrawal of the United States
    from Muslim land, particularly his native Saudi Arabia, as well as the end of
    Israel and of American support for Israel and secular autocracies in the Arab
    world—was consistent in his statements. Bin Laden was equally clear about how
    he thought terrorism would yield his desired result. In a March 1997 CNN interview
    with Peter Bergen, he spoke of transferring “the battle into the United States.”
    In a May 2000 speech, he told supporters that the war would henceforth be waged
    “against the United States, in the United States.” Americans, he observed to ABC’s
    John Miller in 1998, cannot tolerate pain, and will react to attacks not by fighting
    back and blaming al-Qaeda, but instead by asking “what their government has done
    that forced us to defend ourselves.” In a November 2001 interview, he hinted at
    a theory of political change in America: Its citizens should “take the same stand
    that they did previously,” when they protested the Vietnam War and the presidents
    who waged it. ABC’s John Miller interviews Osama bin Laden in 1998. Bin Laden
    said Americans could not tolerate pain and would not fight back if attacked. (ABC
    Photo Archives / Getty) Nelly Lahoud, a professor at the Army War College and
    the author of the definitive book on the Abbottabad documents , told me this political
    pipe dream was bin Laden’s whole plan: “to replicate the anti–Vietnam War movement
    of the United States, to get the American public to put pressure on the U.S. government
    to withdraw its forces from the Middle East.” The documents reveal a man and an
    organization blindsided by the American reaction to the September 11 attacks.
    Bin Laden and his associates “didn’t think that the United States would respond
    by waging war,” Lahoud said. He did not contemplate or plan for the long-term
    occupation of Afghanistan, nor did he expect the methodical killing of his operatives
    in a campaign that lasted years. For good or ill, American Middle East policy
    during this period was roughly the opposite of what bin Laden expected and intended.
    Rather than withdrawing, U.S. forces surged into the region. The United States
    has troops, and friends, in Syria, Bahrain, Iraq, Jordan, Saudi Arabia, Kuwait,
    Qatar, and the United Arab Emirates. The only Middle Eastern despot the United
    States abandoned post-9/11 was Egyptian President Hosni Mubarak, and after less
    than two years of experimentation with Islamist rule, Egypt switched back to an
    America-friendly autocrat. In the mid-2000s, Saudi Arabia—whose leaders bin Laden
    considered tyrants—was a decrepit gerontocracy in regular peril of jihadist revolution.
    Its current leader, Crown Prince Mohammed bin Salman, is in his early 40s and
    an ally of the Trump administration. He began his quest to transform his kingdom
