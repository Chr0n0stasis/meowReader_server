  - answer: B
    explanation: 文章指出，在弱势总统时期，国会通过夺取财政分配权和立法主动权，将原本属于行政部门的权力转移到了自己手中，故用“hijacked”一词形容这种扩张。
    options:
      A: Congress legally reclaimed authority from a dormant executive.
      B: Congress seized control over budgetary and policy matters at the expense
        of the executive.
      C: Congress engaged in illegal activities to force a constitutional change.
      D: Congress collaborated with the executive to improve national transparency.
    q_number: 2
    stem: What does the author imply by the phrase 'hijacked power' in the context
      of the Brazilian Congress?
  - answer: C
    explanation: Pix amendments章节详细描述了联邦账户法院发现的大量资金使用违规、虚报预算及资金去向不明的问题，旨在论证国会预算控制权带来的腐败风险。
    options:
      A: To illustrate the high level of efficiency in Brazilian local project funding.
      B: To highlight the transparency mechanisms enforced by the Supreme Court.
      C: To provide evidence of corruption and lack of oversight in congressional
        spending.
      D: To show how lawmakers use their budget control to foster national economic
        growth.
    q_number: 3
    stem: Why does the author discuss the 'Pix amendments' in the article?
  - answer: C
    explanation: 文中明确指出，以往总统可以通过控制预算作为筹码（bargaining chip）来换取议员支持，而随着议员获得了对预算的直接控制权，总统失去了这一筹码。
    options:
      A: Presidents have gained more leverage to ensure their agendas are passed.
      B: Presidents are now more reliant on the judiciary to balance the budget.
      C: Presidents have lost their primary bargaining tool to maintain congressional
        support.
      D: Presidents are forced to align with the Centrão to secure their re-election.
    q_number: 4
    stem: What is the consequence of the current congressional budget control for
      Brazilian presidents?
  - answer: B
    explanation: 文章结尾总结指出，下任总统不仅面临经济、社会极化等压力，最大的制约在于面对一个权力过大且倾向于限制总统权力的国会。
    options:
      A: The need to reform the judiciary to curb its excessive power.
      B: Managing a polarized electorate while navigating a dominant and self-serving
        Congress.
      C: The requirement to reverse the record-breaking re-election rate of incumbents.
      D: The struggle to regain executive control over the country's mandatory spending.
    q_number: 5
    stem: Which of the following best summarizes the main challenge facing Brazil's
      next president?
  source_journal: Economist
  title: The big democracy where lawmakers are mightier than the executive
