  body_text: Following publication of this article, we are correcting Extended Data
    Fig. 8. This figure contained boron-based CO 2 from the compilation by Rae et
    al., 2021 (ref. 18 in the article), which had slightly different criteria for
    excluding studies than the CenCO 2 PIP Consortium dataset that we used for Fig.
    3. For continuity, we are replacing Extended Data Fig. 8b with a new version that
    contains boron-based CO 2 from the CenCO 2 PIP database. The previous Extended
    Data Fig. 8b contained 176 points distinguished by core site (upside-down triangles
    for site 999, plus sign for site 926 and squares for site 668). The new Extended
    Data Fig. 8b contains 32 additional data points and distinguishes boron-based
    CO 2 reconstructions by foraminiferal species instead of core site (G. ruber (upside-down
    triangles) and T. trilobus (plus signs)). The added data produced from T. trilobus
    (plus signs) were originally from Bartoli et al.1 and exhibit a closer agreement
    with our new ice core CO 2 record (this study). These data were always included
    in Fig. 3 and thus this correction does not change that figure. Additionally,
    the foraminiferal species were incorrectly assigned to the various studies and
    have now been corrected in the new figure and in the wording in the Methods. Four
    boron isotope proxy studies used G. ruber (Foster et al., 2008 (ref. 79), Chalk
    et al., 2017 (ref. 35), Martinez-Botí et al., 2015 (ref. 80) and de la Vega et
    al., 2020 (ref. 83)) while three used T. trilobus (Hönisch et al., 2009 (ref.
    36), Dyez et al., 2018 (ref. 81) and Sosdian et al., 2018 (ref. 82)). Note that
    Sosdian et al. also include G. ruber data from the paper by Chalk et al.. We thank
    Bärbel Hönisch and Thomas Chalk for bringing these corrections to our attention.
