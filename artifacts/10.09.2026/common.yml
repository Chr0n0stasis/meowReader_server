- article_update_date: 08.12.2026
  body_text: 'Governments are making a dangerous bet on the AI boom Leaders | Onwards
    and upwards Governments are making a dangerous bet on the AI boom To see why,
    look to the bond markets Aug 6th 2026 After a STEADY upward climb this year, 30-year
    bonds in America, France, Japan and Britain are all near their highest since the
    global financial crisis of 2007-09. That feat is particularly impressive for Britain,
    where the highs during a fiscal panic in 2022 have been long surpassed. For anyone
    who was wondering if yields would return to the lows of the 2010s as inflation
    fell after the pandemic, markets appear to have supplied a decisive answer: they
    will not. If anything, they are likely to climb higher still. The culprits are
    clear. Inflation has not quite been beaten, deterring central banks from cutting
    interest rates. Even Japan is leaving behind its loose-money policies (though
    not enough to strengthen the yen, which both Japan and America have propped up
    with official purchases). Gaping rich-world budget deficits show little sign of
    narrowing meaningfully, raising the possibility that governments eventually force
    central banks to inflate their debts away. Geopolitical ructions, like the Iran
    war and tariffs, are lifting the compensation for risk that investors demand.
    It does not help that Kevin Warsh , the new Federal Reserve chair, fumbled an
    early encounter with the markets. High bond yields are a problem for indebted
    governments. Every percentage-point rise in America’s bond yields, for instance,
    costs it extra interest payments worth 1.3% of annual GDP within a decade. Yet
    it is getting harder to imagine governments making cuts to offset the squeeze.
    In America each political party seems to be hoping that any debt crisis lands
    on the other. France’s presidential election next year could become a fight between
    populist parties on the left and right. Japan is, bizarrely, undertaking a fiscal
    stimulus. The longer governments wait to adjust, the bigger the adjustments become.
    Governments look increasingly as if they are betting on economic growth to pay
    the bills—which today means a bet on ai. The trouble is that faster growth, by
    boosting investment, usually brings higher interest rates and higher bond yields.
    Today higher market rates have arrived before faster growth. The sheer scale of
    data-centre investment, pegged at $1trn this year by Goldman Sachs, a bank, is
    making capital scarcer and helping raise yields. However, AI has yet to boost
    productivity measurably, even in China where diffusion of the technology is arguably
    the furthest along. It could be a while before the boost comes. Electricity and
    computing took decades to raise productivity growth perceptibly. Not all economies
    will fare equally well, either. Europe’s fiscal woes could worsen if AI brings
    more growth for America, pulling up global interest rates, but gets jammed up
    in the old world by rigid labour markets and high energy costs. That would mean
    costlier debt without any more growth. There is another problem, too. If the productivity
    boost from AI is large enough to transform any country’s fiscal arithmetic, vast
    job disruption is probably coming, meaning more spending on unemployed workers
    . Income may also shift from labour to capital, which is more lightly taxed. Should
    AI prompt an arms race, countries will also need more defence spending. Even the
    exciting prospect of longer lifespans, fuelled by AI-powered scientific advances,
    would raise state spending on pensions. Economists at the Brookings Institution,
    a think-tank, reckon these factors plus higher interest rates could more than
    halve the positive impact of AI-induced growth on American deficits. The last
    time much of the rich world, including America and Britain, ran budget surpluses
    was at the turn of the millennium. That required fast productivity growth, which
    came from computers and the early internet. But deficits had to be cut, too. Without
    fiscal prudence, bonds are a punt on AI that looks just as risky as betting on
    wobbly tech stocks. ■ This article was downloaded by zlibrary from https://www.economist.com/leaders/2026/08/05/governments-are-making-a-dangerous-bet-on-the-ai-boom'
