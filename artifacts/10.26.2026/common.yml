  title: Chinese, Russian and Indian ministers meet
- article_update_date: 09.06.2026
  body_text: '| Next | Section menu | Main menu | Previous | The Mysterious Art of
    Conducting An inside look at music’s widely misunderstood profession by Matthew
    Aucoin An 1846 caricature of the Romantic composer Hector Berlioz, known for his
    love of big, loud orchestras (Stefano Bianchetti / corbis / Getty) The conductor
    is a con artist. Or: The conductor is God. Musicians frequently encounter both
    of these extreme views of music’s most mysterious profession. It’s not surprising
    that conductors elicit suspicion as well as adulation. The very act of conducting—waving
    a wand to summon ravishing or ethereal or earsplitting sounds—can look like either
    inexplicable magic or embarrassing nonsense, a kind of tuxedoed air guitar. With
    most kinds of musical performance, the listener can sense, in their heart and
    their gut, how demanding the musician’s task is. To possess the infinitesimally
    sensitive fine motor skills required to make a violin sing, or the poise and breath
    control needed to coax beauty out of a trombone, is to be not only an artist but
    an Olympic athlete in command of invisible muscles. There’s a reason that a primal
    scene of countless anxiety dreams is the musical performance for which you are
    unprepared, the audience coughing impatiently and the grand piano awaiting you
    in a pool of light, like some kind of gleaming, jet-black armored tank. Conducting
    is different. I would bet that practically everyone who’s seen a conductor leading
    an orchestra has had the fleeting thought Come on, anyone could do that . They’re
    just waving their arms! Aren’t they? And if not, then what exactly are they doing?
    Plenty of people—plenty of musicians, even—mistrust the abracadabra mysticism
    that so frequently surrounds practitioners of this elusive and slightly dubious
    art. At the other end of the spectrum is the equally inaccurate notion that the
    conductor is an infallible being with almost supernatural powers. People who hold
    this view tend to assume that the orchestra would be utterly helpless without
    the sage guidance of the baton-wielder; they forget that any good ensemble is
    made up of dozens of experienced, intelligent musicians, each of whom is capable
    of autonomous musical thought. Listeners inclined in this direction will sometimes
    marvel that the conductor seems, somehow, to know every note of everyone’s part.
    If they attend a rehearsal, they might swoon over even a simple request from the
    maestro—for example, to play a passage more lyrically—as if it were a commandment
    from on high. From the May 2025 issue: Does anyone actually know what classical
    music is? I’m mainly a composer ; I’m at my happiest confronted with a blank sheet
    of staff paper. But I am also a conductor, of both my own music and other music.
    And the mystery of conducting has fascinated me since long before I picked up
    a baton. Orchestral musicians don’t need a conductor in order to execute the core
    tasks of music-making. And yet, with an exceptional conductor on the podium, an
    electricity can flow through the ensemble, an extra energy that helps dozens of
    musicians breathe and speak as one complex, multifarious organism. Conducting
    is, above all, a profound exercise in trust: the orchestra trusting the conductor
    to keep a hand on the throttle, the conductor trusting the orchestra to soar.
    Conductors aren’t always necessary, of course. For someone to stand up and wave
    their arms at a trio or quartet would be superfluous, not to mention insulting.
    Communicating is easy in a small group, where the musicians can face one another,
    like friends in a booth at a restaurant, and have a musical conversation. Everyone
    can hear every other part clearly; the players can meet one another’s eyes, breathe
    together. This kind of interaction can turn cumbersome, however, once a gathering
    reaches a certain numerical threshold. A group of four or five friends can decide,
    on the fly, where to go for dinner. But a group of 70 or 80 people? Any given
    member of the group probably doesn’t know every single other person, and holding
    one conversation without some kind of agreed-upon structure would be all but impossible.
    In such situations, even the most independent-minded adult can yearn for a competent
    event planner. One of the conductor’s core functions is to be that helpful, sheepdog-like
    presence. Conducting, as a distinct profession, only emerged in the mid-19th century,
    an inevitable result of converging musical and technological developments. The
    Industrial Revolution left its imprint on music as on so much else, enabling the
    invention of newfangled instruments: the tuba, the saxophone, the celesta. Instruments
    that had been around for centuries got upgrades; the addition of piston valves
    to trumpets and French horns, for example, made them louder and more precise.
    In turn, these technical improvements made possible the roaring, oceanic modern
    orchestra, an ensemble capable of producing the rich, polished sound that we might
    call “cinematic” today. Many composers made gleeful use of the new coloristic
    possibilities available to them. Now they had brass sections whose burnished,
    gleaming tone could rattle the listener’s ribs, and string sections so large and
    lush that they could lull their audience into a narcotic stupor. Orchestras got
    bigger and bigger, ultimately evolving into the musical counterpart of the mighty
    steamboats and freight trains of the Industrial Age. And like those boats and
    trains, these ensembles were unwieldy enough that they needed conductors to steer
    them. The aristocratically sponsored court orchestras of earlier centuries tended
    to be small enough that they didn’t require a conductor. Those ensembles often
    performed in intimate halls, for exclusive audiences, and they were typically
    led by the first violinist or a keyboardist, who would mark time with their bow
    arm or their head while playing. But throughout the 19th century, in both Europe
    and the United States, musical organizations sprang up that, rather than being
    housed at royal courts, were founded by private citizens. These new orchestras
    were civic institutions, and they were intended to be available to as many people
    as possible. To accommodate this bigger audience, many cities built formidable
    new concert halls, and the size of the ensembles onstage grew too. The solitary,
    magus-like figure of the conductor was also an ideal emblem of the Romantic age,
    a period that valorized the lone artist endowed with mystical gifts. Composers
    had once tended to think of themselves as craftsmen, not so different from woodworkers
    or shipbuilders or shoemakers. Regardless of whether a church composer was feeling
    especially inspired in a given week, his job was to write new music for every
    Sunday service. The Romantic composers had a very different conception of the
    artist’s relationship to the world. The creative artist was a singular, almost
    divinely inspired fountain of imagination, a spirit blessed (or cursed) with the
    capacity to gaze into the heavens and the abyss. Composers such as Hector Berlioz
    and Richard Wagner dreamed up wild, intricately phantasmagorical works so challenging
    for musicians of the time that both composers had to take up the baton themselves
    to make their musical cosmos a reality. The conductor, and especially the composer-conductor,
    was the Romantic figure par excellence, the visionary who faced a sea of musicians,
    like some figure out of a Caspar David Friedrich painting, and summoned storms.
    Arturo Toscanini, circa 1955 (R. Gates / Hulton Archive / Getty) Once orchestras
    reached this grand scale, the conductor became a practical necessity. Logistical
    and spatial issues intrude when you have 90 or 100 people onstage. With an ensemble
    of this size, someone at one end of the stage is going to find hearing exactly
    what’s going on at the other end extremely difficult. If you’re a trombone player,
    sitting way in the back, are you really going to notice if the first violins speed
    up a hair, way down in front? If the formidably loud colleagues who surround you—trumpets,
    tubas, timpani—happen to be playing their heart out too, they’re probably the
    only people you’ll hear. How, then, are you supposed to coordinate what you’re
    doing with people playing much quieter instruments at the other side of the stage?
    How can you tell whether your sound is balancing and blending with people you
    can’t even hear properly? And how would you synchronize your playing with theirs,
    especially given the fluid sense of rhythm that’s integral to the performance
    of so much orchestral music? If you mainly listen to contemporary pop music, you’re
    probably accustomed to hearing a steady beat; a lot of pop music today is even
    recorded to a “click track,” or a preset electronic pulse that provides a string
    of beats spaced with absolute, inflexible evenness. In such music, the performer’s
    first task is to lock into that easily audible pulse. If a steady beat is present,
    getting through a piece without a conductor is no problem for a group of musicians,
    no matter its size. Even an orchestra of 100 players would do fine on its own
    if it were simply playing along with a very loud drummer. The trouble is that
    in most orchestral music, no such beat exists; absolute metronomic steadiness
    usually isn’t the goal. Time can flow with the changeability of a river current.
    It might be swift and free at one moment, and then a second later turn halting
    and trickling, as if navigating around boulders. Even within a single phrase,
    a performer might feel an impulse to slow down and caress an especially tender
    change of harmony, and then to surge forward again once the moment passes. One
    of the thrills of orchestral performance is that the pacing is flexible and volatile;
    the same piece might move somewhat differently from one evening to the next. In
    a given performance, if the violins bring an extra dose of voluptuous beauty to
    a certain section, the whole ensemble might want to slow down more than usual,
    to wring every drop of expressive power from the music. This is the conductor’s
    essential task: to embody, guide, and react to the current of the music. A responsible
    conductor understands that they must both lead and serve as listener in chief.
    They should have a clear plan for how a performance will be shaped, but they must
    also be prepared to respond to their colleagues’ music-making as it happens. If
    a particular player or section is doing something magical, the conductor should
    know how to absorb that energy and reflect it back to the ensemble. Last year,
    when I conducted performances of my piece Music for New Bodies at Lincoln Center,
    I remember being so stunned by the oboist Joseph Jordan’s beautiful sound that
    his solo sections expanded and stretched in ways I hadn’t anticipated, even though
    I wrote the music. The transference of musical ideas between conductor and orchestra
    is a two-way street. And although conductor and orchestra alike are guided by
    a score, a single piece of music can be performed countless ways. There can be
    as many interpretations of a phrase in a Mozart symphony as there are members
    of the orchestra. Should a given moment sound joyous, wistful, irreverent, sarcastic?
    What is its emotional temperature? What should the quality of sound be—dark or
    gleaming, soft-textured or biting? The risk, when an ensemble performs without
    a conductor, is that everyone’s different musical ideas can get averaged out,
    that everyone can gravitate toward the median interpretation rather than the most
    daring. Read: What a classical-music critic reads But the fact that small or medium
    orchestras could play without a conductor means that the bar for what conductors
    offer ought to be set very high. Both orchestras and audiences have a right to
    ask: Is this performance stronger and more expressive thanks to the person waving
    the baton? Orchestral musicians have a bone-deep instinct for this; they can usually
    tell within the first minute of the first rehearsal whether a given conductor
    is likely to make their life easier or harder. If the orchestra is playing a familiar
    piece—say, a Brahms symphony—and the conductor’s cue results in a first chord
    that sounds hesitant or scattered,'
