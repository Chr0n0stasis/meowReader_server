- article_update_date: 06.30.2026
  body_text: 'Hello Nature readers, would you like to get this Briefing in your inbox
    free every day? Sign up here. People get relief from a water hose on 25 June in
    Cologne, Germany, as a record-setting heatwave pummels the nation.Credit: Ina
    Fassbender/AFP via Getty A record-breaking heat wave is baking Europe, hot on
    the heels of unprecedented temperatures in May. “Heatwaves are here to stay, until
    we turn the tap off to global emissions,” says Samantha Burgess, deputy director
    of Europe’s Copernicus Climate Change Service. “They’re more frequent, they’re
    more intense and they’re lasting longer.” Europe is heating up twice as fast as
    the global average, and scientists are trying to understand the complex factors
    that will determine whether this year’s sweltering heat should be considered ‘the
    new normal’. Nature | 7 min read Source: Zeke Hausfather/Berkeley Earth A Chinese
    supercomputer called LineShine has shot to the top of the world’s fastest computers
    list — the first China-based system to achieve this ranking in almost a decade.
    LineShine combines conventional computer processing with artificial-intelligence
    capabilities, but doesn’t use graphics processing units (GPUs), the chips that
    are usually required to handle the concurrent calculations needed for AI computation.
    Instead, the machine draws its computing power from 14 million processing cores,
    including specialized units to shoulder some of the burden of calculations that
    usually require GPUs. Nature | 5 min read Scientists are raising the alarm about
    proposals from the ascendent far-right political party Alternative for Germany
    (AfD) that they say could severely limit academic freedoms at German universities
    and research institutes. For example, in Saxony-Anhalt — where recent polls have
    seen the party’s support exceed 40% — the AfD’s manifesto proposes sweeping reforms
    to the state’s university system. “The AfD’s election programme explicitly proposes
    restrictions on, or even the prohibition of, research in certain fields,” and
    constrains the mobility of researchers in and out of the state, says Bettina Rockenbach,
    president of the German National Academy of Sciences Leopoldina, which has its
    headquarters in the state. Nature | 7 min read Hundreds of grant applications
    to the US National Institutes of Health (NIH) are being held up at any given time
    by unprecedented scrutiny after peer review. Some have been flagged by an algorithm
    for using terms, such as ‘gender’ and ‘climate change’, that have been deemed
    not to conform with the priorities of the administration of US President Donald
    Trump. These new layers of review have delayed delivery of funds, and have even
    resulted in the outright rejection of some applications that had been approved
    by outside and agency scientists — a situation unheard of before 2025, officials
    say. Nature | 11 min read Features & opinion A handful of start-up firms are testing
    therapies that target specific epigenetic markers — essentially chemical groups
    that sit on DNA and the proteins that it is wound around — to treat everything
    from high cholesterol to a rare muscular disorder. Changing these chemical markers
    can switch genes on or off. Some existing medications influence epigenetic markers,
    but these drugs act broadly and lack specificity. A new cadre of scientists has
    found ways to precisely alter the epigenetic signals that influence specific genes.
    Nature | 15 min read Darío Gil is the science chief at the US Department of Energy
    (DoE), presiding over two of the Trump administration’s prized fields: artificial
    intelligence and quantum science. But he’s also got the unenviable task of convincing
    scientists that these fields deserve the massive investments they are receiving
    — at a time when researchers are worried about securing funding for basic research
    and losing jobs to AI. “I haven’t moved one dollar” between disciplines, Gil tells
    Nature. “All I am asking is that if you’re doing biology, can you please explore
    carefully and thoughtfully the implications of this computing revolution for biology?”
    Nature | 8 min read In the vast taiga forest that encircles the far north, ‘zombie’
    forest fires can lie dormant all winter, even under snow, and break out when the
    weather warms. The fires tend to eat away at root systems and collapse large swathes
    of trees, making them obvious from above — allowing researchers to study them
    from satellite images. They found that overwintering fires are on the rise, which
    will mean more summer fires and tougher, zombie-scarred terrain in which to fight
    them. The good news is that forest areas burned by these zombies do seem to be
    able to bounce back, although the mix of tree species changes. Sierra | 7 min
    read'
