- article_update_date: 04.22.2026
  body_text: 'Unless otherwise noted, chemicals and buffer components were purchased
    from Sigma-Aldrich. Cell culture PtK2 cells (ATCC, CCL-56) were cultured in MEM
    (Gibco) supplemented with 10% fetal bovine serum (FBS), 1 mM sodium pyruvate,
    1× non-essential amino acids (Gibco), and 1× antibiotic–antimycotic (Gibco) at
    37 °C in 5% CO 2 . All cell lines were obtained from ATCC, which validates lines
    by STR profiling. We did not further validate them after purchase. Cells were
    monitored for mycoplasma contamination with the ATCC universal mycoplasma detection
    kit (a PCR-based assay) and tested negative. No commonly misidentified cell lines
    were used in this study. Cell line generation For generation of a doxycycline-inducible
    F-tractin–mScarlet and zyxin–LDO–mNeongreen PtK2 cell line, HEK293T (ATCC, CRL-3216)
    cells were co-transfected with lentiviral plasmids and packing plasmids (PMD2.G
    and PsPAX2) using Lipofectamine 2000 (Thermo Fisher Scientific). Six hours post-transfection,
    the culture medium was refreshed. Forty-eight hours post-transfection, the culture
    medium containing lentivirus was collected and filtered. Lentivirus infection
    with polybrene (5 μg ml−1) followed immediately after collection. Three types
    of lentivirus were added to PtK2 cells: F-tractin–mScarlet, zyxin–LDO–mNeongreen,
    and TetOn. Twenty-four hours post-infection, cells that stably integrated the
    lentiviral plasmids were selected with puromycin and blasticidin for one week.
    Cellular cryo-ET grid preparation C-flat 1.2/1.3 holey carbon Au 200-mesh grids
    (Electron Microscopy Sciences) were sputter coated with 22 nm of carbon and baked
    in a dry oven at 60 °C overnight. Grids were plasma cleaned and coated with 10
    μg ml−1 fibronectin (Sigma, FC010) in DPBS for 1–3 h at 37 °C in a tissue culture
    incubator. Fibronectin-coated grids were washed with DPBS and stored in fresh
    PtK2 culture medium in a 35 mm tissue culture dish for immediate use. Doxycycline-inducible
    F-tractin–mScarlet and zyxin–LDO–mNeongreen PtK2 cells were grown to 90% confluency
    before passaging. Cells were thoroughly trypsinized and filtered through a 0.45-μm
    filter to remove clumps. Thirty thousand cells were added to each 35 mm tissue
    culture dish containing the fibronectin-coated grids. Twenty-four hours later,
    the medium was replaced with fresh PtK2 medium containing 100 ng ml−1 of doxycycline
    to induce expression of F-tractin–mScarlet and zyxin–LDO–mNeongreen. The next
    day, grids were prepared for plunge freezing. Grids for the majority of tomograms
    (presented in Fig. 1b and Extended Data Fig. 1c,d) were treated with 1 µg ml−1
    Rho Activator II (Cytoskeleton, CN03) for 3.5 h, while the grid for the tomogram
    presented in Extended Data Fig. 1b (tomogram 11 in Extended Data Fig. 1d) was
    untreated. The grids were then washed with DPBS and loaded onto a Leica EM-GP
    plunge freezer operating at 25 °C. Three microlitres of DPBS was added to the
    front of the grid, followed by blotting from the back using a Whatman no. 5 filter
    paper for 7 s, then flash frozen in liquid ethane. Cryo-fluorescence imaging Grids
    were mounted on a Leica Cryo-CLEM microscope. Epifluorescence microscopy was performed
    using a 50× 0.9 NA air objective at −180 °C. z-Stacks of images were captured
    at a depth of 16 bit. Image acquisition was performed using LAS X software (Leica).
    Images were post-processed with THUNDER (Leica) to denoise, then maximum intensity
    projected. Cellular cryo-ET data collection Data were collected on a spherical-aberration
    (Cs) corrected Titan Krios TEM (Thermo Fisher Scientific) operating at 300 kV
    and equipped with a K3 direct electron detector (Gatan) and a BioQuantum energy
    filter (Gatan) using a slit width of 20 eV. Micrographs were collected at a nominal
    magnification of 15,000×, which corresponds to a calibrated pixel size of 5.05
    Å (2.525 Å in super-resolution mode). The tilt-series were collected using the
    FastTomo acquisition scheme69 in SerialEM70 using a target defocus of −5 μm underfocus.
    Tilt angles ranged from −54° to +54° in 3° increments, grouped in a dose-symmetric
    manner71. Each tilt in the tilt-series had a total acquisition time of 2.4 s and
    total dose of 2.82 e− Å−2, fractionated across 16 frames (0.18 e− Å−2 per frame).
    Cellular cryo-ET data processing Individual tilts were motion-corrected and binned
    2× (to a pixel size of 5.05 Å) using MotionCor2 (ref. 72), and contrast transfer
    function (CTF) parameters were estimated using CTFFIND4 (ref. 73). Tilt-series
    alignment was carried out using AreTomo2 (ref. 74), followed by reconstruction
    using IMOD75 with back-projection at a binning of 2 (voxel size of 10.1 Å). The
    reconstructed tomograms were denoised using cryoCARE76, then the missing wedge
    was predicted and restored with IsoNet77. The tomograms were then segmented using
    a U-Net convolutional neural network with the Dragonfly software78. For the tomogram
    displayed in Extended Data Fig. 1b, the plasma membrane was segmented using MemBrain
    v2 (ref. 79). All membrane segmentations were smoothed using mean curvature motion80.
    Segmentations were visualized using ChimeraX81. Cellular cryo-ET quantification
    Cellular tomogram quantification was performed in a blinded fashion. D.Y.Z.P.
    manually assigned tomograms into low zyxin/F-actin and high zyxin/F-actin bins
    based on the absence or presence of local peaks of zyxin signal intensity relative
    to F-actin intensity in line scans of cryo-fluorescence micrographs (Extended
    Data Fig. 1d). Tomograms were then randomized before quantification by K.H. and
    G.M.A. Sinusoidal filament regions were manually annotated using 3DMOD based on
    the appearance of continuous stretches of oscillating curvature, followed by unblinding
    for analysis. With the exception of tomograms 2 and 10, both annotators consistently
    found similar numbers of sinusoidal filament regions across tomograms (Extended
    Data Fig. 1f). However, relatively few overlapping sinusoidal filament regions
    were selected. Therefore, after removing overlaps, the results for both annotators
    were combined for final quantification (presented in Fig. 1c). The total volume
    occupied by F-actin in each tomogram was estimated by Dragonfly segmentation as
    described above. Actin purification Actin was prepared from chicken skeletal muscle
    as previously described82. All steps were performed at 4 °C unless otherwise indicated.
    In brief, 1 g of acetone powder was resuspended in 20 ml of G-Ca buffer (G buffer:
    2 mM Tris-HCl pH 8, 0.5 mM dithiothreitol (DTT), 0.2 mM ATP, and 0.01% NaN 3 ,
    supplemented with 0.1 mM CaCl 2 ), then mixed by inversion for 30 min. The mixture
    was ultracentrifuged in a Beckman Ti70 rotor at 42,500 rpm (79,766 g) for 30 min.
    The supernatant, containing G-actin monomers, was collected, and 50 mM KCl and
    2 mM MgCl 2 were added to induce F-actin polymerization for 1 h. 0.8 M KCl was
    then added and the mixture incubated for 30 min to dissociate contaminants from
    F-actin, followed by ultracentrifugation in a Ti70 rotor at 42,500 rpm (79,766
    g) for 3 h. The pellet containing F-actin was collected and resuspended in 2 ml
    G-Ca buffer, then incubated overnight to depolymerize filaments. The mixture was
    then Dounce homogenized for 10-15 passes, sequentially sheared with 26 G and 30
    G needles, then dialysed against G-Ca buffer overnight in Spectra/Por 1 dialysis
    tubing (6-8 kDa MWCO). The solution was then collected, sheared again with a 30
    G needle, then dialysed against G-Ca buffer for an additional day. The solution,
    containing dissociated G-actin monomers, was collected and ultracentrifuged in
    a Beckman Ti90 rotor at 70,000 rpm (187,354 g) for 3 h. The upper two-thirds of
    the supernatant was then loaded on to a Cytiva HiLoad 16/600 column for size-exclusion
    chromatography. Purified G-actin was maintained in G-Ca buffer at 4 °C. Protein
    expression and purification Plasmids were propagated in NEB 5-alpha competent
    Escherichia coli cells and purified with either Qiaprep spin miniprep kits (Qiagen,
    for bacterial expression) or the PureYield plasmid maxiprep system (Promega, for
    transfection). Full-length human calmodulin was expressed in Rosetta2(DE3) E.
    coli cells and purified at 4 °C according to a published protocol83. The purified
    protein was collected in Storage Buffer (20 mM Tris-HCl pH 8.0, 100 mM NaCl, 2
    mM β-mercaptoethanol, and 5% v/v glycerol), flash frozen in liquid nitrogen, and
    stored at −80 °C prior to use. For experiments presented in Fig. 1, Extended Data
    Fig. 2a–d, and Supplementary Videos 2–4, constructs for murine myosin Va (amino
    acids 1–1090) and human myosin VI (amino acids 1–1021) featuring C-terminal GFP
    and Flag tags were expressed and purified from Sf9 insect cells using the baculovirus
    system as previously described84. In the myosin VI construct, a GCN4 leucine zipper
    dimerization domain replaced the smooth muscle coiled-coil region originally used
    by Nishikawa et al.85. For all other experiments, equivalent constructs for human
    myosin Va (amino acids 1–1090) and myosin VI (amino acids 1–1021) were expressed
    from a modified pCAG vector featuring a C-terminal GFP and Flag tag in FreeStyle
    293-F cells (ThermoFisher) and purified as described24. In brief, cells were cultured
    in FreeStyle expression medium (ThermoFisher) at 37 °C on an orbital shaker in
    the presence of 8% CO 2 . Cells were transfected when the culture reached a density
    of 1.8 × 106 cells per ml. Per 400 ml of culture, 1.2 ml of 1 mg ml−1 PEI MAX
    (PolySciences) was pre-mixed with 400 µg of plasmid in 15 ml of FreeStyle expression
    medium and incubated for 20 min at room temperature prior to transfection. Myosin
    Va and myosin VI were co-transfected with a modified pCAG vector containing untagged,
    full-length human calmodulin (amino acids 1–149) at a mass ratio of 1:6. Cells
    were cultured for an additional 60 h, then collected and snap frozen in liquid
    nitrogen. Cell pellets were stored at −80 °C. For myosin purification, all steps
    were performed at 4 °C. Cells were resuspended in myosin lysis buffer (50 mM Tris-HCl
    pH 8.0, 150 mM NaCl, 2 mM MgCl 2 , 0.2% 3-((3-cholamidopropyl) dimethylammonio)−1-propanesulfonate
    (CHAPS), 2 mM ATP, 1 mM phenylmethylsulfonyl fluoride (PMSF), 1 μg ml−1 aprotinin,
    leupeptin and pepstatin) and incubated with rocking for 40 min. The lysate was
    clarified by centrifugation in a Beckman JA-25.50 rotor at 20,000g for 30 min.
    The supernatant was collected and incubated with anti-Flag M2 affinity beads (Sigma-Aldrich)
    on a rocker for 1.5 h. The beads were collected and washed three times with myosin
    purification buffer (50 mM Tris-HCl pH 8.0, 150 mM NaCl, 2 mM MgCl 2 and 2 mM
    ATP), then eluted with myosin purification buffer supplemented with 100 µg ml−1
    Flag peptide (Sigma-Aldrich). The eluted protein was buffer exchanged into myosin
    storage buffer (10 mM Tris-HCl pH 8.0, 100 mM NaCl, 2 mM MgCl 2 and 3 mM DTT)
    using an Amicon Ultra-4 concentrator (50 kDa MWCO), then snap frozen in liquid
    nitrogen. Purified myosins were stored at −80 °C prior to use. The C-terminal
    ABD of human α-catenin (amino acids 664–906) was expressed from a pET vector encoding
    an N-terminal 6 × His tag, strep tag, and TEV protease cleavage site as previously
    described8. Transformed Rosetta2(DE3) E. coli were cultured in LB medium at 37
    °C to an optical density of 0.8–1.0, then induced with 0.7 mM isopropyl β-D-1-thiogalactopyranoside
    (IPTG) and cultured at 16 °C for 16 h. Cells were then collected and flash frozen
    in liquid nitrogen. Cell pellets were stored at −80 °C. For purification, all
    steps were performed at 4 °C. Cells were resuspended in lysis buffer (50 mM Tris-HCl
    pH 8.0, 150 mM NaCl, 2 mM β-mercaptoethanol, 20 mM imidazole) and disrupted in
    an Avestin Emulsiflex C5 homogenizer. The lysate was clarified at 15,000g in a
    Beckman JA-25.50 rotor for 30 min, then the supernatant was collected and incubated
    with Ni-NTA resin (Qiagen) with rocking for 1 h. The resin was collected, washed
    with 5 bed volumes of lysis buffer, then eluted with lysis buffer (50 mM Tris-HCl
    pH 8.0, 150 mM NaCl, 2 mM β-mercaptoethanol, 300 mM imidazole). Purified His-tagged
    TEV protease (prepared according to a published protocol86) was then added to
    reach a 0.05 mg ml−1 working concentration, and the solution was dialysed against
    dialysis buffer (20 mM Tris-HCl pH 8.0, 300 mM NaCl, 2 mM β-mercaptoethanol) for
    16 h. The sample was then collected and re-applied to Ni-NTA resin to remove TEV
    protease. The flowthrough was collected, then sequentially purified by anion exchange
    chromatography using a HiTrapQ HP column (Cytiva), followed by size-exclusion
    chromatography on a Superdex 200 Increase column (Cytiva) in gel filtration buffer
    (20 mM Tris-HCl pH 8.0, 100 mM NaCl, 2 mM β-mercaptoethanol). The protein was
    snap frozen in liquid nitrogen and stored at −80 °C'
