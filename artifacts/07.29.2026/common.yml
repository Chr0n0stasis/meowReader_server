  body_text: Conventional n–i–p architecture remains a robust platform for scalable
    perovskite photovoltaics1,2, yet its steady-state efficiency has stagnated at
    ~26% (ref.3), lagging behind p–i–n counterparts4. This performance gap arises
    from persistent non-radiative recombination at textured electron transport layer
    (ETL)/perovskite interfaces, yet the underlying physical origin remains unclear.
    Here, we uncover that these losses originate from the synergistic combination
    of band misalignment and electron accumulation at the buried interface. To address
    this dual challenge, we develop a continuously graded n+/n-doped SnO 2 ETL through
    a ligand-competitive binding strategy, which enables spatially defined doping
    that creates a built-in electric field. This graded architecture simultaneously
    minimizes band offset and accelerates electron extraction, thereby effectively
    suppressing the cross-interface recombination. The resulting n–i–p perovskite
    solar cells (PSCs) achieve a certified steady-state power conversion efficiency
    (PCE) of 27.17% (27.50% in reverse scan), the highest for n–i–p PSCs reported
    to date. The scalability of this strategy is further demonstrated by achieving
    a PCE of 25.79% for a 1 cm2 device and 23.33% for a perovskite module with a 16.02
    cm2 aperture area. This work establishes a generalized paradigm for energy-band
    engineering in metal-oxide transport layers, overcoming a fundamental efficiency
    bottleneck in conventional perovskite photovoltaics.
