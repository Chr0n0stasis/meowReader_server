- article_update_date: 06.23.2026
  body_text: 'The clocks use a precise laser to measure transitions inside the nuclei
    of thorium-229 atoms.Credit: Getty Two teams of physicists have made the world’s
    first nuclear clocks. These radical new devices keep time using fluctuations in
    the energy states of an atom’s nucleus, rather than those of its electrons, which
    atomic clocks currently use to define the length of a second. Working out how
    to extract the ‘tick’ from a nucleus and use it to keep time has taken more than
    20 years. Nuclear clocks should be more robust and portable than the best available
    clocks today because nuclei are hard to perturb and are protected in a crystal.
    As well as potentially one day being more precise, they also give physicists an
    unprecedented way to probe the forces at play inside a nucleus. Two nuclear clocks
    have been presented in two studies, which were posted on the preprint server arXiv
    on 3 and 7 June, by teams in Europe1 and China2. They show that nuclear clocks
    have gone from a system with “potential” to “a functioning precision instrument”
    that can be used to search for new physics, says Gilad Perez, a theoretical physicist
    at the Weizmann Institute of Science in Rehovot, Israel. Creating a nuclear clock
    is “a dream come true”, says Thorsten Schumm, an atomic physicist at the Vienna
    University of Technology and a lead member of the European team. Until recently
    the field had been “a calm niche” to work in, he says. “Now we have a fierce but
    friendly global competition.” Tick tock All clocks require a stable oscillation
    — like that of a swinging pendulum — to keep time. In the best atomic clocks,
    this swing is the oscillation of the visible wavelength of light that is absorbed
    as electrons jump up between energy levels. Physicists determine the specific
    frequency of laser light required to trigger this shift in electron state, then
    use that frequency to keep time. A nuclear clock is different. Rather than causing
    electrons to jump between energy levels, it keeps time by boosting the protons
    and neutrons inside the nucleus of thorium-229 atoms to a higher energy state.
    Most elements require an enormous amount of energy to reorganize their nuclei,
    but thorium is unusual because it has stable energy levels that are so close together
    that just the nudge of ultraviolet laser light can prompt the shift. ‘Nuclear
    clock’ breakthrough paves the way for super-precise timekeeping Physicists had
    suspected thorium’s special properties for decades, but it wasn’t until 2024 that
    they finally succeeded in triggering the nuclear transition in a millimetre-sized
    crystal of calcium fluoride loaded with trillions of thorium-229 atoms. Later
    that year, another team pinpointed the precise frequency at which it happens.
    The only thing that was missing for a nuclear clock to work was a way to lock
    the frequency of the laser with the natural timekeeper and keep the clock’s tick
    speed from drifting over time. Both teams achieved this by monitoring how much
    the laser light was absorbed by the thorium-229 atoms. When the laser is in the
    right range, the signal’s strength dips as photons get absorbed, says Schumm.
    But if the frequency drifts, “you see the signal coming up again and can immediately
    correct for that”, he says. The groups differed in their exact methods: the group
    in China, led by Shiqian Ding, a physicist at Tsinghua University in Beijing,
    used a laser much more powerful than the European one, but a crystal with a lower
    concentration of thorium-229 atoms, so overall the signals produced by the two
    clocks were comparable.'
