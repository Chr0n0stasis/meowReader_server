  body_text: 'A growing chorus of voices has accused Morocco of helping to fuel the
    crisis in Ceuta, with the leader of the Spanish enclave describing last week’s
    border crossings as an attack on Spain’s territorial integrity that was seen as
    being “if not orchestrated, at least encouraged or permitted by Morocco”. Spanish
    officials ⁠said on Monday that an estimated 69,500 people who had arrived late
    last week in Ceuta, a tiny Spanish territory in north Africa, had returned to
    Morocco in recent days. About 2,500 people who had made the crossing were believed
    to still be in Ceuta. The extraordinary influx had overwhelmed the city of 84,000
    people and set off a political crisis across the EU as some member states laid
    blame on Spain. In Ceuta, leaders pointed to the broader picture of what had transpired.
    “It’s an atrocity,” said Juan Jesús Vivas, the long-serving conservative leader
    of the territory. “There are 88 bodies in the morgue, and there are more on the
    other side of the border.” He said local people watched the events play out with
    a mix of sadness, worry and anguish. “People see this not as a migration crisis;
    it was fundamentally an attack, a violation of Spain’s territorial integrity,”
    Vivas told El País newspaper. “People felt that this, if not orchestrated, was
    at least encouraged or permitted by Morocco.” He drew a parallel with May 2021,
    when Rabat loosened border controls, allowing 10,000 people to cross into Ceuta
    over the course of two days, during a diplomatic standoff over Madrid’s decision
    to allow a Western Sahara independence leader to be treated for Covid-19 in Spain.
    This time around, analysts have suggested that Spain’s recent rapprochement with
    Rabat’s arch-enemy Algeria could have triggered a response from Morocco. View
    image in fullscreen People who crossed from Morocco sit on a street in Ceuta on
    Monday. Photograph: Reduan/EPA Speaking on Monday, Spain’s defence minister, Margarita
    Robles, also seemingly signalled Rabat’s involvement. “Neither Spain nor Morocco
    can look the other way when it comes to this tragedy,” she told reporters. “I
    ask the Moroccan government to fully investigate what happened.” The insinuation
    appeared to be backed by the preliminary assessment of Spanish intelligence services,
    who cited suspicions that the influx had not been planned by Moroccan authorities
    but concluded that Morocco had failed to stem the tide of people rushing towards
    the border and in some cases had even facilitated their passage. Intelligence
    sources told El País that the roots of the influx probably lay in a hoax that
    had swiftly spread across social media after a Spanish supreme court ruling that
    migrants arriving by sea could not be summarily deported. As the hoax gained steam
    online, Moroccan border surveillance dwindled to a minimum until it was completely
    lifted late last week, allowing tens of thousands of people to stream through.
    In Ceuta on Monday, hundreds of people continued to sleep rough on the beach or
    near Ceuta’s mosques. One local official told reporters that those who remained
    in the city included 862 unaccompanied minors. Ashraf, 28, said he had defied
    his mother’s warnings against crossing into Spain after spotting posts on social
    media that said the border had been opened. While he had made it to Ceuta, what
    had followed was a days-long ordeal as he scrambled to find food and shelter while
    fending off the memories of what he had lived through. “You might see me smile
    a little but inside I’m shattered,” the Moroccan national said as he recalled
    swimming past bodies to reach Ceuta. “There were so many people in the sea. Everyone
    was trying to grab on to you to save themselves, and you were trying to escape
    and move forward so they wouldn’t drag you down or drown you. The Moroccan police
    were pushing us toward the water and telling us ‘swim, swim’.” Others were desperately
    seeking loved ones who were missing. One mother said she had been roaming the
    streets of Ceuta for days, frantically searching for any sign of her children,
    aged 13 and 16. She had left Morocco alone, finding out later that her two children
    had followed her by plunging into the sea to make their way around the border.
    “I need help,” she said as she held up a photo of a smiling young boy flashing
    a thumbs-up sign. “Some migrants told me they had seen them in Ceuta, but I can’t
    find them.” 10:29 How Ceuta migrant crisis exposes divisions within Europe - The
    Latest Across the EU, the crisis in Ceuta had seemingly ushered in a moment of
    reckoning after a handful of EU countries responded to the crisis by calling for
    Spain to be suspended from the Schengen free-movement zone. Italy said it had
    suspended passport-free Schengen travel arrangements with Spain for one month,
    despite the fact that Ceuta is not part of Schengen. Before an emergency video
    meeting of interior ministers on Tuesday to address the crisis, Spain’s foreign
    minister said the country would demand solidarity from EU members after several
    had, in his view, “fallen short” of what was expected. “There was a synchronised
    reactionary international effort that very quickly amplified what was happening,
    spreading lies and fake news about the integrity of the Schengen area and about
    Spain’s actions,” José Manuel Albares told the broadcaster TVE. “Unfortunately,
    these falsehoods have even been amplified by some European governments.” What
    had transpired in Ceuta was “very unusual”, he said. “Spain currently has the
    lowest number of irregular entries on the Mediterranean route,” he added, while
    Italy “was the country with the highest number of irregular entries in Europe”.
    He said he had been in contact with Moroccan authorities throughout the crisis.
    “They showed a willingness from the very beginning to mobilise police forces to
    help stem the flow of migrants.” View image in fullscreen People wait outside
    Ceuta’s temporary migrant centre, which is at full capacity. Photograph: Pedro
    Nunes/Reuters Ursula von der Leyen, the European Commission president, said in
    a letter to Spain’s prime minister, Pedro Sánchez, that the Tuesday meeting would
    be a chance to draw lessons from what happened in Ceuta, and she commended Madrid
    for its swift handling of the crisis. “From this incident, it is clear that we
    must do more to further strengthen our borders at critical points,” she said.
    At a meeting of member states on Saturday, the Guardian was told that while Italy
    and Denmark, with some support from Poland and Sweden, had criticised Spain for
    what had happened, there was a strong suspicion that the crisis was not an accident
    but had been coordinated. There was widespread recognition that Spain could not
    simply pin the blame on Morocco, given the close cooperation needed to return
    those who had crossed and, in the longer term, for migration control and security,
    a source said. EU states also spoke about the threat of Russian disinformation
    and how it could exploit the crisis to heighten tensions across the bloc, the
    source added. The concerns came into public view late last week when Ukraine’s
    acting foreign minister said more than 1,500 publications regarding Ceuta had
    been identified in pro-Russian networks. “We have detected an intensive Russian
    propaganda campaign across Europe using pictures from Ceuta to sow destabilisation,”
    Andrii Sybiha wrote on social media. “This is not about the situation itself but
    about the way Russia tries to exploit any topic that can benefit its agenda.”'
