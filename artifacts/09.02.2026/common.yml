  body_text: '| Next | Section menu | Main menu | Previous | Kate Knibbs The Big Story
    Sep 23, 2025 6:00 AM She Fought the Far Right Online for Years. Now She Wants
    to Do It in Congress Kat Abughazaleh, 26, made her name swatting down right-wing
    talking points on social media. Now she’s hoping internet fame can propel her
    to Congress. PHOTOGRAPHS: NOLIS ANDERSON Kat Abughazaleh knows how to create viral
    moments online. She’s an old pro, in fact, capable of posting clips of herself
    that can rack up millions of views. But engineering attention in the physical
    world is a decidedly different challenge—one that Abughazaleh was struggling to
    solve on an overcast afternoon in July. The Politics Issue For our politics issue,
    WIRED examines the state of tech’s influence on governmental power—and the people
    who will change everything in the future. The 26-year-old, who is running for
    Congress in Illinois, was sitting outside her campaign headquarters in Chicago,
    trying to connect with prospective voters during the area’s annual taco crawl.
    Some people were stopping to chat, but others hurried along in search of their
    next carnitas fix. On the internet, Abughazaleh can precision-edit a video to
    maximize eyeballs. On Clark Street, a busy thoroughfare that cuts across the city’s
    northeastern neighborhoods, she had to convince people cruising for excellent
    Mexican food that she was worth delaying their next bite. That day, at least,
    the solution was simple: hot sauce. Abughazaleh got a taste for the stuff growing
    up in Texas and never let go. She hauled out the collection of bottles she keeps
    in her office—many of them sent by a supporter—and lined up over a dozen on a
    table for pedestrians to douse their tacos. Within minutes, locals sloshing to-go
    margaritas in plastic cups stopped to pepper her with questions, like her stance
    on organized labor (pro), what her “main issue” is (“antiauthoritarianism”), and
    her thoughts on contemporary sci-fi and fantasy ( Red Rising is superior to A
    Song of Ice and Fire ). It seemed every other person had a friend who was a big
    fan. Supporters in cars honked periodically. With help from a volunteer who translated,
    Abughazaleh explained to a Spanish-speaking family that her office doubles as
    a mutual aid hub, stocked with free pantry items and open to “everyone except
    ICE.” They took campaign stickers. An older man with white whiskers and a “Make
    America Green Again” hat trotted over to the table after locking up his bike.
    Abughazaleh leaned forward, eager to engage on the issues. Before she got going,
    though, the man cut her off. “You have terrible posture,” he chided her, explaining
