    back into a more comfortable position. Seeing her deal with even the most condescending
    of constituents, you wouldn’t know that this is Abughazaleh’s first time running
    for office. She is at the forefront of a wave of left-leaning young people who
    are eager to change what electoral politics looks like in the United States. They
    are fueled by frustration with the Democratic Party establishment, many of whom
    have been in office longer than their challengers have been alive—and seem to
    crave outspoken candidates like Abughazaleh, who, last week, was thrown to the
