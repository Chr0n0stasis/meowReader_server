    says. As a child, though, her political perspective was quite different. Her maternal
    grandmother, Taffy Goldsmith, was a longtime Republican operative in Dallas, so
    affinity for the Grand Old Party was woven into the family fabric. One of Abughazaleh’s
    favorite books as a kid was Lynne Cheney’s A for Abigail , a gift from Goldsmith.
    In high school, Abughazaleh moved with her parents to Tucson, Arizona. She started
