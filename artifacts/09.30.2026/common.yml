- article_update_date: 04.07.2026
  body_text: America’s foes see opportunity in Asia’s oil shock Asia | Bear hug America’s
    foes see opportunity in Asia’s oil shock Russia and China are quietly stepping
    in April 1st 2026 “RUSSIA’S VOICE in the global economy and geopolitics sounds
    even louder” when the price of oil is above $100 a barrel, Kirill Dmitriev, the
    boss of a Russian state investment fund, crowed in March. Nowhere is this truer
    than in Asia, where the Iran war has sent countries scrambling to secure essential
    fuels and fertilisers. On March 27th the Philippines announced it had bought 2.48m
    barrels of Russian crude, the country’s first purchase of Russian oil since the
    invasion of Ukraine in 2022. In Mr Dmitriev’s telling, with Brent crude at around
    $100 a barrel, Russia is now “impossible to ignore”. More alarming than the price
    of oil is the uncertainty of its continued supply. Asia overwhelmingly relies
    on fuel and fertiliser imported from the Gulf, where Iranian threats to the Strait
    of Hormuz have forced ships to remain at anchor. America’s biggest rivals, China
    and Russia, are not letting the crisis go to waste. Almost a dozen countries across
    Asia, including Indonesia, Thailand and Vietnam, are lining up to buy Russian
    crude, while America’s stalwart partners, such as Japan and South Korea, are contemplating
    whether to follow suit. China is seeking deals of its own. The new wave of energy
    diplomacy raises the prospect that President Donald Trump’s decision to go to
    war with Iran may unintentionally reshape Asia’s regional politics. Russian diplomats
    across the region, from Pakistan to Sri Lanka, have been offering to help broker
    fuel sales to ease the supply pinch. Russia’s deputy prime minister said in March
    that the country was redirecting its natural-gas exports away from Europe, and
    would favour countries “planning to build long-term, constructive relationships
    with us”. Such efforts have been helped by America’s Treasury, which has paused
    sanctions on Russian crude already at sea to boost oil supply and to slow price
    rises. Asian buyers are looking to strike deals before the waiver ends on April
    11th. More American crude and LNG is being steered towards Asia to ease shortages,
    but it will not be enough to cover the shortfall. The Iran war “has opened new
    opportunities for Moscow,” says Aleksei Zakharov of Observer Research Foundation,
    a think-tank based in Delhi. Beyond oil, the energy shock is forcing a rethink
    of nuclear power in the region. Taiwan’s state energy company, for example, announced
    plans to restart a nuclear power plant on March 27th. Others are likely to follow.
    For years, Russia has been aggressively trying to sell its nuclear know-how to
    the region with only limited success. Last year it agreed to help Myanmar’s military
    junta construct a small modular reactor near Naypyidaw. More consequentially,
    Vietnam and Russia struck a long-expected nuclear deal last week during a visit
    to Moscow by Vietnam’s prime minister. China is also stepping in to ease the squeeze.
    In early March it shut off refined-oil exports to bolster its already large reserves,
    deepening regional anxieties. Yet Chinese officials now appear to be reversing
    course. On March 30th Mao Ning, a foreign-ministry spokesperson, said China was
    ready to help “safeguard global energy security”. It has released some 360,000
    barrels of fuel to Vietnam and the Philippines, according to Bloomberg. Alone,
    those shipments will not make a big difference, but they may signal a willingness
    to unlock stockpiles if the crisis worsens. Sensing an opening, China even offered
    to provide Taiwan with energy, if the island agreed to unify under Communist Party
    rule (Taiwan promptly refused). Many countries, however, would welcome the help.
    President Ferdinand Marcos junior of the Philippines, who is typically a big supporter
    of America and has rowed with China over border disputes in the South China Sea,
    is now courting Chinese co-operation. Mr Marcos told Bloomberg Television on March
    24th that the Philippines was resetting relations with China to a “new normal”
    in light of the geopolitical turmoil. The Philippines, he said, was open to restarting
    joint oil-and-gas exploration in the South China Sea. Diplomats from both countries
    met on March 27th for foreign-ministry consultations for the first time in three
    years. Mr Putin will be hoping to use the oil sales to shore up Russia’s ailing
    budget and further his long-term policy to “turn to the East”. The deals are also
    a telling marker of the West’s failure to isolate Russia. “Most countries in the
    region have already moved on from the Ukraine war,” says Ian Storey of ISEAS-Yusof
    Ishak Institute, a Singapore-based think-tank. To help make the point, Russian
    diplomats are said to be planning a summit with ASEAN leaders, possibly in Kazan
    in June. Ultimately, however, there are limits to what Mr Putin can offer, notes
    Mr Storey. Russia is cash-strapped and has virtually no role in the technology
    supply chains Asia cares most about. Its effort to cement itself as an energy
    provider in the region will be complicated by Ukrainian drone strikes on its oil
    terminals. China, however, offers both energy and investment. But what will it
    ask for in return? ■ This article was downloaded by zlibrary from https://www.economist.com//asia/2026/04/01/americas-foes-see-opportunity-in-asias-oil-shock
