  question_type: Reading Comprehension
  questions:
  - answer: B
    explanation: 文章提到该纪念活动已举办20年，目的是“exposing the Japanese Imperial Army's war crimes
      and encouraging people to understand and never forget the dark chapter of history”，这与选项B高度吻合。
    options:
      A: To celebrate the restoration of diplomatic ties between China and Japan.
      B: To expose war crimes and ensure that the history of the Nanjing Massacre
        is not forgotten.
      C: To pay tribute specifically to the victims of the sexual enslavement of women.
      D: To formally request financial compensation from the Japanese government.
    q_number: 1
    stem: According to the passage, why has the memorial service been held annually
      for the past 20 years?
  - answer: B
    explanation: “part and parcel”意为“不可分割的一部分”，暗示慰安妇受害者的遭遇与南京大屠杀在历史和系统上是紧密关联的，故选B。
    options:
      A: It is a minor detail compared to the large-scale murder in Nanjing.
      B: The two events are historically and systematically interconnected.
      C: The international community considers these events to be separate historical
        issues.
      D: There is insufficient evidence to link the two groups of victims.
    q_number: 2
    stem: What does Judith Mirkinson imply by stating that the fate of 'comfort women'
      is 'part and parcel' of the Nanjing Massacre?
  - answer: C
    explanation: Zha Liyou明确指出，“does not mean to pass on the enmity but rather to
      remind people not to forget the history and inspire them to love peace”，说明目的是为了和平，故选C。
    options:
      A: To sustain long-standing enmity between the Chinese and Japanese people.
      B: To ensure that the 21st century repeats the history of the 20th century.
      C: To preserve the memory of victims and inspire a commitment to peace.
      D: To seek revenge against the descendants of the Japanese Imperial Army.
    q_number: 3
    stem: According to Zha Liyou, what is the ultimate goal of remembering the atrocities
      of World War II?
  - answer: B
    explanation: 文中明确写到：“Reconciliation does not come without truth. So the Japanese
      government must acknowledge their crimes”，故答案为B。
    options:
      A: The passage of time will naturally heal the wounds of war.
      B: The Japanese government must actively acknowledge their historical crimes.
      C: The international community should ignore the crimes to maintain current
        stability.
      D: The victims must personally forgive the perpetrators without official acknowledgment.
    q_number: 4
    stem: What is the primary condition for 'reconciliation' as suggested by Judith
      Mirkinson?
  - answer: C
    explanation: 文末提到UNESCO Memory of the World Register是一个“aimed at preserving documented
      heritage of universal value”的汇编，意在说明该事件具有普世价值，故选C。
    options:
      A: It officially grants the Chinese government the right to demand reparations.
      B: It marks the end of all diplomatic disputes regarding the war.
      C: It recognizes the massacre as documented heritage of universal value.
      D: It forces the Japanese military to apologize to the survivors.
    q_number: 5
    stem: What is the significance of the Nanjing Massacre being entered into the
      UNESCO Memory of the World Register in 2015?
  source_journal: China Daily
  title: Nanjing massacre remembered on 80th anniversary
