  body_text: 'Researchers caught an African leopard on camera eating bats from a cave
    in Uganda. It might be the first confirmation that leopards eat live bats.Credit:
    Bosco Atukwatse/VSPT Kyambura Lion Project When researchers in Uganda set up camera
    traps to monitor African leopards (Panthera pardus pardus) and spotted hyenas
    (Crocuta crocuta) in a national park last year, they had no idea that they would
    record so much more than just those animals. Several of the traps, placed outside
    a cave known to host Egyptian fruit bats (Rousettus aegyptiacus), caught on video
    a multitude of creatures feasting on the winged mammals. The bats are known carriers
    of Marburg virus, which can transfer into humans and cause a fatal haemorrhagic
    fever, so the footage offers real-time insight into how disease can spread. Scientists
    know that bats can transmit viruses to humans either directly, or through an intermediate
    animal, from forensic detective work and other studies. The team in Uganda thinks
    this is the first time that potential intermediate animals have been caught on
    camera in a known hotspot for Marburg virus, which is in the same family as Ebola
    virus. “It is certainly the first in such a well-documented form,” says Gábor
    Kemenesi, a field virologist at the University of Pécs in Hungary, who was not
    involved in the study. This compilation video shows a sampling of the animals
    that researchers caught on camera at Python Cave eating and scavenging on bats.
    Credit: Bosco Atukwatse/VSPT Kyambura Lion Project The researchers, who published
    their findings today in the journal Current Biology1 after posting them in a Zenodo
    preprint 10 months ago2, reported videoing 10 species scavenging on or catching
    bats at Python Cave in Uganda’s Queen Elizabeth National Park. They saw blue monkeys
    (Cercopithecus mitis) dipping into the cavern to grab bats, a fight between a
    crowned eagle (Stephanoaetus coronatus) and a Nile monitor (Varanus niloticus)
    over two bats captured by the eagle, and a leopard standing almost upright to
    snag bats from the cave. This might be the first confirmation that leopards hunt
    live bats. “It’s never been seen,” says study author Alexander Braczkowski, who
    is the scientific director of the Kyambura Lion Project in Kampala. “Sometimes
    he would eat 30, 40 bats in a night.” Dangerous visits Even more astounding is
    that the team caught on video more than 200 people — tourists, trainees from a
    local wildlife institute and children with school groups — approaching the cave
    during the four-month period when the cameras were active. Only one visitor, a
    tourist, wore a mask. This is despite warnings posted around the cave about Marburg
    virus, which has no proven treatment or vaccine. “I was pretty shocked,” says
    Elke Mühlberger, a virologist at Boston University in Massachusetts. Contact with
    caves is the largest known contributor to humans contracting Marburg virus. According
    to an unpublished analysis shared with Nature by Adam Hume, a virologist at Boston
    University, 43% of the 21 outbreaks of Marburg confirmed since 1967 have been
    associated with visits to a cave. For 29% of the outbreaks, cave contact has been
    ruled out; the remainder have unknown origins. Members of the Kyambura Lion Project
    check their camera traps at Python Cave: from left are Yahaya Ssemakula, Bosco
    Atukwatse, Johnson Muhereza and Winfred Nsabimana.Credit: Aleksander Braczkowski
    Bats in Python Cave have, in fact, been linked directly to outbreaks of Marburg.
    An outbreak in 2007 at Kitaka mine, 50 kilometres from the cave, was traced to
    bats that fly to the cave. And two tourists who visited Python Cave in 2007 and
    2008 became infected. One of them died. There are conflicting accounts of whether
    both the tourists went into the cave or merely peered into it; the surviving tourist
    tells Nature that they went about 3 metres into the cave and “peered in for at
    least 30 minutes”. Jonathan Towner, a viral ecologist at the US Centers for Disease
    Control and Prevention (CDC) in Atlanta, Georgia, who has visited and sampled
    the site extensively, says that they probably came into contact with bat faeces
    or urine as the animals flew. Warning signs'
