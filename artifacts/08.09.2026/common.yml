- article_update_date: 05.19.2026
  body_text: '| Next | Section menu | Main menu | Previous | History Is Running Backwards
    Why reactionaries are taking over the world by David Brooks This article was featured
    in the One Story to Read Today newsletter. Sign up for it here. Maybe you’ve seen
    photos of Tehran in the 1970s, just before the Islamic Revolution: images of young
    women going to work in miniskirts, of couples making out in parks while wearing
    bell-bottoms, of people at pools in bikinis. It looks like Paris or Milan or Los
    Angeles. But in 1979 the revolution happened, and now Tehran looks like something
    from an earlier century. Sometimes I think that our whole world has become kind
    of like that—going backwards in time. The religious movements thriving in today’s
    secularized age are the traditionalist ones that dissent from large parts of contemporary
    culture—not only the Shiite Islam of post-revolution Iran, but Orthodox Judaism
    and conservative Catholicism. Young Americans are flooding into Eastern Orthodox
    churches . Many of us thought that the world would get more democratic as it modernized,
    but for the past quarter century, we have seen a reversion to authoritarian strongmen.
    Donald Trump, acting like some 16th-century European prince, has made the presidency
    his own personal fiefdom. Vladimir Putin borrows ideas from reactionary thinkers
    such as Aleksandr Dugin—an Eastern Orthodox, anti-liberal philosopher who rejects
    the Enlightenment—to justify his imperial conquest of Ukraine. If you go on social
    media, you can see photos of tradwives baking cookies for their husband and five
    kids. The secretary of health and human services and his followers don’t trust
    those newfangled inventions, vaccines. In 1999, it seemed that world affairs would
    be dominated by multilateral groups such as the European Union and the World Trade
    Organization—but now we are back to 19th-century-style great-power rivalries between
    China and the United States, between Russia and Europe. Trump’s new National Security
    Strategy has even revived the Monroe Doctrine. We used to have a clear idea of
    where modernity was heading—toward greater autonomy and equality, secularism,
    stronger individual rights, cultural openness, and liberal democracy. Progress
    was supposed to lead to the expansion of individual choice in sphere after sphere.
    Science and reason would prosper while superstition and conspiracy-mongering would
    wither away. Turns out that was yesterday’s vision of the future. Billions of
    people around the world looked at where history was heading and yelled: Stop!
    They see that future as too spiritually empty, too lonely, too technological,
    too polluted, too confusing, too incoherent. Whatever their specific complaint,
    they are driven by a sense of loss, a desire to go back to a simpler, happier,
    and more sustainable time. Part of the brilliance of the phrase Make America Great
    Again is that it taps into that sense of nostalgia and loss. Periods of great
    disruption inevitably produce yearning for an earlier golden age, and ours is
    no different. You can tell what kind of reactionary a person is by asking them
    what era they want to go back to. For some MAGA dudes, it’s the Roman empire,
    when men were men. For some theocrats, it’s the Middle Ages, when men were monks.
    In the U.S., many on the right want to go back to the social mores of the 1950s:
    men in the workplace, women at home; white people on top; epic levels of church
    attendance; and wholesome fare such as Oklahoma! and Leave It to Beaver onstage
    and on television. Meanwhile, many on the left want to go back to that decade’s
    union- and manufacturing-led economy, or to the utopian socialism of the 19th
    century. Our politics is drenched in nostalgia. Those of us who believe in progress
    and the values of the Enlightenment tend to be condescending toward these reactionary
    impulses. We assume that the reactionaries are unsophisticated, intransigent,
    parochial—afraid of the freedom that modernity brings. It’s futile to think you
    can turn back the clock, we say. But civilizations turn back the clock all the
    time. The Italian Renaissance can be seen as a concerted artistic and intellectual
    effort to return to classical Greek and Roman times. In Lost Enlightenment , the
    historian S. Frederick Starr recounts how, during the Middle Ages, Central Asia
    went from being the most scientifically and economically advanced region of the
    globe to falling behind Europe. During the Ming dynasty, China stopped exploration
    and de-emphasized scientific progress. The 18th-century French Enlightenment cult
    of reason produced the 19th-century Romantic cult of passion as a counterreaction.
    The 19th-century explosion of industrialization produced the neo-Gothic reaction,
    led by people such as John Ruskin, who celebrated pre-machine living. For much
    of the 20th century, faith in progress was the guiding ideology of modernity.
    Think of all those world’s fairs and theme parks, the giddiness about the wonders
    of Tomorrowland. That faith in progress was not only a technological one—flying
    cars!—but a spiritual and moral one. Many, including me, derived meaning from
    the belief that we were contributing to social progress. Today, however, billions
    of people have lost that faith in progress as a source of meaning and are flocking
    to its opposite. In the 21st century, traditionalism has emerged as a catalytic
    school of thought. Reactionaries are propelling events, shifting culture and history
    in their direction. If we want to understand where all of this is taking us, we
    need to understand what’s driving them and where they get their beliefs. And to
    contend successfully with the traditionalists’ effects on our politics and culture,
    we also need to recognize that elements of their worldview are correct. But which
    parts are correct, and which are completely off the rails? From the January/February
    2023 issue: Derek Thompson on why the age of American progress ended If you go
    spelunking into the mind of a traditionalist of a more intellectual sort, you
    will usually find Oswald Spengler somewhere deep inside. The first volume of Spengler’s
    The Decline of the West was published in 1918, just as the First World War was
    winding down. He argued that each culture has its own unique soul, comprising
    its habits, customs, and myths. Like any living organism, each culture grows,
    matures, ages, and dies. In their youthful phases, they display great creativity,
    a flowering of the arts, an effusion of strong personalities. As they transition
    to maturity and eventually senescence, they urbanize and bureaucratize, elites
    lose moral authority, and creativity withers. Spengler argued that Western culture
    emerged around the end of the tenth century. He called it “Faustian.” It was individualistic,
    expansionary, acquisitive, insatiable in its striving. Once a culture slips into
    its decline phase, it becomes imperialistic and materialistic, and technologists
    drive what happens. The political system slides into what Spengler called “Caesarism”—rule
    by despots. Urbanization and industrial growth create masses of atomized people
    susceptible to demagoguery. Financial power is concentrated in impersonal institutions,
    weakening the old elites. Large-scale bureaucracy leads to a centralization of
    power. When crises hit, people want decisive authority. If you believe that our
    society is in decline, Spengler’s sweeping theories describe and explain what
    is happening today. If Spengler was part of the cultural-determinist wing of the
    interwar reactionary movement, René Guénon was part of the mystical wing. Both
    men believed the West was in decline, but for different reasons. While the historian
    Mark Sedgwick was researching his superb book Traditionalism, Dugin told him that
    what Karl Marx is to communism, Guénon is to traditionalism. Guénon was born in
    central France in 1886. Throughout his life, he studied various forms of spiritual
    knowledge—gnosticism, Islam, Taoism, Hinduism. He was not a political writer but
    a metaphysical one who believed that different religions are living links to the
    same underlying cosmic truth. He also believed that Western civilization had turned
    away from this spiritual truth and was living through what Hindu thinkers call
    the Kali Yuga, the age of corruption and moral decline. Reading traditionalist
    writers, you find that each comes up with a different term for the spiritual deadness
    they associate with modern civilization. Spengler used the word Kulturverfall
    . For Guénon, that word was quantity . In his 1945 book, The Reign of Quantity
    and the Signs of the Times , he argued that in this phase of “progressive ‘materialization,’
    ” only things that can be counted are considered real. In the modern age, Guénon
    continued, science dominates. Modern scientists think they are taking a cold,
    objective look at reality, but they are pitifully naive, stuck at the level of
    what scientific materialism and measurement will allow. A modern scientist, in
    the Guénon view, is oblivious to spiritual reality—which, to the traditionalist,
    is the primary reality—and so adopts a worldview that denies the existence of
    the metaphysical realm. The modern scientist is like someone who investigates
    the workings of an orchestra without the ability to hear music or even the awareness
    that music exists. All he can describe is bows scraping against strings and air
    flowing through wind instruments. His theories make a hash of what he is observing,
    leaving his readers in a flat, soulless realm of disjointed facts. From the February
    2025 issue: Anne Applebaum on RFK Jr. and the end of Enlightenment rationality
    The modern person senses a vacuum where his spiritual life should be. He covers
    the hole in his soul with ceaseless agitation, unending change, and ever-increasing
    speed. “The dominant impression today,” Guénon wrote more than 80 years ago, is
    “an impression of instability extending to all domains.” His commitment to traditionalist
    spirituality brought him eventually to Sufism, a mystical strain of Islam. He
    converted, moved to Cairo, married an Egyptian woman, and died there in 1951.
    Guénon had a profound influence on Julius Evola, an Italian writer who had a brief
    moment of celebrity in the American press in 2017 , after the media revealed that
    the Trump adviser Steve Bannon had referenced Evola during a conference at the
    Vatican. The white nationalist Richard Spencer called Evola “one of the most fascinating
    men of the 20th century.” Evola was born in Rome, fought as an artillery officer
    in World War I, and then became an artist in the Dada movement. He agreed with
    Guénon that we are living in an age of corruption that has turned its back on
    spiritual truth. In 1934, he published a manifesto called Revolt Against the Modern
    World . Evola broke with Guénon, however, by embracing politics after World War
    II and becoming the chief ideologue of the Italian far right. His views were anti-egalitarian,
    anti-liberal, antidemocratic. He was pro-monarchy and pro-hierarchy, and supported
    a racial caste system. He was post-liberal before being post-liberal was cool.
    Benito Mussolini was a big fan, but Evola criticized fascism for accepting too
    much of the modern world. What is necessary, Evola argued, is a “race of masters,”
    who will lead a “revolt from the depths.” Any attempt to make a better world with
    spiritually stunted people will fail—because spiritually stunted people chase
    shallow, hedonistic values, and a noble society can be built only by those whose
    lives are oriented toward spiritual excellence. Evola was political where Guénon
    was not, bluntly racist where Guénon was not. Gábor Vona, a prominent hard-right
    politician in Hungary, called Evola “one of the greatest thinkers of the twentieth
    century” in the foreword to a 2012 selection of Evola’s writing titled A Handbook
    for Right-Wing Youth . Today many of us look at Europe’s far-right parties and
    see pseudo–storm troopers. But those parties see themselves as a spiritual vanguard
    trying to preserve the highest registers of the soul. Understanding contemporary
    traditionalism requires understanding its intellectual underpinnings in the thinking
    of these forefathers. All traditionalists tell a story about a time when people
    were rooted in stable homes and a way of life that got destroyed by a historic
    rupture that ushered in the soulless modern era—whether they call that era Faustian
    Civilization (Spengler), the Age of Quantity (Guénon), the Kali Yuga (Guénon and
    Evola), or something else. Today’s traditionalists do not agree on when history
    took a wrong turn. But they all tell some sort'
