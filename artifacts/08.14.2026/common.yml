  body_text: 'Beware the typo—and other lessons of literary history Culture | Foul
    copy Beware the typo—and other lessons of literary history A new book looks at
    when the written word goes wrong May 21st 2026 WHAT A DIFFERENCE a word makes.
    In 1631 printers omitted three letters from the seventh commandment. The bungled
    injunction—“Thou shalt commit adultery”—cost them their licence and a £300 fine
    (worth around £54,000, or $72,000 today). The “Wicked Bible” is a warning of the
    perils of misprints. A new book offers an entertaining look at “all the ways words
    can go wrong”. Rebecca Lee, who works at Penguin Random House, explores publishers’
    “glitches and gremlins”, as well as censorship, plagiarism , hoaxes, failures
    and feuds. She chronicles how the written word can be “divisive, damaging, disruptive
    and unwelcome”. Take Winston Churchill’s history of the second world war, which
    called France’s army “the poop of the French nation” (he had written “prop”).
    Editors—or “correctors”, as their 17th-century counterparts were called—emerge
    as crucial props against blunders. Ms Lee also offers many examples of atrocious
    writing. “Bad” style can ascend to a kind of genius. Amanda McKittrick Ros was
    an Irish writer of prolix, overblown 19th-century novels. Her euphemisms alone
    astonish: trousers become “the southern necessity”. Hearing about the Nobel prize,
    she asked her publisher: “Do you think I should make a ‘dart’ for it?” At times,
    this inky history feels rushed. Chapters scoot through censorship’s most famous
    instances and skip across rejections and vicious reviews. But Ms Lee’s judgments
    are sound: “Freedom to read”, she observes, “remains a right constantly under
    siege .” Inevitably, the book closes with AI as literary threat and promise. The
    technology offers a “flood of free or cheap content” and plunders past creativity
    to deliver “rear-view mirrors of storytelling”. Error-strewn, vice-prone, human-authored
    books have already weathered almost six centuries of debacles. But this next chapter
    could be the most dramatic yet. ■ For more on the latest books, films, TV shows,
    albums and controversies, sign up to Plot Twist , our weekly subscriber-only newsletter
    This article was downloaded by zlibrary from https://www.economist.com//culture/2026/05/21/beware-the-typo-and-other-lessons-of-literary-history'
