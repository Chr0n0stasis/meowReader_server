- article_update_date: 06.13.2026
  body_text: '| Next | Section menu | Main menu | Previous | Afra Wang The Big Story
    Jan 20, 2026 6:00 AM You’ve Never Heard of China’s Greatest Sci-Fi Novel Millions
    of words. Thousands of authors. The Morning Star of Lingao is barely known outside
    China—but it contains the secret to the country’s modernization and malaise. Photograph:
    Wu MeiChi Ma Qianzhu was unsatisfied with Chinese progress. An engineer at a large
    state-owned enterprise, he belonged to a generation that grew up believing engineering
    is destiny, that China’s future would be built, bolt by bolt, by people like him.
    Then Ma discovered something extraordinary: a wormhole to the late Ming Dynasty.
    With more than 500 peers, he commandeered a ship and traveled back in time 400
    years, to a preindustrial China wracked by foreign invasion and internal decay.
    Their mission: trigger an industrial revolution in the past that would, in the
    future, make modern China great (again). The China Issue PHOTOGRAPH: ANDRIA LO
    Here are 23 ways China is rewiring the future . This, strictly speaking, did not
    happen. It’s the plot of The Morning Star of Lingao (临高启明), a sprawling, collectively
    written science-fiction web novel that has consumed a corner of the Chinese internet
    for nearly two decades. It now totals millions of words. It has never been translated
    into English. Almost no one in the West knows it exists. But I would argue—somewhat
    less strictly speaking—that the events of the book did happen. That the time travel
    worked. And that the secret to understanding modern China is all right there,
    contained within its prophetic, often frightening pages. In 2006, a post went
    up on SC BBS, China’s earliest military-themed message board: What would you do
    if you could travel back to the Ming Dynasty with modern knowledge? The question
    struck a nerve. The Ming Dynasty occupies a painful place in Chinese historical
    consciousness. It was a period when Chinese civilization entered a long decline,
    ending in the so-called Great Divergence. Europe embraced discovery, ascent, and
    construction; China sealed itself off. Joseph Needham’s famous question —“Why
    did modern science develop in Europe but not in China?”—has haunted modern Chinese
    intellectual life ever since. The Morning Star of Lingao emerged as a kind of
    internet-fueled continuation of this historic discourse. As more people found
    the original post, forum discussions crystallized into serious, collective story-writing.
    If you could travel back to the Ming Dynasty with modern knowledge, these users
    decided, well, you’d obviously industrialize before Europe and win modernity.
    Not everyone quite saw it that way. This was also the moment when China’s internet
    began producing its first generation of liberal-minded intellectuals, who debated
    everything in a relatively free online space—air pollution, labor rights, the
    brutal relocations preceding Beijing’s 2008 Olympic spectacle. I was a teenager
    coming of age in this internet. I bore witness to the Arab Spring and its Chinese-inspired
    “Jasmine Revolution.” I devoured Charter 08, a manifesto for political reform
    and human rights. In 2011, while I was in high school, the renowned blogger Han
    Han released his pro-democracy trilogy —“On Revolution,” “On Democracy,” “On Freedom.”
    The Lingao writers had little interest in these values. If the novel didn’t exactly
    inspire China’s effort to industrialize, it certainly reflected and reinforced
    it, serving as a kind of sacred text. In 2011, a nationalist economist named Wang
    Xiaodong coined the term “Industrial Party”—not a literal party (there’s effectively
    only one in China) but a way to refer to a circle of internet thinkers and influencers
    writing essays and cheering on plans the state had initiated. As the scholar Li
    Qiang has observed , the Industrial Party emphasized a pragmatic attitude of “shelving
    disputes and focusing on development.” The force they celebrated, ostensibly derived
    from industrial civilization, was actually development itself—progress as ideology,
    building as salvation. Revolution, democracy, freedom: These were distractions,
    even obstacles. What mattered was building. What mattered was speed. And perhaps
    no figure better embodied the Industrial Party’s evolution from internet subculture
    to influential public voice than the man who inspired the character of Ma Qianzhu—Ma
    Qianzu. That’s right: the fictional engineer in Lingao is based on a real-life
    engineer of the same name. (Or nearly: Their names differ by two Chinese characters.)
    The writing process for the book was extremely decentralized, so attribution is
    often messy, but there’s a consensus that the real-life Ma was one of the book’s
    writers. Ma—whose real name is actually Ren Chonghao, but he goes by his pen name—trained
    as a civil engineer and worked at the Suzhou Planning & Design Research Institute.
    He poured his own dreams and convictions into his fictional counterpart. Ma’s
    moment arrived in 2011. On July 23, two high-speed trains collided near Wenzhou,
    killing 40 people. The accident traumatized the nation for what it seemed to reveal
    about the costs of China’s breakneck pace of development. A prominent essay captured
    the mood, its title becoming a rallying cry: “China, Slow Down, Wait for Your
    People.” The prose read almost like prayer: “China, please stop your flying pace,
    wait for your people, wait for your soul, wait for your morality, wait for your
    conscience!” Ma and other Industrial Party voices responded with a counteroffensive.
    The solution wasn’t to slow down but to double down, they said—to learn from mistakes,
    to push through the difficult phase when new technologies were still being mastered.
    And key to their campaign was Lingao itself. The writing of it became a phenomenon
    across Chinese internet forums in the 2010s: Its open source ethos and collaborative
    methods deeply appealed to China’s burgeoning tech community. Beyond regular meetups
    among core contributors, Lingao ’s creation fostered the formation of China’s
    “keyboard politics”—online communities where users engage in fierce debates about
    governance, policy, and national direction under the protection of pseudonyms.
    These conversations became staging grounds for political arguments that couldn’t
    happen elsewhere, where amateur policy wonks, military enthusiasts, and armchair
    strategists honed their worldviews. In 2012, the nationalist commentary website
    Guancha (think of it as China’s Breitbart) was founded, and its complex entanglement
    with Industrial Party thought and personnel networks demonstrated how far Lingao
    ’s influence extended beyond mere time-travel fiction. Industrial Party ideology
    ends up being quite Darwinian. What matters most is the power that flows from
    industrial capacity. This contributes to what scholars refer to as the party’s
    “aesthetic.” Fred Gao , a Beijing-based journalist who identifies with the Industrial
    Party and who briefly worked for Guancha, told me: “These people view industrialization
    as the highest form of beauty. Building things from nothing—that’s their romanticism.”
    Of course, the techno-nationalist impulse transcends borders. “Elon Musk is the
    ultimate Industrial Party figure,” Gao said. Musk’s vision of colonizing Mars,
    his impatience with regulation, his worship of engineering solutions, his conviction
    that making physical things matters more than anything else—his “aesthetic has
    strong resonances with the Chinese Industrial Party,” Gao said. What differs is
    simply the political system that channels it. Almost nobody, including me, can
    finish all the chapters of Lingao (to say nothing of the more than 1,400 derivative
    works ). It’s not just that it’s too long. Reading it is quite painful. The novel’s
    language and narrative structure are aggressively anti-literary. To write beautifully
    would be bourgeois , the Industrial Party seemed to believe. Technical descriptions
    veer into what feels like self-indulgence, an uncomfortable disregard for readers
    without STEM backgrounds. The book asks questions like: How do you solve energy
    problems when you can’t drill for oil? How do you begin mechanization without
    the machine tools to make machine tools? How do you produce nitric acid when you’re
    starting from literally dirt? From Chapter 22, as the 500 time travelers plan
    their expedition to colonize Lingao County in Hainan (the southern island in China):
    “Besides complete equipment sets, we need backup chemical engineering equipment:
    synthesis towers, absorption towers, decarburization towers, distillation columns,
    saturated hot water towers, various reaction kettles, pressure-resistant piping,
    acid pumps, heaters ... I estimate we need 500–600 tons of materials.” “Can’t
    we produce these ourselves? Our mechanical industry is fairly complete.” “Material
    problems,” Ji Situi said. “Unless we can quickly produce stainless steel and polyethylene,
    domestic production of chemical equipment will be difficult within 10 years.”
    It reminds me of Daniel Defoe’s Robinson Crusoe , published in 1719. In the story,
    Crusoe reconstructs the distant island’s physicality from first principles. He
    builds tools, domesticates animals, plants crops, constructs shelter, makes pottery,
    bakes bread, sews clothes. The novel works like an instruction manual because,
    just like Lingao , that is the point. Robinson Crusoe is among the first works
    of fiction to treat industriousness itself as heroic. Yet Lingao gets at something
    more specific than Defoe’s Enlightenment universalism: It reflects the moral worldview
    of China during its 21st-century industrial acceleration and nationalism. Consider
    this passage—the scene when the crew has just time-traveled after 47 chapters
    of preparation: Behind them, a crimson sun erupts from the horizon, painting the
    sky red. The South China Sea’s surface glitters with golden light as the dawn
    of a new world illuminates the time travelers for the first time. On deck, they
    rise involuntarily, overwhelmed by emotion: I am witnessing history. I am creating
    history. Intoxicated by this feeling, someone begins singing “Ode to the Motherland”:
    The five-starred red flag flutters in the wind, Victory songs ring so clear, Wesing
    of our beloved motherland, From today walking toward prosperity and strength …
    First one voice, then many, then all. The soaring song pierces the clouds, resounding
    across the new world. This is the emotional core of Lingao —and of the Industrial
    Party worldview. The novel never separates technological progress from nationalist
    revival. Building blast furnaces is patriotism. Engineering is loving your country.
    The characters in the novel are intoxicated by their mission, and the readers
    are intoxicated by the fantasy. And perhaps most importantly, the writers are
    intoxicated by the act of collective world-building itself—the collaborative construction
    of an alternate Chinese modernity. Between 2000 and the mid-2020s, China’s manufacturing
    output exploded nearly eightfold. The country became “the world’s factory” not
    gradually but suddenly, and a feedback loop emerged: The Industrial Party worldview
    and China’s actual industrialization reinforced each other. Meanwhile, Lingao
    provided a narrative framework that made China’s development inevitable and righteous.
    For educated urbanites, especially those with technical backgrounds, it felt like
    inhabiting science fiction. The Lingao contributors and readers—typically 20-
    to 40-year-old males in cities, many with STEM careers—were both witnesses to
    and agents of this transformation. They worked in the factories, the construction
    firms, the engineering offices. They experienced firsthand what concentrated state
    resources and marshaled technical expertise could achieve. As Dan Wang argues
    in his book Breakneck , China has become the quintessential “engineering state.”
    When Xi Jinping stacks his government with aerospace and defense executives, when
    he demands manufacturing remain at 28 percent of GDP, when he boasts that China
    produces something in all UN industrial categories—he’s speaking the Industrial
    Party gospel. “Productive forces are what fundamentally drive the development
    of human society,” he said in a May 2024 speech , “and are the final cause of
    all social and political changes.” Everything else—democracy, rights, culture—is
    derivative, subordinate, ultimately irrelevant compared to the question of whether
    you can manufacture advanced semiconductors or build hypersonic missiles. But
    that first generation of liberal-minded intellectuals—the ones I grew up idolizing—hasn’t
    given up. In fact, in recent years, cracks have appeared in the Industrial Party’s
    armor. “Look at Ma Qianzu now,” says Fred Gao. “These past two years, he still
    talks about industrial systems, but increasingly he’s discussing socialized childcare,
    how local governments should spend money, local debt problems, reflections on
    unlimited borrowing. The pure Industrial Party worldview—that building solves
    everything—can’t address the structural problems China faces now.” It’s not just
    Ma. One of the original Lingao authors, writing under the pen name “The Boaster,”
    has largely withdrawn from public discourse. Those close to the project say he’s
    focused on his day job, occasionally updating the novel but no longer engaging
