  body_text: The rise of vibe lawyering Business | Trial and error The rise of vibe
    lawyering AI is emboldening people to represent themselves in court. The results
    are mixed July 2nd 2026 WHEN BRITAIN’S tax authorities accused Omar Rafique of
    deliberately underpaying his restaurant’s taxes, he challenged them in court.
    Alas for Mr Rafique, not only did he fail to submit the correct documents, but
    his filings were full of fake case law generated by an AI chatbot . Though the
    judge noted sympathetically that AI “might create a more level playing field”
    for litigants representing themselves, she threw the case out on May 6th. Mr Rafique
    is far from alone in turning to AI rather than to costly lawyers—a trend professionals
    call “vibe lawyering”. In England and Wales the share of civil cases in county
    courts with lawyers on both sides fell from 51% in 2022, the year ChatGPT was
    launched, to 42% last year. In American federal civil courts 17% of people represented
    themselves in 2025, up from a steady 11% for many years before, according to research
    by Anand Shah of MIT and Joshua Levy of the University of Southern California.
    They also find that this year 18% of complaints have probably contained AI-generated
    text. Courtready, a legal-tech platform, reports that Canadian courts have flagged
    non-existent cases in 79 rulings so far this year, against seven in all of 2024.
    Most false citations have been made by people representing themselves. As well
    as inventing cases, AI chatbots often encourage people to litigate, urge them
    not to settle and overstate their chances of winning. Antony Sendall, a British
    employment barrister, says chatbots embolden litigants to bring discrimination
    claims. “A grievance that would have been a few sentences is now more like ten
    to 12 pages,” he complains. Messrs Shah and Levy found that in cases with self-representing
    litigants in America, the number of documents filed in the first 180 days is 158%
    higher than in the pre-AI era. Robert Freund, a commercial lawyer in Los Angeles,
    says his clients receive correspondence and documents written by AI from opposing
    parties acting without lawyers. And relying on AI can prove expensive. On June
    2nd a student was ordered to pay the University of Ottawa C$10,000 ($7,000), partly
    for using AI improperly to prepare her legal challenge against her removal from
    a PhD programme. Even lawyers have been caught out. In April Sullivan & Cromwell,
    a top New York firm, apologised to a court for errors caused by AI hallucinations.
    On June 8th lawyers on both sides of a contractual dispute in Mississippi were
    fined for citing fabricated cases. Some believe that AI labs should bear responsibility
    for their models’ inventions. In March Nippon Life, an insurer, sued OpenAI in
    a federal court in Chicago, alleging that ChatGPT had enabled an ex-employee to
    make what it says is a meritless discrimination claim. Nippon is seeking $10m
    in punitive damages; OpenAI insists that ChatGPT is “not a lawyer”. Used with
    caution, AI can be beneficial. In London on May 14th Tamires Camal Taquidir, a
    human-resources consultant, recovered £7,000 ($9,300) in fees from a hospitality
    firm after engaging Garfield AI, which calls itself the world’s first AI-powered
    law firm approved by regulators. Garfield’s platform did the documentary heavy
    lifting. But Dominic Li, a barrister, argued the case in court. For now, human
    lawyers still have their place. ■ To track the trends shaping commerce, industry
    and technology, sign up to “ The Bottom Line ”, our weekly subscriber-only newsletter
    on global business. This article was downloaded by zlibrary from https://www.economist.com//business/2026/06/29/the-rise-of-vibe-lawyering
