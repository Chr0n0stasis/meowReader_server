  body_text: 'Cape Town’s city council has said it will “imminently” round up two
    baboon troops coming into repeated conflict with residents. The animals will be
    sterilised and permanently moved to a newly constructed sanctuary. The plan has
    been fiercely criticised by animal rights activists, who say the monkeys should
    remain roaming freely, and that less destructive options have not been properly
    considered. Cape Town’s baboon problem has been brewing since the 2000s, after
    the city stopped culling troops in the late 1990s after pressure from the public.
    But in the past two years it has reached boiling point. A 2025 census found that
    the population had grown by a third since 2000, from 360 baboons to 493, now living
    in 12 managed troops. As a result of the population boom, troops of chacma baboons
    on the city’s peninsula regularly rip off roof sheeting, sneak into unlocked cars
    and raid food pantries. Some monkeys are now staying up late into the night to
    break into homes in Simon’s Town and nab snacks from convenience stores. Residents
    can no longer barbecue or host garden parties for fear of the marauding baboons.
    View image in fullscreen A community volunteer reminds drivers to slow down to
    protect baboons in Cape Town, May 2022. Photograph: Xinhua/Shutterstock “It’s
    depreciated property values because it’s hard to sell a house when it’s covered
    in baboon faeces and paw prints, and you know they’re coming every day,” said
    Justin O’Riain, a behavioural ecologist at the University of Cape Town who has
    long studied the local baboons. Cape Town’s geography is partially to blame. Much
    of the problem is confined to the Cape Peninsula, a narrow sliver of land stretching
    from the city centre to Cape Point. Here, baboons are boxed in between the steep,
    protected area of Table Mountain national park and the sprawling urban development
    that stretches to the Atlantic Ocean. “The underlying issue is that baboons will
    seek low-lying land. That is their natural drive – it’s better access to water
    and more productive vegetation,” said Joselyn Mormile, who leads the Cape Baboon
    Partnership (CBP), a nonprofit organisation that works with the city and local
    conservation authorities to manage the baboons. “But throughout the peninsula,
    we’ve developed most of those places. It’s a constant battle between the two.”
    View image in fullscreen A young boy at a protest outside the Urban Wildlife Centre
    near Simon’s Town on 13 September. Photograph: Esa Alexander/Reuters Initially,
    the CBP’s 2025 management plan proposed to move four troops to a sanctuary. That
    was revised, Mormile said, to give two other troops living in the northern section
    of the peninsula “the benefit of the doubt to see if they can adjust in that remaining
    space … We believe that they could settle quite nicely.” The baboons have proved
    an especially divisive – and expensive – issue. Cape Town’s baboon management
    programme costs about 20m rand for 18 months (£920,000), with full-time rangers
    watching over most of the troops to try to head off any trouble. In addition to
    moving the Waterfall and Seaforth troops to a sanctuary, a baboon-proof northern
    boundary fence will be erected between urban areas and nearby mountains. View
    image in fullscreen A baboon tries to open a car door. The animals often enter
    cars and buildings and take food. Photograph: Gallo Images/Shutterstock Animal
    rights activists, who have been staging peaceful protests for months, and some
    scientists say the city should build a fence to exclude the Waterfall and Seaforth
    troops rather than remove the animals from their environment. However, O’Riain
    said it was likely that the baboons would simply move along to the next area of
    low-lying land where the fence ends, as there was not enough food for the baboons
    behind the proposed southern fenced area. Opponents argue that removing the other
    baboons will cause long-term psychological distress and social disruption, and
    that the baboons play an important ecological role by dispersing plant seeds.
    Chacma baboons are not considered endangered. And the welfare of the animals is
    already in question: baboons are being poisoned, hit by cars, chased by dogs and
    shot. View image in fullscreen A chacma baboon looking through a windscreen on
    the Cape of Good Hope. Photograph: Ryogo i Kubo/imageBroker/Shutterstock “No one
    should ever shoot a baboon, but if people feel the authorities are not doing anything,
    they will take action – and that action is never nice,” O’Riain said. “Just a
    few days ago, a baboon was shot straight through the chest. “How many more millions
    of rand are we going to throw into these troops only to end up in exactly the
    same place in another 10 years’ time?” he said. “Which is shocking baboon welfare,
    shocking baboon health, and a very poor quality of life for the people who are
    living in these areas.” Find more age of extinction coverage here, and follow
    the biodiversity reporters Rebecca Ratcliffe, Phoebe Weston and Patrick Greenfield
    in the Guardian app for more nature coverage.'
