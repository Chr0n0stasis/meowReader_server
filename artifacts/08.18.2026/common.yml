  body_text: 'Abelardo de la Espriella is now the front-runner in Colombia The Americas
    | Colombia’s next president Abelardo de la Espriella is now the front-runner in
    Colombia The right-wing populist outperformed in the first round of a deeply divisive
    election June 4th 2026 PITY THE traditional centrist politician in Latin America.
    Time and again they campaign claiming that voters are tired of extremes. And time
    and again, from Argentina to Chile and now in Colombia, they get hammered. In
    the first round of Colombia’s presidential election on May 31st nearly 85% of
    voters chose either the right-wing populist Abelardo de la Espriella or the deeply
    leftist Iván Cepeda. Mr de la Espriella is now the favourite to win the run-off
    on June 21st. He surprised pollsters by winning almost three percentage points
    more of the vote than Mr Cepeda, who had been leading in the polls. The establishment
    centre-right candidate, Paloma Valencia, who was polling close to Mr de la Espriella
    a few weeks ago, crashed out, taking less than 7% of the ballot. Far from being
    tired of extremes, Colombians seem tired of the traditional centre. Ms Valencia
    and her centrist ilk deserve much of the blame. Across Latin America they have
    spent years in power but have made little progress in solving the problems that
    most worry voters. Violence, insecurity and drug-trafficking are a scourge, and
    getting worse. Centrist failings have opened a gaping window for right-wingers
    inspired, as Mr de la Espriella is, by Nayib Bukele, the authoritarian president
    of El Salvador. (He has crushed gang violence by locking up a staggering 2% of
    the adult population.) Centrists have also done little to reduce the region’s
    vast inequality, a gift to the hard left. And economic growth has been woefully
    slow: real GDP growth per person in Latin America in the decade to 2024 was just
    4%—in total, not per year. Politicians of the extreme and populist variety have
    seized upon all these failures with exaggerations, sweeping denunciations and
    tall promises. Colombia exemplifies much of this. It is one of the world’s most
    unequal countries, marred by the violence of rebel groups. It produces about two-thirds
    of the world’s cocaine. Colombians now have a stark choice in the run-off. Mr
    Cepeda promises left-wing economics, which is unlikely to solve Colombia’s fiscal
    woes, and to double down on the policy of Paz Total, an effort to negotiate with
    all rebel groups at once. It has been failing under Gustavo Petro, the outgoing
    leftist president. Mr de la Espriella promises free markets, but has worryingly
    populist economic policies. He also plans a heavily militarised response to the
    rebels and to build ten mega-prisons in the jungle in the style of Mr Bukele.
    Election night witnessed deep polarisation. Shamefully, Mr Cepeda and his ally
    Mr Petro both cast doubt on the results without providing evidence. Mr Petro claimed
    that “hundreds of thousands of votes were added” at some polling stations. Mr
    Cepeda warned of an alleged discrepancy involving 885,000 people and “atypical
    voting patterns”. Mr de la Espriella was typically hot-headed in response. He
    called Mr Petro a coup plotter and said that Mr Cepeda was “disabled”. He promised
    to defend democracy “by reason or force”, adding that he is willing to “be killed
    for Colombia” if necessary. On June 1st Mr Cepeda changed his tune and said there
    had been “no irregularities big enough to speak of fraud.” The short run-off campaign
    ahead will probably be nasty. Both sides will try to convince voters the other
    is an existential danger to Colombia while trying to persuade the small pool of
    centrist voters that they can be trusted. Mr Cepeda will relentlessly highlight
    Mr de la Espriella’s past as a criminal-defence lawyer who has associated with
    former paramilitary leaders and defended a man who ran a notorious pyramid scheme
    in Colombia. On election night Mr Cepeda said his rival represented “mafia-style
    fascism”. Mr Petro, who has already been pumping up the economy to try to help
    his ally, will probably splurge even more. Mr de la Espriella will continue to
    puff his claims that Mr Cepeda is a threat to democracy who wants to take Colombia
    on the same path as Cuba and Venezuela, calling him the candidate of drug-traffickers
    and rebels. Mr de la Espriella is now the firm favourite. This has cheered markets
    nervous of Mr Cepeda. Colombian shares surged on the news of Mr de la Espriella’s
    win. But the run-off could be tight. Mr Cepeda also outperformed recent opinion
    polls and won slightly more of the first-round vote than Mr Petro did four years
    ago. Back then Mr Petro went on to win the run-off, in part by boosting turnout.
    But most expect Mr de la Espriella to buck that precedent. The latest polling
    gives him an eight-point lead in the run-off. Donald Trump has interfered in order
    to endorse him. If Mr de la Espriella wins he will have to deal with a congress
    where the left has a lot of influence. That confrontation could make his campaign
    look like an easy prelude. ■ Sign up to El Boletín , our subscriber-only newsletter
    on Latin America, to understand the forces shaping a fascinating and complex region.
    This article was downloaded by zlibrary from https://www.economist.com//the-americas/2026/06/01/abelardo-de-la-espriella-is-now-the-front-runner-in-colombia'
