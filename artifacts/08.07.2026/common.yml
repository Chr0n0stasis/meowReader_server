- article_update_date: 05.27.2026
  body_text: 'Dope and glory: inside the Enhanced Games 1843 | Sport Dope and glory:
    inside the Enhanced Games Athletes want to break records. The founders hope to
    take performance-boosting drugs mainstream May 21st 2026 Almost every day for
    the past 15 years, Ben Proud had to make his whereabouts known to the doping authorities.
    Travelling for work? His hotel would have to be logged on a clunky website. Staying
    over at a new girlfriend’s place? That would have to be recorded, too. It didn’t
    make for the most spontaneous of lives. But it’s what you have to do if you want
    to be an Olympic athlete. In 2024 Proud had won a silver medal in the 50-metre
    freestyle swim at the Paris Olympics. It had been his third Olympics and the high
    point of his career. But last November he was in a slump. He was 31, old for a
    competitive swimmer. His knees hurt and his back was shot. There was a persistent,
    dull pain in the tendons around his elbows. One Wednesday at 6am he heard a knock
    at the door of his flat in Stratford, east London. He opened it to find a man
    and a woman, sent by UK Anti-Doping, Britain’s drug-testing body. They were there
    to check that Proud was complying with what is known among Olympic athletes as
    “the Code”, a set of regulations from the World Anti-Doping Agency that includes
    an agreement not to use certain substances. Proud knew the testers might pay him
    a visit that day, but hadn’t expected them to come so early. He had gone to the
    toilet just before they arrived, so they would all have to wait before another
    urine sample could be collected. The three of them didn’t make small talk; rather,
    they sat on the sofa and looked silently out of the window at the view. Nearly
    two hours later, Proud was ready. The male tester followed him into the flat’s
    only bathroom, an ensuite; they had to creep quietly through the bedroom to avoid
    waking Emily Barclay, Proud’s partner, who is also a competitive swimmer. Proud
    found the experience profoundly awkward. “You stand there with your trousers around
    your ankles and your bare arse out like a schoolboy,” he said. After the testers
    left, Barclay emerged tentatively from the bedroom. She passed Proud her phone
    to show him a piece of news. “Kristian has just broken the world record,” she
    said. Proud stared at the screen, confused. He frequently competed against Kristian
    Gkolomeev, a Greek swimmer. They’d tied for fifth place at the Tokyo Olympics
    in 2021, but Proud had comfortably beaten him in Paris. He couldn’t believe that
    Gkolomeev had somehow become the fastest 50-metre swimmer in history—in the off-season,
    no less. Reading on, Proud learned that Gkolomeev had signed up with the Enhanced
    Games, a company that was seeking to disrupt conventional sport by allowing athletes
    to compete while on performance-enhancing drugs. Later that day, Enhanced (as
    the wider company is sometimes known) released a documentary about Gkolomeev’s
    swim, which he had done alone in a pool in North Carolina. Not only had he taken
    the world record—Enhanced had paid him $1m for the achievement. “The swimming
    world is going to hate every second of it,” Brett Hawke, Enhanced’s head swimming
    coach, says in the documentary. “This is where human performance is going. And
    I think a lot of people will start to embrace it over time.” As the couple watched
    the documentary, Barclay had to pause it several times because Proud had been
    so overwhelmed with emotion. His pursuit of Olympic glory had come with steep
    costs. He’d grown up in Malaysia and moved to Britain to train when he was 16,
    leaving most of his family behind. There had been years when he had scraped by
    on nothing more than the £28,000 ($38,000) stipend provided by the national aquatic
    sports association to elite swimmers. He wasn’t sure what was in store for him
    after his swimming career came to an end—which, at his age, could be as soon as
    his next injury. If Proud joined Enhanced—and adopted its controversial drug protocols—he
    could keep swimming at the highest level, perhaps even faster than before, and
    potentially earn a life-changing amount of money. But he knew it was a Faustian
    bargain: taking part would tarnish his reputation, and he would probably be barred
    from mainstream competition for ever. Proud asked Barclay if she would judge him
    if he threw in his lot with the Enhanced Games. When she said she wouldn’t, he
    called his agent. He was ready for something new. On May 24th around 50 athletes—in
    swimming, weightlifting and athletics—will gather in Las Vegas for the first Enhanced
    Games. Up to $25m in prizes will be awarded, with $250,000 going to those who
    win first place and bonuses of up to $1m to world-record breakers. Around 2,500
    people will watch from the stands of a purpose-built arena, where they’ll also
    be treated to a Super Bowl-style closing ceremony—The Killers, a rock band, are
    playing—and have the chance to mingle with scientists, crypto investors and celebrities.
    The games will be streamed on YouTube and Roku: Bryan Johnson, a venture capitalist
    who has become famous for trying to chase immortality by tweaking every aspect
    of his body and lifestyle, will be one of the commentators. This spectacle is
    an advertisement for Enhanced’s other business: selling performance-enhancing
    products to non-Olympians. The company has pumped its competing athletes with
    drugs over the past three months in the hope that their achievements will inspire
    viewers—from ordinary gym-goers to grandparents trying to keep up with their grandchildren—to
    also get enhanced. A dizzying array of injectable drugs is already for sale on
    Enhanced’s website, promising to support everything from “sleep, energy and sharper
    mornings” to “healthy ageing”. Ultimately the real purpose of the games is to
    push the limits of what the public sees as the acceptable use of performance-enhancing
    drugs. Some of these have long been a part of the high-street gym scene: anabolic-androgenic
    steroids, such as testosterone, and human-growth hormones are widely used to improve
    muscle strength and performance. Increasingly, though, bodybuilders, “looksmaxxers”
    (people who go to extreme lengths to become more physically attractive) and Silicon
    Valley coders are supplementing their regimens with a new generation of drugs
    called peptides. Many peptides are unlicensed and produced by dubious-looking
    manufacturers in China. Some claim to speed recovery and healing; others to thicken
    hair, build muscle, deepen a tan or even improve libido. Gym enthusiasts and their
    coaches are now experimenting with combinations of chemicals aimed at improving
    strength, longevity or looks—nicknamed “stacks”—all without medical supervision.
    The Enhanced Games emerged from this subculture. Just before Christmas in 2022,
    Aron D’Souza, an Australian lawyer in his 30s, was working up a sweat in an upmarket
    gym in Miami when he overheard the buff people around him chatting about being
    “enhanced”. After D’Souza asked them what they meant, they cheerily discussed
    the contents of their stacks with him. For D’Souza, these enhanced gym-goers were
    prototypes for a healthier, more ambitious humanity. He began to wonder: what
    if the Olympics allowed for open enhancement? What feats could humans achieve
    if they could do whatever they wanted with their bodies? D’Souza was well-connected
    with rich people who liked big ideas, including Peter Thiel, a co-founder of PayPal
    and a venture capitalist. At Thiel’s annual new year’s party D’Souza pitched his
    idea for an Olympics on steroids; Thiel later wrote him a cheque. Balaji Srinivasan,
    a former executive at Coinbase, a cryptocurrency exchange, and Christian Angermayer,
    a German entrepreneur, followed suit. Their shared interest in the Enhanced Games
    stemmed from similar political orientations: all three men believe that people
    should be able to do what they like with their money and their lives with as little
    state interference as possible—preferably none. (Thiel has characterised regulators
    as “the Antichrist”.) They also all have close ties with Silicon Valley, where
    there is a tradition of viewing physical weakness, disease and even death as problems
    to be engineered away. D’Souza’s pitch was perfectly calibrated for this mindset.
    To draw attention to his nascent company, D’Souza began courting controversy.
    His main target was the International Olympic Committee (IOC). He argued that
    the IOC exploited athletes commercially while paying them nothing. (An early version
    of Enhanced’s website accused the IOC’s president of jetting to fancy hotels to
    visit billionaires and dictators while Olympic athletes slept in their cars.)
    D’Souza also called for national anti-doping agencies to be defunded for their
    “discrimination” against enhanced athletes. There are some grounds for criticising
    anti-doping agencies, especially on the issue of consistency. Tough bans have
    been imposed on individuals while groups of athletes from powerful countries such
    as Russia and China have been shown leniency. Few would go as far as D’Souza in
    suggesting that anti-doping rules be scrapped entirely, but many observers agree
    the system is broken. John Hoberman, a professor at the University of Texas at
    Austin who studies the history of doping in sports, told us that doping has been
    “out of control for a long time” and that frequent testing doesn’t appear to be
    a strong enough deterrent. Some experts have even argued that medically supervised
    enhancement could be a safer option for competitive athletes, given that so many
    of them take black-market drugs anyway. But even critics of the current anti-doping
    regime viewed the Enhanced Games with concern—Hoberman, for instance, has called
    it a “dishonest and careless project”. D’Souza knew his idea would need scientific
    credibility to get off the ground. In 2024 he started to approach potential scientific
    advisers and organised two gatherings grandly billed as “conferences on human
    enhancement”. The company also needed to find athletes willing to put their bodies
    on the line—so it offered $1m to anyone who broke a world record in certain disciplines
    while on an enhancement protocol. In February 2024 James Magnussen, a 32-year-old
    retired swimmer from Australia known as “the Missile”, was the first to take the
    bait. Having won silver and bronze medals at the London Olympics, he had been
    trying out several alternative careers, as many former Olympians do: gym-owner,
    sports commentator and “Dancing with the Stars” contestant. But after hearing
    about the Enhanced Games, he was now ready, as he put it on a podcast, to “juice
    to the gills” and break the world record in the 50-metre freestyle. Magnussen
    asked Brett Hawke, who had coached two of the previous world-record holders in
    the discipline, to train him. He then started a stack composed of anabolic steroids,
    testosterone and human-growth hormone—as well as some peptides—using dosages agreed
    upon with his own doctor. At the time, no one knew what it would take to transform
    a retired swimmer into a world-record breaker. But it became clear that the drugs
    did work—almost too well. Magnussen’s recovery between sessions was so quick that
    he asked Hawke to push him harder. His lifts in the gym became heavier and heavier.
    By the time he swam for the world record in May 2025, he had put on 20kg of muscle;
    in photos, his back bulged out of his swimsuit like the Incredible Hulk. The record
    attempt was a flop—Magnussen’s gains were so large they had slowed him down. “Unfortunately
    I didn’t actually grow gills,” he said, “because with all that muscle I was very
    low in the water.” Even so, he had proved that an enhancement protocol could help
    a retired elite athlete return to sport faster and more successfully than anyone
    had imagined. Perhaps the athletes just needed fewer drugs—and protocols informed
    by science. In December 2023 Guido Pieles was on his way to a medical conference
    when he received an unexpected email. It was from D’Souza. He wanted Pieles, an
    expert in sports cardiology and congenital heart conditions, to advise Enhanced.
    “Hang on, really? Are they joking?” Pieles recalls thinking. But he was interested
    enough to take a call with D’Souza anyway. “I had a lot of questions,” he remembers.'
