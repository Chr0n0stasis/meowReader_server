  body_text: 'Why Westerners are falling for love scams Culture | My con and only
    Why Westerners are falling for love scams Romance fraud is driven by poverty in
    west Africa and loneliness in the West, a new book argues June 18th 2026 It was
    love at first sleight. As with many relationships, Brian’s and Silvia’s courtship
    started on Tinder. Brian, a dashing American soldier, sent Silvia, a Spanish dentist,
    passionate affirmations of love: “I want you to be a happy wonderful woman, someone
    I would love to share more than my life with.” Brian said he was coming to Spain,
    and Silvia bought two rings. But Brian was not a real soldier; he was a scammer
    posing as a suitor. He told Silvia he had found bars of solid gold while on deployment
    in Syria. Silvia’s son grew suspicious. He thought it might be a scam and that
    his mother would be asked to send money to cover the shipping. They used an IP-address
    tracker to find out where Brian’s emails were coming from: the fraudster was in
    Lagos, Nigeria . Silvia is not the only lonely Westerner to be wooed by a phoney
    Romeo. Romance scams are one of the most costly types of fraud in America, according
    to the Federal Trade Commission: people gave away nearly $1.5bn to so-called “love
    scammers” in 2025. In Britain reports of romance fraud jumped by nearly a third
    last year, with people losing as much as £1m ($1.3m). Silvia’s son, Carlos Barragán,
    was distressed and baffled that his mother had been duped. So in 2022 he flew
    to Lagos to search for the scammer. Though it proved impossible to find the real
    Brian, Mr Barragán discovered the “criminal underworld” of romance fraud. In an
    engrossing new book he takes readers from Kentucky to Lagos to explore how loneliness
    in the West and poverty in west Africa are “two sides of the same screen”. Many
    love scams are run by crime syndicates in South-East Asia. Mr Barragán expected
    to find a “sophisticated network of fraudsters” in Nigeria, too: instead he encountered
    unemployed young men in rough neighbourhoods, who use copy-and-paste scripts rather
    than complex manipulation tactics. Many work alone, staying up all night to avoid
    their parents’ prying eyes. In Nigeria Yahoo Boys —a nickname that nods to the
    email addresses scammers once used—say they rely on fraud to survive. Between
    2022 and 2025 Mr Barragán spent months in Ikotun, a poor neighbourhood in Lagos,
    witnessing the effects of high youth unemployment and rampant inflation. He saw
    that for scammers like Azeez (pictured), a 14-year-old tailor’s apprentice, a
    $10 gift card from a British victim is worth more than his family pays in rent
    a month. (With some of their earnings Yahoo Boys prop up local businesses, splashing
    out at fancy boutiques and nightclubs.) Mr Barragán asks workers, policemen, academics
    and Yahoo Boys themselves to estimate the share of young men who are involved
    in such scams in Lagos: their answers range from 45% to 80%. The Yahoo Boys call
    their victims “clients” to make their work seem legitimate; some see their relationships
    as transactional, providing companionship in exchange for cash. They share tactics
    with each other for finding vulnerable victims online, as well as the latest pickup
    lines and plausible scenarios to ask for money to be wired. Some pretend to have
    a sick child who needs help; others blackmail victims, threatening to share intimate
    pictures if they do not pay up. Mr Barragán wonders how credulous Westerners can
    fall head-over-heels for such smarmy scripts. He looks “for a con so intricate
    it might justify” his clever mother believing it. But he finds something alarmingly
    simple: the scammers are successful because they provide attention to lonely people.
    AI will complicate love scams. It could make it easier to target a much larger
    number of victims with personalised correspondence, without relying on teams of
    boys and men (and growing numbers of women) in Nigeria or elsewhere. But AI could
    also offer safer ways for people to feel less lonely. Various apps now provide
    virtual lovers that are even more fawning than fraudsters. As Mr Barragán puts
    it, AI partners provide “a fake relationship without the betrayal”. Yahoo Boys
    may struggle to compete with that. ■ For more on the latest books, films, TV shows,
    albums and controversies, sign up to Plot Twist , our weekly subscriber-only newsletter
    This article was downloaded by zlibrary from https://www.economist.com//culture/2026/06/17/why-westerners-are-falling-for-love-scams'
