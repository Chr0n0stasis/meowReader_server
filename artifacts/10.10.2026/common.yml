  - answer: B
    explanation: In the context of the passage, 'fungible' refers to how digital imagery
      makes reality interchangeable or malleable; nothing 'stays itself' because the
      CGI allows any scene to be manipulated, thus undermining the 'real' physical
      world.
    options:
      A: Digital technology allows directors to create more realistic historical settings.
      B: The boundary between actual physical reality and artificial digital creation
