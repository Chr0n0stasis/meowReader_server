  body_text: 'What Science Knows About Grief Personal History What Science Knows About
    Grief After my husband’s death, I had never been more pliable, tender, open, or
    raw. It was then that I tried E.M.D.R. therapy. By Amanda Petrusich June 22, 2026
    In 1967, Leonard Cohen released “So Long, Marianne,” a requiem for a love affair
    that was unravelling, or at least transforming in some critical way. The song
    is romantic—the Marianne of its title was Cohen’s girlfriend and muse in the nineteen-sixties—but
    its fourth verse contains what I’ve always thought was a profound articulation
    of grief: Your letters, they all say that you’re beside me now Then why do I feel
    so alone? I’m standing on a ledge and your fine spiderweb Is fastening my ankle
    to a stone. I listened to “So Long, Marianne” dozens, possibly hundreds, of times
    after my husband experienced two catastrophic seizures and died, in the summer
    of 2022. The spiderweb—the object of my grief—became both a tether to and a protection
    from danger. The night of his death, I left the emergency room in the gauzy predawn
    hours, carrying our thirteen-month-old daughter. I was alone, stupefied with shock,
    mentally replaying a scene in Joan Didion’s “The Year of Magical Thinking” in
    which a hospital social worker gestures toward Didion and asks, “Is this the wife?”
    I had not been assigned a social worker. Maybe that meant my husband wasn’t dead.
    I felt hot and weightless, as if my feet weren’t making full contact with the
    ground. A nurse had offered my daughter a little package of crayons, but she was
    too young to use them, and now I was clutching them in one hand. I woke up my
    sister, who was living in New England. Her voice was tight but steady on the phone.
    I must have sounded insane. I let her assume the controls: Buckle the baby into
    the car seat. Is she safe? Are you sure? Get in. Put on your seat belt. Start
    the ignition. Are the headlights on? Can you drive? Are you sure? It felt as though
    I were a dazed passenger attempting to land a nose-diving airplane. I tried not
    to think about the clatter and thud of his body being slid into a refrigerated
    compartment. My parents lived fifteen minutes from the hospital; they were standing
    in the driveway when I pulled in. Had I phoned them? The horizon was a soft and
    murky pink. Did I open the car door and fall out? Did my mother get the baby?
    I don’t know. My husband and I met as teen-agers, and married in our late twenties.
    Later that morning, I called his family. I called his boss. I called our friends.
    Most of them answered the phone cheerfully. My daughter and I stayed with my parents
    for a couple of months. When I went back home for the first time, to collect some
    toys and clothes, I cleaned streaks of my husband’s dried blood off the floorboards
    and threw up in the kitchen sink. Then I cleaned that up, too. I put his eyeglasses,
    still cloudy with fingerprints, into a drawer. It seemed impossible that he didn’t
    need them anymore. When I was presented with a rendering of my husband’s headstone,
    after pawing through a binder of unhinged-seeming designs (did he want an etching
    of the Buffalo Bills logo?), it felt like a gag gift, something that friends might
    have mocked up for his birthday. It suddenly seemed so easy to disappear. “ Media
    vita in morte sumus ,” someone said at the funeral. In the midst of life we are
    in death. My situation was, on some level, achingly ordinary. People die all the
    time. Or worse things happen. My father lost his father when he was a toddler.
    My mother lost her sister when she was a teen-ager. My husband lost both his parents.
    After a while, a sort of austere survival instinct kicked in for me. My existential
    panic was subsumed by more pragmatic concerns. When a death is quick, and the
    practical ramifications are both vast and immediate, any platitudes associated
    with “good” grieving feel like luxurious fantasies. There was no time for grace.
    I was astounded—fixated, on some level—by the irresolvable mathematics of my scenario.
    My household income had been halved, and my domestic responsibilities had doubled.
    I was now a single mother, with a slate of grisly and endlessly regenerating administrative
    chores, most of which concluded with the faxing of a death certificate to an institution,
    accompanied by a deranged note saying “Thanks!” I returned a car that we had bought
    a few days prior to his death, sitting in the exact same stiff, faux-leather chair
    at the dealership, trying to explain to the very smiley salesperson that my husband,
    whom he’d recently shaken hands with, was not alive anymore and I didn’t need
    two cars. He was flummoxed, then horrified. My parents had to finish the paperwork.
    Between grief-induced insomnia and waking in the night to care for my baby daughter,
    I was feral with exhaustion. The tiniest decisions were paralyzing. Was the trash
    full enough to take out? Was her fever high enough to call the pediatrician? What
    was for dinner? Grief mangles cognition and memory in ways that can make even
    banal tasks feel surreal, if not impossible. When a bank clerk asked me for my
    daughter’s birth date—I was attempting to add her name to our savings account—it
    felt as though I’d been charged with solving a math equation. I did my best. I
    boxed up and donated my husband’s jeans and sweaters. I took his toothbrush out
    of the holder and threw it in the garbage. I ordered a new sofa. I thought that
    if the room looked different I could begin to resolve some of the dissonance of
    sudden loss. I indulged in my share of magical thinking. The question that hounded
    me the most that fall was: Where did he go? Perhaps that’s why the word “lost”
    is so synonymous with death—it can feel as if your person is simply misplaced.
    I went back to work. People marvelled at this, as though it were a choice, but
    I needed money, and I needed to engage some cooler, steadier portion of my brain.
    Unfortunately, I found music largely unlistenable—an inconvenient development
    for a professional pop critic. The emotional circuit that my favorite songs lit
    up inside me was too vivid; music felt overwhelming, if not revolting. There were
    a few things I could stand: Nick Cave and the Bad Seeds’ “Ghosteen,” P. J. Harvey’s
    “Stories from the City, Stories from the Sea,” Paul Simon’s “Graceland,” anything
    by Leonard Cohen. Some Nina Simone, some Miles Davis. Listening to most records
    felt shaky, ominous, like reintroducing food after a stomach bug. What could I
    receive without retching? Somewhat serendipitously, I was already in the midst
    of reporting a Profile of Metallica , a band famously preoccupied by death. (Metallica’s
    bassist Cliff Burton died in a ghastly bus accident in 1986, when he was twenty-four,
    an event that haunts even the current iteration of the group.) I now found the
    singer and guitarist James Hetfield’s clenched-fist articulations of despair wildly
    comforting. Death was interesting to him. These songs both normalized pain and
    made it beautiful. Understanding that this was even possible—that grief could
    shape-shift into something less ugly, less weak—kept me going. Appearing steady
    around my subjects was hard. (One afternoon, while watching the indie-rock band
    the National rehearse at its airy, sunlit studio space in Hudson, New York, I
    had a fairly sizable breakdown in the bathroom, stifling my sobs with a mitten.)
    But I was grateful for the sense of control I felt when writing. The real work
    of nonfiction, and of profile writing especially, is in making a series of arbitrary
    and disconnected events legible. The best profiles force a coherent arc from a
    string of mostly random occurrences: of course it all happened just like that.
    Writing was a corrective to my reality, which felt incoherent. The rawness and
    terror of that first year was so visceral and embodied. “And grief still feels
    like fear,” C. S. Lewis wrote, in 1961. His wife, Joy, had recently passed away,
    of cancer, at age forty-five. “Perhaps, more strictly, like suspense. Or like
    waiting; just hanging about waiting for something to happen.” I was locked in
    a kind of defensive crouch. My daughter surely sensed the hum of my heartbreak,
    though I tried to be soft, even joyful, in her presence. I was toggling maniacally
    between otherworldly love for her and anguish that her father was dead and she
    would have no memory of him. During nap time, I’d tiptoe out to the driveway,
    sit in my parked car, place the baby monitor in my lap, and weep into the hood
    of my sweatshirt. Part of me wanted her to know that grief is a reasonable reaction
    to a devastating occurrence, but mostly I just wanted her to remain connected,
    in the way children are, to the ecstasy and wonder of existence, without any premature
    knowledge of its concomitant pain. I got very good at sensing when the heft and
    finality of the loss was making someone uncomfortable. I found this both relatable
    (I surely wouldn’t have known what to say, either) and alienating. Grief can’t
    be “fixed”—death is famously irreversible—so conversations about it require both
    parties to abandon problem-solving and accept a kind of unpleasant stasis. When
    well-intentioned friends or colleagues asked me how I was doing, I felt dread.
    What I wanted to say was This feels exactly as bad as you think it feels . What
    I usually said was Yeah , I’m O.K. I was having a hard time connecting with anyone
    who hadn’t locked eyes with a particular sort of darkness. I sought out people
    who felt complicated and fucked up—who were able to reckon in some way with the
    lunacy of human life. In 1986, a trio of social psychologists introduced an idea
    called terror-management theory, based on the cultural anthropologist Ernest Becker’s
    claim that fear of death is “the mainspring of human activity.” (Becker’s book
    “The Denial of Death” won the Pulitzer Prize for general nonfiction in 1974.)
    T.M.T. posits that civilization itself is largely a response to mortality—an elaborate
    system of distraction and repudiation. Because humans have a sophisticated and
    symbolic awareness of death, we invest aggressively in shared cultural beliefs,
    which “ provide the universe with order, meaning, value, and the possibility of
    either literal or symbolic immortality. ” Simply sitting with the idea that death
    is compulsory and irreversible is too hard. Most of us will do almost anything
    to forget it. Yet becoming a young widow was easily the most fascinating thing
    that has ever happened to me. In fact, it often felt like the only thing that
    had ever happened to me. In a 2019 conversation between Stephen Colbert and Anderson
    Cooper, Colbert spoke about the isolation of grief, even decades later: “Why is
    nobody asking me about this? My brothers died forty-five years ago, and sometimes
    I’ll go, ‘How come nobody is asking me about Paul?’ ” I knew what he meant. Talking
    about anything else felt nuts. It was hard not to think of “moving on” as a kind
    of annulment, a final act of severance. In this context, the whole idea of recovery
    seemed vaguely dehumanizing—too results-oriented, too transactional, too American.
    Who was I to believe that I could vanquish the ache of death? I liked speaking
    with people who could acknowledge the enigma at the core of existence without
    feeling embarrassed. One afternoon, the Episcopal minister who’d performed my
    husband’s funeral service said to me, only half jokingly, “I guess he has all
    the answers now.” I found the idea that he’d suddenly been made privy to cosmic
    information both funny and comforting. Rare air; good for him. In 2023, Paul Simon
    released a thirty-three-minute album of acoustic hymns titled “Seven Psalms.”'
