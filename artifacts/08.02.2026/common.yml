- article_update_date: 04.16.2026
  body_text: A Chinese national has been sentenced to a year in prison and fined by
    a Nairobi court for attempting to smuggle thousands of ants out of Kenya, a lucrative
    trade in east Africa that was exposed last year. The insects are mostly destined
    for China, the US and Europe, where they become pets and can be worth about $100
    each. Ant smuggling made headlines last year when two Belgian teenagers were arrested
    in possession of nearly 5,000 ants, mostly stored in small test tubes. They were
    fined about $7,700. Zhang Kequn, who evaded capture until his arrest on 10 March,
    had been linked to another case involving two people, one Vietnamese and one Kenyan.
    More than 2,200 ants – including 1,948 prized Messor cephalotes – were found in
    test tubes in Zhang’s luggage at Nairobi’s international airport that was destined
    for China. He was initially charged with wildlife trafficking without a permit
    and conspiracy, which carries a seven-year sentence, his lawyer said. He pleaded
    guilty after latter charge was dismissed. At the court in Nairobi, the judge,
    Irene Gichobi, described Zhang as lacking in remorse and “not an entirely honest
    person”. She said he would be fined 1m Kenya shillings ($7,700) and handed down
    a one-year jail sentence, after a 14-day appeal. She said he would then be “referred
    to his home country”. “There is need for a stiff deterrent sentence,” she said,
    noting the “rising cases of dealing in large quantities of garden ants and the
    negative ecological side-effects”. The Kenyan Charles Mwangi is accused of selling
    ants to three people convicted last year. He has pleaded not guilty and the case
    is continuing, according to his lawyer.
