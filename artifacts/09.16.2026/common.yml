  body_text: Two US service members are missing in south-western Morocco after taking
    part in annual multinational military exercises in the North African country,
    the United States Africa Command (Africom) said on Sunday. The US, Morocco and
    other countries participating in the African Lion exercise have launched a search
    and rescue operation, Africom said. “The incident remains under investigation
    and the search is on-going,” it said in a statement. The incident happened on
    2 May near the Cap Draa training area near Tan Tan, close to the Atlantic Ocean.
    The war games exercise started in April and runs across four countries, including
    Tunisia, Ghana and Senegal. It is scheduled to end in early May. The Moroccan
    army said the service members went missing near a cliff. “Initial reports indicate
    the two soldiers may have fallen into the ocean,” a US defense official told Reuters
    by email. “I can confirm this incident is not related to terrorism.“ African Lion,
    which has been running since 2004, is the largest US annual joint military exercise
    on the continent and usually features high-ranking military officials from the
    US and its top African allies. US military officials have said the annual multinational
    engagement serves as a venue for strengthening regional security cooperation and
    refining the readiness of participating forces for global crises. Reuters contributed
    reporting
