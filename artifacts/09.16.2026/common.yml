  body_text: 'Why Dolly Parton mattered to America Culture | She wore it so proudly
    Why Dolly Parton mattered to America She was brave, decent and unapologetically
    herself Aug 27th 2026 When Dolly Parton was in her 20s, she rejected Elvis Presley
    . She had written a wonderful song, “I Will Always Love You”, and the King wanted
    to cover it. His manager demanded that she sign over half the rights to the tune,
    because Elvis was huge and she was not. She said no. It must have taken nerve,
    for a woman who grew up in a one-room shack without electricity in Tennessee,
    to tell Elvis to get lost. But it made her millions. The version sung by Whitney
    Houston , many years later, was one of the bestselling tracks of all time. (The
    Arabic version ripped off by Saddam Hussein for a campaign song is best forgotten.)
    Ms Parton became a megastar, with 25 number-one hits on Billboard’s Hot Country
    chart and 11 Grammy awards. Yet what was striking about her career was not how
    many people loved her, but how few didn’t. Five years ago the New York Times published
    an article with the headline, “Is there anything we can all agree on? Yes: Dolly
    Parton”. She has been publicly mourned by both Donald Trump and Zohran Mamdani
    . What was her secret? It started with her voice: a bright soprano with a twangy
    Appalachian accent. It could be honeyed and nostalgic, as in “Coat of Many Colours”,
    about a coat made of rags which the other children laughed at, but made her feel
    “rich” because of the love her mother put into it. She could sound weary and bemused,
    as in “9 to 5”, in which she pours herself “a cup of ambition” before toiling
    for an indifferent boss; or sharp, as in “Jolene”, in which she begs another,
    prettier woman: “Don’t take my man…even though you can.” She was a gifted writer
    at a time when female country singers rarely penned their own songs. Her lyrics
    were plain-spoken and playful; she had a knack for distilling life lessons (and
    quickly: she once said she may have written “Jolene” and “I Will Always Love You”
    on the same night). She was versatile, collaborating with Sir Paul McCartney of
    the Beatles and Lizzo, a singer and rapper. She acted, wrote a memoir, developed
    a theme park called Dollywood, created a charity that gave more than 300m books
    to children and died with an estimated net worth north of $450m. The first cloned
    sheep was named after her. A musical about her life will open on Broadway in December.
    People had to respect her grit. Her parents, a tenant farmer and his wife, were
    so poor that the doctor who delivered her was paid with a bag of cornmeal. The
    fourth of 12 children, she was singing on a local TV show when she was ten and
    made her first appearance at Nashville’s Grand Ole Opry just three years later
    ( Johnny Cash introduced her). She had a songwriting deal before she finished
    high school. She teamed up with Porter Wagoner, another singer, in 1967, but soon
    became more popular than him and struck out on her own. She branched out into
    pop songs and turned her attention to business ventures, including film and TV
    production. She was serious about her Christian faith, but poked fun at herself.
    (She once entered a Dolly Parton lookalike contest incognito and lost, to a man.)
    She shunned controversy. “I’m not in politics; I’m an entertainer.” She twice
    declined the Presidential Medal of Freedom. Asked how she had both gay and conservative
    religious fans, she said, “It’s two different worlds, and I live in both and I
    love them both.” She did, however, encourage Americans to get the covid jab with
    a cover of “Jolene”: “Vaccine, vaccine, vaccine, vaccine/I’m begging of you, please
    don’t hesitate.” She died at her home in Nashville, a few hours’ drive from where
    she was born, having narrowly outlived her husband of nearly 59 years. (Carl Dean,
    an asphalt contractor, had no interest in show business and sometimes pretended
    to be the gardener when journalists came knocking.) Her death was announced by
    her nephew, and one of her last albums featured collaborations with five generations
    of her extended family, thanks to some archival recordings. It was produced by
    a cousin, and closes with Ms Parton’s spoken words: “Until we meet again, keep
    the music in your heart and the mountains in your soul.” ■ This article was downloaded
    by zlibrary from https://www.economist.com/culture/2026/08/26/why-dolly-parton-mattered-to-america'
