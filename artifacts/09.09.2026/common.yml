  body_text: '| Next | Section menu | Main menu | Previous | Makena Kelly Jake Lahut
    Elisa Muyl The Big Story Sep 24, 2025 6:00 AM The 22 Very Online Upstarts Changing
    the Face of Politics Introducing WIRED’s 2025 Political Power Users—the creators,
    podcasters, and pundits who will blow up the next electoral era. PHOTO-ILLUSTRATION:
    RUI PU; GETTY IMAGES Donald Trump’s second term has ushered in a new era in American
    politics. It’s brasher, crueler, more direct, more super online, and certainly
    more dystopian. Democrats and sometimes even Republicans have struggled to compete
    with Trump ’s monopoly on the attention market. But the leaders of both parties
    are only mortal—yes, even Trump—and they’re not going to be around forever. A
    new generation of political talent is muscling its way onto the scene, armed with
    new ways of connecting with the masses and original visions of the country they
    want to live in. Here are the candidates, the influencers, and the insiders on
    both the left and the right that we think you’ll keep hearing from, and why. You
    might just remember when you spotted a future president in this edition of WIRED.
    Guide to New Politicos THE DIGITAL NATIVES → THE MAGA BABIES → THE HETERODOX REPUBLICANS
    → THE MUTINY ON THE LEFT → FROM VIRAL HITS TO POLITICAL STARS → THE TEXAS CORNER
    → THE CONNECTORS → EXPORTED TO EUROPE → After the shock of the 2024 election loss,
    some Democrats became convinced of the need for a “ liberal Joe Rogan ”—someone
    to appeal to the podcast-bro demographic that helped put Trump back in the White
    House. But there are already Democrats and progressives who know how to mobilize
    an online audience—and think they know where the party’s communications have gone
    wrong. Melted Solids Production agency, Brooklyn, New York If you were caught
    up in the avalanche of content coming from the New York City mayoral primary race,
    you likely saw a video by Melted Solids, which worked with Zohran Mamdani early
    on in his campaign. Cofounders Anthony DiMieri and Debbie Saslaw come from advertising
    and content production backgrounds, not politics. They bring a documentary-style
    approach focused on platforming regular people. “Listening, not lecturing,” as
    Saslaw describes it. One of their most viral collaborations with Mamdani is a
    video of the candidate interviewing Trump voters (and nonvoters) in Queens and
    the Bronx. But not everyone can nail the essence of a Melted Solids video, or
    even understand what makes them special. In Andrew Cuomo’s unsuccessful attempt
    at mimicking Mamdani, he’s seen hand-shaking and back-slapping potential voters,
    but their voices remain unheard. You’re likely to keep seeing DiMieri and Saslaw’s
    influence on political messaging, though, thanks to Mamdani’s upset victory in
    June. Chi Ossé City Council member, New York City “Before I am an elected official,
    before I am a son, before I am a brother, I am a shitposter, and I have always
    been,” says Ossé. “If there’s another language that I speak, it is the internet.”
    The 27-year-old City Council member is the creator of several videos with millions
    of views on Instagram, including his series “Why Shit Not Working?” that breaks
    down the most intransigent elements of New York City’s dysfunction. Ossé frequently
    uses his online presence to galvanize public opinion and even once to pass policy.
    With one social media call in 2023, he got more than 1,000 people to attend a
    board meeting on rent guidelines to voice concern about a double-digit percent
    proposed increase on rent-stabilized apartments. Now other politicians are taking
    cues from his success, including Mamdani—Ossé says he had to remind the mayoral
    candidate to post his campaign launch video on TikTok. “Before I am an elected
    official, before I am a son, before I am a brother, I am a shitposter, and I have
    always been. I grew up using the internet.” CHI OSSÉ Deja Foxx Digital strategist,
    Arizona Foxx’s star rose practically overnight in 2017, when the then-16-year-old’s
    exchange with US senator Jeff Flake over his vote to restrict funding to Planned
    Parenthood went viral. The activist and content creator built a career on that
    moment, working as a digital strategist for the Kamala Harris 2020 campaign and
    then appearing as a speaker at the 2024 Democratic National Convention. This year,
    the 25-year-old launched her own campaign in a special election for the late Raúl
    Grijalva’s Arizona congressional seat. In a July TikTok video that she filmed
    with family members, she reminisced about filing campaign paperwork online: alone,
    in her bedroom, “with no staff, no donor list.” The rest of her social media is
    just as earnest and direct, featuring front-facing videos that ground her progressive
    policies in her life experience: Foxx was raised by a single mom, experienced
    homelessness, and relied on federally funded programs like Section 8 and Title
    X. While Foxx ultimately lost the primary to Adelita Grijalva, Raúl’s daughter,
    her digital strategy generated notable momentum in the last few weeks of her campaign.
    She hit 300,000 TikTok followers and raised hundreds of thousands of dollars in
    small donations. Despite her loss, Foxx caught the attention of younger progressives
    in the House of Representatives, who say they are excited about her future in
    politics. Manny Rutinel State representative, Colorado Rutinel, 30, may have invented
    a new way to campaign online: via heartfelt Instagram photo montages set to pop
    music, sometimes sung by the man himself. Now he’s deploying these videos in the
    race to unseat Republican representative Gabe Evans in Colorado’s Eighth District,
    which is projected to be one of the midterms’ most competitive races. Rutinel’s
    posts are often deliberately hammy. (He once did a Christopher Walken impression
    to announce a motion in the Colorado state legislature.) They also consistently
    deliver his campaign message: that he’s a champion for working people because
    of his own working-class upbringing. (Rutinel did not respond to WIRED’s request
    for an interview.) In the first six months of 2025, Rutinel raised more than $1.6
    million, about half of which came from small-dollar donations. In the crowded
    field of Democratic candidates opposing Evans, he is the only one who has kept
    up with the Republican’s fundraising. As the race gains national attention, Rutinel’s
    distinct online presence might earn some copycats in years to come. Over on the
    right, some of the youngest members of Trumpworld have iterated on The Donald’s
    playbook, mixing traditional and new media to reach the base and capture everyone
    else’s attention. Anna Paulina Luna US representative, Florida The 36-year-old
    Air Force veteran is the apotheosis of the GOP’s digital strategy: the nation’s
    first influencer turned right-wing member of Congress. Paulina Luna got there
    with a canny sense for what works online, and what doesn’t. “If you want to be
    effective in the future of politics, especially in the next presidential election
    or the next statewide races, you have to have a presence on social media,” she
    told WIRED. “But it can’t be a shit presence. It has to be a legit presence, because
    people can see right through it.” Paulina Luna may have clips of her appearances
    on Fox News to share, but she says followers would much rather see her extemporize
    directly to her iPhone for 45 seconds on whatever subject, from UFOs to the culture
    wars. The House GOP has taken notice of Paulina Luna’s success: Her communications
    director was invited to speak to members about how to use vertical video. Brett
    Cooper Media personality, Nashville, Tennessee After building a formidable following
    with her Daily Wire show The Comments Section , 23-year-old Cooper struck out
    on her own earlier this year. Within six months of launching on YouTube, in early
    2025, The Brett Cooper Show accrued more than 1.5 million subscribers, racking
    up hundreds of thousands of views each episode. Cooper doesn’t stray far from
    the politics-meets-pop-culture formula that made her Daily Wire show a success,
    but she has ditched explicitly partisan rhetoric for more coded cultural commentary.
    She picks topics that capture the attention of young women, offering a light-touch
    conservative critique of, say, Blake Lively’s lawsuit against Justin Baldoni.
    “I never want my content to be a time suck,” Cooper says. “I never want it to
    be like mindless fluff.” Natalie Winters Political commentator, Washington, DC
    The 24-year-old White House correspondent for Real America’s Voice knows how to
    make an entrance. She’s part of the West Wing’s new, young, and vocally right-wing
    press corps, and her outfits alone generated entire news cycles early in the second
    Trump administration—mostly thanks to the Daily Mail compiling social media scoldings
    over her more casual attire. Winters leaned into it, dunking on them and using
    the coverage to keep building her brand. Winters, who abstains from both alcohol
    and tap water as part of her wellness regimen, tells WIRED that she thinks the
    MAHA movement is the new “gateway drug” for the GOP. Winters also cohosts War
    Room on Real America’s Voice with Steve Bannon, her mentor, and has a direct line
    to the MAGA base heading into 2028. “If you want to be effective in the future
    of politics, especially in the next presidential election or the next statewide
    races, you have to have a presence on social media. But it can’t be a shit presence.
    It has to be a legit presence, because people can see right through it.” ANNA
    PAULINA LUNA The coalition that helped elect Barack Obama twice—college-educated,
    young, Black, and Latino voters—cracked in 2016 and fractured completely in 2024.
    Now a new slate of candidates on the right are trying to prove that it’s not just
    Trump who can broaden the GOP’s base. Mayra Flores Congressional candidate, Southern
    Texas The 39 year-old Flores became the first Mexican-born congresswoman in 2022,
    when she flipped a Texas House seat—the 34th District—in a special election. After
    losing the next two races for that district, she’s now going to try again, thanks
    to redistricting that has made the area much redder. Flores aims her candidacy
    directly at the idea of demographic destiny. “As I grew up, I began to question
    why so many Hispanics consider themselves Democrats, since the majority of us
    have been raised with strong conservative values,” she says in one of her earliest
    campaign videos. “The Hispanic community is pro-God, pro-life, pro-family, pro-America.”
    (Flores did not respond to WIRED’s request for an interview.) Amir Hassan Political
    candidate, Michigan The Navy veteran is running to flip Michigan’s Eighth District
    as a “proud Muslim” who supports Israel and the America First agenda. If he wins,
    Hassan would represent his native Flint, the seat of a yearslong water crisis
    that has shaken residents’ trust in government. Today, the district leans left.
    But Genesee County, where Flint sits, shifted more than 5 percentage points for
    Trump in 2024. Hassan sees an opportunity for change. “Where I’m from, we’re raised
    to think Democrats are the good guys. We’ve been held culturally hostage for over
    half a century,” the 39 year-old says in a campaign video. “But look around. Flint
    is what happens when your vote is taken for granted.” (Hassan’s campaign also
    declined to be interviewed for this piece.) “I never want my content to be a time
    suck. I never want it to be like mindless fluff.” BRETT COOPER A growing group
    of Democratic politicians at different levels of government have challenged their
    party’s fecklessness with plans to address intractable problems like public safety
    and the cost of living. The most ambitious among them want to completely remake
    Congress. Saikat Chakrabarti Political adviser and congressional candidate, Bay
    Area, California The 39-year-old Chakrabarti cofounded Brand New Congress—which
    was aligned with the so-called Justice Democrats, the group that recruited Alexandria
    Ocasio-Cortez. He ran AOC’s campaign before becoming her chief of staff in Washington,
    where he helped write the Green New Deal. Chakrabarti says he felt compelled to
    run for Nancy Pelosi’s seat in Congress after he watched the House Democratic
    leader and other Democrats in the wake of Trump’s 2024 win, “helpless to really
    change anything.” He has a detailed set'
