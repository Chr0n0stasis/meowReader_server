- article_update_date: 06.10.2026
  body_text: '| Next | Section menu | Main menu | The Truth Is Still Out There Why
    Americans remain convinced that the government is hiding an alien conspiracy by
    Adam Kirsch This article was featured in the One Story to Read Today newsletter.
    Sign up for it here. “There has been a threat to publicly release government material
    long shrouded in secrecy.” This sentence could have been intoned by a TV newscaster
    anytime in the past few years, about any number of real or alleged cover-ups—of
    Joe Biden’s mental decline, or the names in the Epstein files, or the origins
    of COVID-19. In fact, it comes from the trailer that aired during the Super Bowl
    for Disclosure Day , Steven Spielberg’s new movie, opening June 12. For people
    who believe in aliens, or who would like to be able to believe in them, that title
    leaves no doubt about the kinds of secrets in question: Disclosure refers to the
    long-awaited moment when the U.S. government will admit what it really knows about
    visitors to our planet. When President Trump promised, in a social-media post
    in February, “to begin the process of identifying and releasing Government files
    related to alien and extraterrestrial life,” he implied that disclosure might
    be just around the corner. It wasn’t: This morning, the Pentagon released a tranche
    of historic images on a new website, war.gov/ufo , which feature plenty of black-and-white
    murk but nothing that looks even a little like an alien spacecraft. Still, if
    history is any guide, this disappointment won’t put an end to the belief that
    the government is hiding a spaceship or an alien corpse; according to one of the
    best-known UFO legends, both were retrieved from a crash site near Roswell, New
    Mexico, in 1947. Or the proof could be something less tangible—a clear image of
    a nonhuman craft in flight, a radio signal from an extraterrestrial civilization.
    However it happens, disclosure will finally reveal the truth—not just about aliens,
    but about the authorities that have been deceiving us for so long. This isn’t
    a new theme for science fiction, or for Spielberg. His career as a director took
    off in a post-Watergate climate when Hollywood was obsessed with official conspiracies
    and heroic whistleblowers—think of Alan J. Pakula’s All the President’s Men ,
    Sydney Pollack’s Three Days of the Condor , and Francis Ford Coppola’s The Conversation
    . Spielberg brought this suspicious, anti-establishment mood to his early blockbusters,
    starting in 1975 with Jaws , in which the mayor of a northeastern beach town tries
    to cover up a deadly shark attack. Read: The blockbuster that captured a growing
    American rift But the perfect genre for a story about government lies was the
    UFO movie, as Spielberg showed with Close Encounters of the Third Kind in 1977.
    “All I wanna do is know what’s going on,” says Roy Neary, the working-class hero
    played by Richard Dreyfuss, after a brush with a UFO. Unfortunately, powerful
    forces are determined to keep him from finding out. The term gaslighting wasn’t
    as popular then as it is today, but every military and government official in
    the movie is engaged in exactly that—trying to convince Neary, and other ordinary
    people like him, not to trust their own eyes. “Now, there are all kinds of ideas
    that would be fun to believe in—mental telepathy, time travel, immortality, even
    Santa Claus,” a condescending government spokesman says to a group of UFO witnesses.
    At the film’s climax, the Army invents a story about a chemical-weapons spill
    as an excuse for evacuating a swath of Wyoming where the aliens are expected to
    land. If they hadn’t finally shown themselves at the end of the movie—in a sky-filling,
    strobe-lit mother ship too awe-inspiring to conceal—there’s no doubt the U.S.
    government would have gone on hiding the truth forever. That’s just what it tries
    to do in Spielberg’s next alien movie, E.T. the Extra-Terrestrial , from 1982.
    When the government learns that Elliott, a young boy, is hiding an adorable alien,
    his entire house is sealed off in a plastic tarp—a quarantine that also serves
    as a perfect concealment. When the boy and the alien manage to break out, they
    are pursued by agents with guns, escaping with the aid of a bicycle and the power
    of imagination. The lesson of these movies is clear: Trust yourself, not the government.
    It’s a message deeply in the American grain, and science fiction has been amplifying
    it for decades. In the long-running TV series The X-Files , the FBI agents Mulder
    and Scully battle the “Syndicate,” a conspiracy at the highest levels of power
    to sell out the human race to alien invaders. The Men in Black movies play the
    idea for laughs, imagining a world where law enforcement keeps tabs on aliens
    living among us in disguise. The titular agents use a “neuralyzer” device to wipe
    the memory of anyone who stumbles upon the secret. D isclosure Day promises a
    new kind of UFO story, in which government secrecy is defeated and the world finally
    learns the truth. Spielberg may be a half century older than when he made Close
    Encounters , but he clearly hasn’t lost his power to read the mood of American
    culture. In the past decade, a profound shift has taken place in the way we talk
    and think about UFOs. To quote the title of a 2025 documentary on the subject,
    we are living in “The Age of Disclosure.” The most important sign of this change
    is that aliens have become respectable. It used to be that only supermarket tabloids
    such as the National Enquirer reported on UFO sightings; now they are seriously
    discussed in mainstream media and congressional hearings. Even the term UFO has
    fallen out of favor, tainted by its long association with crankery. Government
    officials and true believers alike now prefer to talk about UAP . At first the
    acronym stood for “unidentified aerial phenomena,” but aerial was soon changed
    to anomalous , to include all kinds of “space, airborne, submerged, and transmedium
    objects.” That is how UAP are defined in the mission statement of the All-Domain
    Anomaly Resolution Office, a government agency created in 2022 “to synchronize
    efforts across the Department of Defense, and with other U.S. federal departments
    and agencies, to detect, identify and attribute objects of interest.” Our age
    of disclosure was born on December 16, 2017, when The New York Times published
    an article headlined “ Glowing Auras and ‘Black Money’: The Pentagon’s Mysterious
    U.F.O. Program .” The story revealed that, from 2007 to 2012, the Defense Department
    had allocated approximately $22 million to the Advanced Aerospace Threat Identification
    Program (AATIP), a secret task force charged with investigating reports of flying
    objects that maneuver and accelerate in ways that ordinary aircraft cannot. Such
    sightings aren’t new. Americans have been noticing inexplicable things in the
    sky since World War II, when pilots over Germany reported being followed by glowing
    balls that they nicknamed “foo fighters.” The term unidentified flying object
    was coined in the early 1950s to describe such phenomena in a neutral, noncommittal
    fashion. But of course, what made UFOs fascinating was the possibility that they
    could be extraterrestrial spacecraft. In 1966, public concern about the issue
    prompted the Air Force to convene a panel of scientists to review UFO reports.
    The committee, headed by the physicist Edward Condon, bluntly concluded that such
    sightings were meaningless, blaming them on “inexperienced, inept, or unduly excited”
    observers who mistake ordinary sights like planets and balloons for flying saucers.
    “Nothing has come from the study of UFOs in the past 21 years that has added to
    scientific knowledge,” the committee reported, and “further extensive study of
    UFOs probably cannot be justified.” That verdict led the U.S. military to stop
    officially taking notice of sightings, even by its own pilots. But the 2017 revelations
    about AATIP seemed to prove what advocates of disclosure had always maintained:
    Though the Pentagon publicly denied that it had any evidence of aliens, it actually
    knew they were real. In fact, it possessed videos of encounters between UAP and
    American military aircraft. The Times and other news outlets published several
    of these videos online—low-resolution black-and-white footage of what looked like
    a small blob zooming over the ocean. All of this respectful attention drove a
    transformation in public opinion. In 1996, a Newsweek poll found that 20 percent
    of Americans believed that UFOs were “probably alien ships or alien life forms.”
    When a YouGov poll asked the same question in 2022, that figure had increased
    to 34 percent . Even people who don’t think aliens have been here are now much
    more likely to believe that they will be here soon. In 1996, 69 percent of Americans
    thought that humanity would not contact aliens in the next half century; by 2022,
    only 39 percent did. No wonder politicians who would once have scoffed at UFOs
    began to see them as a winning issue. Disclosure has never seemed closer than
    it did on July 26, 2023, when the House Oversight Committee held an open hearing
    on UAP as a national-security threat. Witnesses with apparently unimpeachable
    credentials testified under oath that the U.S. military has been hiding its knowledge
    of UFOs for decades. David Fravor, a retired Navy pilot, said that in 2004, his
    fighter squadron encountered a “white Tic Tac object” in the sky off the coast
    of San Diego. The craft had “no rotors, no rotor wash, or any sign of visible
    control surfaces like wings,” yet it was able to outrun fighter jets. David Grusch,
    a former Air Force intelligence officer, made even more explosive claims. “I was
    informed in the course of my official duties of a multi-decade UAP-crash retrieval
    and reverse-engineering program” that operated in secret, “above congressional
    oversight,” Grusch testified. In interviews with journalists, he was more explicit,
    saying that the U.S. government possessed both intact spacecraft and extraterrestrial
    bodies. Last year’s documentary The Age of Disclosure includes similar claims.
    Pilots talk about seeing objects with no wings or engines that seemed to defy
    the laws of physics, or at least the limits of human technology; Fravor mentions
    an oval-shaped object that could move at speeds of “32,000 miles an hour.” The
    narrator of the film, Luis Elizondo—a former Army intelligence officer who worked
    on AATIP—talks about a Defense Department effort he calls the “Legacy Program,”
    which has “been capturing, retrieving, and reverse engineering UAPs since at least
    1947. On numerous occasions, these retrievals included the bodies of nonhumans.”
    These are exactly the kinds of admissions that disclosure was supposed to bring,
    and though the more outlandish claims were denied by the government and treated
    skeptically by the mainstream media, they couldn’t be ignored—not when they were
    taken seriously by people such as Secretary of State Marco Rubio and former Director
    of National Intelligence James Clapper, both of whom appear in The Age of Disclosure
    . Who could blame UFO believers for thinking that the world was about to change
    in profound and disconcerting ways? “This is Disclosure. This is it Right Now,”
    a Reddit user announced on r/UFOs, a forum with hundreds of thousands of weekly
    visitors, in the aftermath of the House hearings. “If you have loved ones, it
    may be a good idea to begin deciding how you will broach the subject, especially
    if they are dependents.” In the Disclosure Day trailer, one character asks what
