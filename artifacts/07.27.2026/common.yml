  body_text: '| Next | Section menu | Main menu | Previous | Lauren Goode The Big
    Story Aug 12, 2025 6:00 AM Lisa Su Runs AMD—and Is Out for Nvidia’s Blood While
    everyone else has been talking about Nvidia’s GPUs, Lisa Su has discreetly turned
    AMD into a chipmaking phenom. And as the US-China tech war rages, she’s at the
    center of it all. Lisa Su at the AMD headquarters in Austin, Texas. Photograph:
    Linda Liepina A piece of advice if you’re meeting with Lisa Su: Wear sneakers.
    Su, the leader of AMD , moves fast these days, though I suspect that’s always
    been the case. Her company''s chips underpin the artificial intelligence that’s
    changing the world at breakneck speeds. To hear Su and literally everyone else
    in semiconductors talk about it, the US is in an AI race with China—and the rules
    keep changing . The Trump administration has once again shifted its stance on
    what kind of chips can and can’t be shipped to China, with the latest decree being
    that the US will take a 15 percent cut of AMD and Nvidia chip sales to China.
    Meanwhile, on the home front, Su has claimed that AMD’s newest AI chips can outperform
    Nvidia’s—part of her strategy to keep eroding Nvidia’s dominance in the market.
    So, yeah: Be ready to keep up. Under Lisa Su, the stalwart American semiconductor
    company has reasserted itself as a force in the age of AI. “Reasserted” doesn’t
    do it justice: Su took a struggling AMD and executed a 10-year turnaround that
    has been, as one economist put it, nothing short of remarkable. Since 2014, when
    Su took over as CEO, AMD’s market cap has risen from around $2 billion to nearly
    $300 billion. Aside from her well-known bona fides, Su herself—what drives her,
    what inspires her, what irritates her, where her politics lie—is less known. This
    is what I was hoping to learn when I visited AMD’s offices and labs in the hills
    of Austin, Texas, on a day in late June when the wind seemed to do little more
    than push heat around. The Big Interview Read more deep, weird, smart conversations
    with the most important people in our world. Our conversation kicked off with
    China, which accounts for nearly a quarter of AMD’s business. She betrayed no
    anxiety. Su now travels frequently to Washington, DC, to grease the wheels. “We’ve
    come to realize that export controls are a bit of a fact of life,” she told me,
    “just given how critical the chips that we make are.” In other words, it’s precisely
    because AMD’s chips are so darn important—to national security, to national economies—that
    they’re now at the heart of modern statecraft. Another thing I learned about Su:
    She plays the long game. Politics is a cakewalk compared to what she’s managed
    to pull off professionally. Su was born in Taiwan in 1969 and raised in Queens,
    New York. Her father worked for the city as a statistician; her mother was an
    accountant who became an entrepreneur in her mid-forties. Su earned a doctoral
    degree in electrical engineering from MIT, then went on to stints at Texas Instruments,
    IBM, and Freescale Semiconductor, where she served in executive roles. After joining
    AMD in 2012, she quickly rose to COO. As Su tells it, six months in, the chairman
    of the board called her and said, “It’s time, Lisa.” Su’s response: “Really? That
    seems kinda quick.” As CEO, Su smartly steered AMD toward the high-performance
    computing market. She embraced chiplets, a modular approach to building chips
    that has paid off enormously. She impressed the industry by launching the world’s
    first 7-nanometer data center GPUs. More recently, she doubled AMD’s data center
    revenue in two years. And she has struck deals with juggernauts like OpenAI, Meta,
    Google, and a couple of Elon Musk’s companies. During a keynote speech at AMD’s
    annual event this June, OpenAI CEO Sam Altman trotted onto the stage to hug it
    out with Su. These are all impressive data points. Yet AMD is still a fraction
    of the size of its most notorious competitor, the $4.4 trillion Nvidia. Comparisons
    between the two companies are inevitable—especially since Su is distant cousins
    with Nvidia CEO Jensen Huang . (I was warned that Su hates being asked about this.
    I asked anyway.) During my visit to Austin, Su led me on a tour of AMD’s test
    labs, where rows of server racks are rigged up to be put through the extremes.
    Engineers straightened up when Su paused at their stations. One of them surprised
    her with a celebratory cake in the shape of AMD’s EPYC Venice processor. Su appeared
    genuinely delighted. She posed for a photograph, then moved on to the next row
    in the lab, striding with purpose in white Prada sneakers. Along the way I fired
    questions at her, raising my voice to be heard above the din. What do models like
    DeepSeek mean for her business? Will AMD build its own LLMs? What drives Lisa
    Su? Later on, Su invited me to join her in her chauffeured car. (Alas, it was
    not one of her Porsches, which have license plates bearing the names of her favorite
    AMD chips.) The noise was gone; the walls were down. During the nearly 30-minute
    drive to the next lab, Su pressed me on my thoughts on AI, called out my skepticism,
    and shared why powering the AI revolution—particularly around health care—is personal
    to her. What is something that you would hope that the Trump administration—but
    also the general public—would understand about the AI accelerators that you’re
    making? That we, as tech companies, benefit from more users. And limiting the
    number of users in our ecosystem is actually bad, not just for AMD but really
    for the US. Because there will be alternatives out there. The idea that somehow,
    if we don’t ship chips to the rest of the world, that AI progress is going to
    stop—it’s not going to stop. AI progress is going to continue to develop, and
    we’d rather them develop on us than on someone else. There have been incentives
    recently to bring more chipmaking back to the US. What’s the most complicated
    part of bringing that manufacturing back? We absolutely should bring manufacturing
    back to the US. Absolutely, 100 percent. Why is that? Because it is such a critical
    part of national security and the economic interests. We had an ice storm here
    in the central Texas area a couple of years ago. For days nothing could move around.
    A couple of fabs around here were shut down. For good business practice, you want
    diversity. To bring manufacturing back will take time. But it’s doable. The thinking
    went from “Oh, you can’t do leading-edge manufacturing in the US” to today, how
    in TSMC’s Arizona fab we’re running some of our latest server processors, and
    it’s looking really good. So it can be done. It is more expensive, and that’s
    OK, too. I think it requires a change of mentality, that you don’t always go for
    the lowest-cost thing. Lisa Su holds a MI355 chip. Photograph: Linda Liepina When
    you became president and CEO of AMD in 2014, did you think that folks like yourself
    would be expected to weigh in so much on what’s going on in terms of geopolitical
    and social issues? Do you feel more pressure to participate in conversations with
    the current administration? Well, it certainly has changed. I wouldn’t say that
    we’re political or I’m political. You won’t see me weighing in on general social
    issues, because I don’t necessarily think that that’s where my value-add is. But
    when it comes to technology policy and where semiconductors are in the world,
    yes, we have to participate. And I wouldn’t call it increasing pressure. I would
    call it an increasing responsibility to do so, because we want the rules to be
    written right. You’re one of the most prominent women leaders in technology, in
    semiconductors. Why don’t you think you add value? Maybe value-add is not the
    right way to state it. It’s more like, my personal opinion might be interesting,
    but frankly, it’s much more important that we get the policy correct, based on
    what I consider facts. Your least favorite question these days is probably “When?”
    Meaning, when might AMD surpass Nvidia in the AI GPU market? My guess is that
    10 years ago people might’ve laughed at the idea, and now they might be more willing
    to entertain it. When I started as CEO, people would ask me, “Why are you taking
    this job?” and I would be very confused. I was like, “Are you kidding me?” To
    me, it was the best. We were a company in an industry that really matters that
    had been underperforming for a while, and I had a chance to take this team and
    do something which I felt was important. If you asked me, “What do I want to be
    when I grow up?” it was not “I want to be a CEO,” it was “I want to work on something
    that matters.” At that time, everyone was comparing us to Intel, and we would
    have to defend that. And my comments to the team are, “Look, we know what we can
    do, and let’s just show the world what we can do.” And so I mean, this notion
    of when , I don’t love this. I know the media loves this. It’s always A versus
    B, is that right? That’s what you guys— I wouldn’t say it’s A versus B. I mean,
    I think AMD is more nuanced in some ways, because you still have so many clients
    and customers who are reliant on x86 and CPUs. And you have this fast-growing
    data center business, which you grew from $6 billion in 2022 to $12.6 billion
    last year. But Nvidia is the big question right now. Look, my point is I don’t
    necessarily want to be compared against Intel or Nvidia. My vision, our vision,
    has always been, “There’s no one-size-fits-all.” You need the best in the data
    center. You need the best CPUs. You need the best AI accelerators. You need the
    best in your personal computing. We have this portfolio that is quite broad, and
    the market is humongous. It’s more than $500 billion over the next three to four
    years. We have plenty of opportunities. So, Sam Altman was at your AMD AI event
    in June, and you talked about working with OpenAI. You’re working with Meta. You’re
    working with Elon Musk’s companies, Tesla and xAI. But the reality with AMD is
    that companies like that love their Nvidia GPUs, and you’re an “also.” Do you
    want to get to the point where you’re like, “No, we are the primary partner?”
    Of course. That’s where we are today in CPUs. So if you were to ask many of those
    same companies, I think they would say that AMD is their strategic CPU partner.
    And absolutely, we expect to be there in AI as well. But I’m not impatient with
    this. You don’t want to put a time stamp on it. Look at it this way: When I first
    joined AMD in 2012, Microsoft was just an early partner for us in gaming. Over
    the past 10-plus years we’ve built a lot of trust, and now we’re cocreating with
    them, so Microsoft just announced they’re using AMD not only for their next-generation
    Xbox consoles but across their entire cloud. Our work with Meta has been absolutely
    the same way. I remember the first conversation I had with Meta, and I said, “Just
    give me a shot. I don’t have to tell you that I’m going to be the best in the
    world. I know that I’m going to prove that to you. I’m going to be your best partner.
    Not just your best technology partner but also your best partner in helping you
    get your technology infrastructure together.” And that’s what we do. At the'
