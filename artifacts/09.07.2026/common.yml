  body_text: A pilot and co-pilot from the United States have died in a fiery plane
    crash as they attempted an emergency landing in the Dominican Republic, authorities
    said. Former major league baseball all-star catcher Yadier Molina said on social
    media that the plane was bound for Texas to pick him up, along with family and
    friends. The crash occurred on Sunday near the southern coastal town of La Romana,
    according to a statement by the Dominican Institute of Civil Aviation, which described
    the pilot and co-pilot as US citizens. It was not immediately known what caused
    the crash, which was captured on a cellphone video that was widely circulated
    on social media. No passengers were onboard. “My condolences to the pilots and
    their family!” Molina wrote. He and his group were headed to Puerto Rico. Officials
    said the plane had departed from Puerto Rico and landed in the Dominican Republic
    to refuel before heading to Texas. The pilot and co-pilot reported an emergency
    shortly after taking off from the Dominican Republic, authorities said.
