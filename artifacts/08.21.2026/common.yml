  body_text: 'Voting Rights, Updated Shouts & Murmurs Voting Rights, Updated By Paul
    Rudnick July 13, 2026 Congress finally passed a comprehensive new Voting Rights
    Act prior to the midterms, which includes the following stipulations. Requirements
    for a legitimate voter I.D. in California: 1. A great smile 2. A bittersweet memoir
    of a neglectful celebrity parent 3. Poolside footage of your killer abs and/or
    breast implants filmed by your neighbor’s drone 4. A vegan breakfast that includes
    a burrito stuffed with CBD gummies 5. A text from the person who might still be
    your agent Poll-worker qualifications in Alabama: 1. Proof of illiteracy 2. An
    underage spouse who is also your grandparent 3. At least three failed Breathalyzer
    tests 4. A shotgun named after your Meemaw 5. A nude photo of yourself and a farm
    animal signed by the animal Candidates for office in New York City must: 1. Play
    weekend pickleball with the guy they call Zohran the Man 2. Be able to wear a
    yarmulke, a crucifix, and a rainbow Pride wig simultaneously 3. Own a Hamptons
    beach house that you claim is “for my kids” 4. Use the words “unhoused,” “food
    insecure,” “substance-use disorder,” and, when referring to a serial killer, “person
    with duct tape” Seattle voters must possess: 1. At least one item of clothing
